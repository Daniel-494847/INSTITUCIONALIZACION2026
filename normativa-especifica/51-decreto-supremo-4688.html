        "¿A quién se considera jefe de familia para los efectos del Reglamento (Art. 71°)?|Quien tenga por lo menos un hijo menor a su cargo|Únicamente el varón mayor de edad casado legalmente|Quien mantenga a sus padres ancianos exclusivamente|Todo profesor soltero con más de 30 años de edad|Se considera jefe de familia a quien tenga al menos un hijo menor a su cargo.",
        "¿Qué se permite en provincias y distritos escolares alejados con falta de personal docente idóneo (Art. 72°)?|Profesores de secundaria y primaria podrán acumular hasta dos cargos completos (con compatibilidad de horario)|Trabajar un máximo de dos horas semanales obligatorias|Contratar personas sin instrucción primaria básica|Ejercitar cargos directivos en tres municipios distintos|En zonas alejadas con escasez de personal se permite acumular hasta dos cargos completos si hay compatibilidad horaria.",
        "¿Qué garantiza el Artículo 73° en concordancia con el Código de Educación sobre los maestros inscritos en el Escalafón?|La inamovilidad en la función docente (no destitución ni suspensión sino por causa legal, con proceso y derecho a defensa)|La inamovilidad absoluta e incondicional ante cualquier falta grave|El derecho a cambiar de destino cada mes sin autorización|La exención de cumplir horarios de trabajo presencial|Garantiza la inamovilidad docente, prohibiendo despidos sin proceso disciplinario previo y derecho a defensa.",
        "¿Qué derecho tienen los maestros inscritos que quedaren cesantes sin culpabilidad de su parte (Art. 74°)?|Percibir el 100% del haber del cargo desempeñado hasta su restitución en un máximo de 90 días (partida global presupuestaria)|Cobrar una indemnización única de liquidación definitiva y dejar el magisterio|Trabajar obligatoriamente en ministerios de obras públicas|Perder el 50% de su sueldo durante la cesantía|Tienen derecho al 100% del sueldo por un máximo de 90 días hasta ser restituidos mediante partida global.",
        "¿En qué casos las autoridades escolares dispondrán el retiro del servicio activo por causas no culpables (Art. 75° inc. a)?|Al llegar a los 60 años de edad (jubilación obligatoria salvo excepciones) o por acogerse a jubilación voluntaria|Al cumplir 5 años de servicio ininterrumpido en zonas urbanas|Por reprobar el examen de categoría una sola vez|Al contraer matrimonio civil dentro del magisterio|El retiro obligatorio por causa no culpable procede al cumplir 60 años de edad o por jubilación voluntaria.",
        "¿Cómo se acredita el tiempo de servicios prestados en la educación fiscal y particular (Art. 76°)?|Mediante certificados expedidos por la Contraloría u oficinas pagadoras (fiscal) y directores/inspectores (particular/rural)|Mediante una declaración jurada simple firmada ante dos amigos|Con recibos comerciales de pago de alquileres|A través de un certificado de bautizo visado por la curia|Se acredita con certificados de contraloría/pagadoras para fiscal y directores/inspectores para planteles particulares o de hacienda.",
        "¿Cómo se consideran las asignaciones por categoría dentro del haber percibido por los maestros y administrativos (Art. 78°)?|Son parte integrante del haber percibido y se toman en cuenta para jubilación, aguinaldo y beneficios sociales|Son bonos extraordinarios independientes que no computan para jubilación|Se pagan únicamente en vales de consumo comercial|Constituyen fondos reembolsables al tesoro nacional|Las categorías integran el sueldo base y afectan positivamente la jubilación, aguinaldos y beneficios sociales.",
        "¿Qué validez tienen los servicios prestados por maestros normalistas en cargos administrativos del ramo educativo (Art. 79°)?|Serán válidos en el cómputo de su antigüedad para los efectos de la categorización y la jubilación|No tienen ninguna validez para la carrera docente posterior|Se computan únicamente con la mitad del tiempo real trabajado|Sirven solo para ascensos de jerarquía superior|La labor administrativa de maestros normalistas es plenamente válida para antigüedad, categorización y jubilación.",
        "¿Qué obligación tienen los maestros egresados de Escuelas Normales Rurales respecto a su destino inicial (Art. 80°)?|Servir cuando menos durante cinco años en las escuelas campesinas antes de pasar al servicio urbano (previo examen de dos cursos rurales)|Trabajar inmediatamente en colegios de capital de departamento|Prestar servicios en oficinas ministeriales de estadística|No tienen ninguna restricción territorial tras egresar|Deben servir mínimo 5 años en escuelas campesinas y aprobar cursos complementarios para pasar al área urbana.",
        "¿En qué plazo deben recabar los maestros normalistas su Título y Visación de título tras su egreso (Art. 81°)?|En el término de 2 años después de su egreso (requisito para ascender de categoría)|En un plazo máximo de 30 días calendario|Al cumplir los 10 años de docencia activa|No existe un plazo obligatorio estipulado|Deben recabar título y visación en 2 años, siendo requisito indispensable para ascender de categoría.",
        "¿Qué perciben los maestros normalistas desde su iniciación en la carrera según el Artículo 82°?|La asignación correspondiente a la quinta categoría, sin poder ser privados de este beneficio por ningún motivo|El sueldo base sin ninguna bonificación de categoría|La remuneración máxima de primera categoría directamente|Un estipendio provisional de becarios|Los normalistas arrancan percibiendo el bono de 5ª categoría desde el primer día de ejercicio.",
        "¿Qué deben hacer los funcionarios docentes y administrativos provenientes de otros servicios que pasen al Ministerio de Educación (Art. 83°)?|Cumplir el requisito de inscribirse en el Escalafón para computar antigüedad, méritos y derecho a categorías|Conservar sus categorías anteriores de forma automática sin registro|Someterse a un examen de ingreso a la escuela normal rural|Renunciar a todo derecho de antigüedad acumulada|Deben inscribirse en el escalafón para que se les reconozca antigüedad y derechos de categorización.",
        "Para efectos de categorización docente y administrativa, ¿qué servicios serán tomados en cuenta en forma exclusiva (Art. 84°)?|Única y exclusivamente los servicios prestados en el ramo de educación|Cualquier servicio prestado en ministerios de obras públicas o fuerzas armadas|Años de estudio universitario cursados en facultades ajenas|Experiencia laboral en empresas comerciales privadas|Solo se computan los servicios prestados dentro del ramo de educación.",
        "¿Qué función principal cumple la Junta Calificadora Distrital en el proceso de categorización (Art. 48°)?|Elaborar durante el primer mes del año lectivo las listas de categorizados del distrito para el pago de beneficios|Recaudar los aportes sindicales mensuales de los profesores|Evaluar el rendimiento físico y deportivo de los alumnos|Dictar sentencias penales contra directores negligentes|Elaboran las listas distritales de categorizados el primer mes del año para la oportuna asignación de pagos.",
        "¿Qué responsabilidad recae sobre los miembros de las Comisiones Distritales por violar el Reglamento (Art. 49°)?|Son responsables y cualquier calificación o pago indebido los hace pasibles de sanciones penales y restitución de lo pagado|Únicamente una llamada de atención verbal confidencial|La pérdida temporal de sus vacaciones de fin de año|No tienen ninguna responsabilidad legal personal|Las calificaciones o pagos indebidos generan responsabilidad penal y obligación de repetir el pago contra los infractores.",
        "¿Qué se establece en el Artículo 86° respecto al puntaje de méritos al concluir la calificación nacional?|Pasará a ser un factor necesario para la promoción de categoría de acuerdo con la escala de puntos establecida por el ministerio|Se utilizará únicamente para otorgar medallas de honor de oro|Quedará archivado sin ningún valor práctico para el escalafón|Reemplazará por completo el requisito de los años de servicio|El puntaje de méritos se convierte en un factor necesario para la promoción de categoría según la escala ministerial.",
        "¿Qué efecto jurídico produce la promulgación del DS N° 04688 sobre normas anteriores (Art. 87°)?|Quedan derogadas todas las disposiciones contrarias al presente Reglamento|Se mantienen vigentes en paralelo con el reglamento de 1936|Quedan suspendidas temporalmente por el lapso de un año|Requieren ratificación mediante ley del congreso|El Artículo 87° dispone la derogatoria de todas las disposiciones contrarias al nuevo reglamento.",
        "¿Quién fue el Ministro de Educación y Bellas Artes que refrendó y quedó encargado de la ejecución del DS Nº 04688 en 1957?|Fernando Diez de Medina|Hernán Siles Zuazo|José Rocha Bolaños|Hugo Moreno Córdova|El decreto está firmado por el Presidente Hernán Siles Zuazo y refrendado por el Ministro de Educación Fernando Diez de Medina."
    ]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>
</body>
</html>
