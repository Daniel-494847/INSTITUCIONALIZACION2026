        "¿Con qué periodicidad y mediante qué instrumento las Unidades Educativas deben llevar el registro de los casos sucedidos anualmente?|Anualmente, mediante el Anexo 3 (Plantilla de Registro Estadístico), consolidado y enviado a la Dirección Distrital y luego a la Departamental|En un cuaderno privado del director que no se comparte con nadie|Semanalmente por correo electrónico a la policía nacional|Mensualmente en la cartelera pública de la plaza principal|Se registra anualmente en el Anexo 3 con fines estadísticos y de gestión preventiva, enviándose a las instancias distritales y departamentales.",
        "¿Qué contiene el Anexo 1 del protocolo?|Un formato de informe de situación del estudiante y descripción breve del caso|Una lista de sanciones pecuniarias para docentes|Un rol de turnos para los porteros|Un tarifario de honorarios legales|El Anexo 1 es el 'Formato de Informe' de situación para registrar datos generales y una breve descripción del caso.",
        "¿Para qué sirve el Anexo 2 del protocolo?|Como Formulario de Derivación (Referencia) y seguimiento (contrarreferencia) hacia instituciones como DNA, SLIM o Ministerio Público|Para solicitar vacaciones colectivas del personal|Para inscribir nuevos alumnos al nivel inicial|Para solicitar dotación de pupitres al municipio|El Anexo 2 es el formulario oficial de derivación y seguimiento (referencia y contrarreferencia).",
        "¿Qué se busca lograr principalmente con la implementación del Plan Socio Comunitario Productivo sobre prevención de violencia?|Promover la participación de la comunidad educativa en la prevención de la violencia y consolidar la convivencia pacífica|Generar ingresos económicos para la cooperativa de la escuela|Cumplir un trámite burocrático sin impacto real|Evaluar el rendimiento en matemáticas de los alumnos|Busca involucrar activamente a la comunidad en la prevención y consolidación de una cultura de paz.",
        "¿Qué dispone la Disposición Transitoria Décima Segunda de la Ley N° 070 (Avelino Siñani - Elizardo Pérez) respecto a las prioridades del Estado?|Que los planes y programas intersectoriales como 'Educación sin violencia', 'Educación en derechos humanos', entre otros, deben ser implementados de forma coordinada|Que la educación técnica es la única prioridad nacional|Que el presupuesto educativo debe reducirse un 10%|Que las escuelas privadas operan sin fiscalización|Establece como prioridades la educación sin violencia, en derechos humanos, seguridad ciudadana, valores, ética, etc.",
        "¿Cuál es el propósito de la Ley N° 348 (Integral para Garantizar a las Mujeres una Vida Libre de Violencia) citada en el marco legal?|Establecer mecanismos de prevención, atención, protección y reparación a mujeres en situación de violencia, y sanción a agresores|Sancionar exclusivamente los delitos contra la propiedad privada|Regular el divorcio exprés en oficinas judiciales|Otorgar bonos de subsidio de lactancia|La Ley N° 348 busca garantizar a las mujeres una vida digna y libre de violencia mediante políticas integrales.",
        "¿Qué establece la Ley N° 264 del Sistema Nacional de Seguridad Ciudadana?|Garantizar la seguridad ciudadana promoviendo la paz y tranquilidad social en el ámbito público y privado para Vivir Bien|Obligar a los ciudadanos a portar armas de fuego en las calles|Crear puestos policiales dentro de cada aula escolar|Financiar exclusivamente patrulleros municipales|Busca garantizar la seguridad ciudadana y la paz social en coordinación con los diferentes niveles del Estado.",
        "¿Qué señala la Constitución Política del Estado (CPE) en su Artículo 60 respecto a niñas, niños y adolescentes?|Que es deber del Estado, la sociedad y la familia garantizar la prioridad del interés superior de la niña, niño y adolescente, preeminencia de derechos y protección en cualquier circunstancia|Que su cuidado es tuición exclusiva de los tribunales militares|Que los menores de edad no tienen derechos ciudadanos exigibles|Que la educación escolar es optativa según capacidad económica|El Art. 60 de la CPE consagra el interés superior y la prioridad absoluta de protección a la niñez y adolescencia.",
        "¿Qué establece el Artículo 150 de la Ley N° 548 sobre la protección en el sistema educativo?|Que la protección a la vida e integridad en la comunidad educativa implica la prevención, atención y sanción de la violencia para consolidar la convivencia pacífica|Que los directores tienen inmunidad legal ante delitos cometidos en la escuela|Que la disciplina escolar se rige por reglamentos militares internos|Que la escuela no tiene responsabilidad sobre lo que ocurre en los recreos|El Art. 150 prevé la protección de la vida e integridad de los miembros de la comunidad educativa contra la violencia.",
        "¿Qué dispone la Disposición Transitoria Décima Octava de la Ley N° 1173 de Abreviación Procesal Penal?|Que las instancias administrativas, jurisdiccionales y el Ministerio Público debían actualizar y aprobar sus protocolos de atención con perspectiva sensible no revictimizante en 90 días|Que los juicios penales deben durar un mínimo de diez años|Que se eliminan los delitos de violencia intrafamiliar|Que las escuelas pueden juzgar delitos penales directamente|Mandató la actualización y aprobación de protocolos de atención con perspectiva no revictimizante en un plazo máximo de 90 días.",
        "¿Qué se entiende por 'revictimización' según el contexto del protocolo?|La exposición innecesaria de la víctima a múltiples relatos, interrogatorios o tratos indiferentes que le hacen recordar el trauma y causan un nuevo sufrimiento emocional|El proceso terapéutico exitoso de recuperación psicológica|El castigo correctivo aplicado por los padres en el hogar|La repetición de un año escolar por inasistencia|La revictimización ocurre cuando se somete a la víctima a interrogatorios reiterados o tratos que reviven su dolor.",
        "¿Quiénes integran la comunidad educativa según el marco de la normativa boliviana?|Directoras, directores, maestras, maestros, personal administrativo, estudiantes y madres, padres o tutores|Únicamente los estudiantes matriculados y el Ministerio de Educación|Solo las juntas escolares y los gobiernos autónomos municipales|Exclusivamente el personal docente titular y emérito|La comunidad educativa comprende a directivos, docentes, administrativos, estudiantes y padres de familia.",
        "¿Cuál es el enfoque fundamental que promueve el Ministerio de Educación en sus políticas educativas para Vivir Bien?|Descolonización, despatriarcalización e interculturalidad para una educación sin asimetrías de poder|Competencia mercantil individualista y globalización externa|Centralización burocrática y selección elitista|Uniformidad cultural sin respeto a saberes locales|El ministerio impulsa enfoques descolonizadores, despatriarcalizadores e interculturales orientados al Vivir Bien comunitario.",
        "¿Qué se debe evitar estrictamente al elaborar el informe de situación de un caso de violencia (Anexo 1)?|Incluir juicios de valor, opiniones personales o supuestos por parte de quien elabora el informe, limitándose a datos objetivos|Registrar la fecha y los datos de identificación|Describir los factores de riesgo identificados|Anexar la firma de la persona responsable|El informe debe ser estrictamente objetivo, evitando emitir juicios de valor o suposiciones subjetivas.",
        "¿Qué labor deben cumplir los directores de unidades educativas respecto a los lugares inseguros del establecimiento?|Identificarlos y realizar gestiones para mejorar la seguridad (cámaras, habilitación de espacios y supervisión de áreas poco visibles como baños y canchas)|Ignorarlos si no hay presupuesto asignado por los padres|Clausurar permanentemente la escuela|Prohibir el uso del recreo escolar|Deben identificar áreas de riesgo o poca visibilidad y gestionar mejoras de seguridad y supervisión activa.",
        "¿Qué responsabilidad le compete al Ministerio de Educación en la consolidación anual de información?|Consolidar anualmente la información de casos de violencia física, psicológica y sexual remitida por las DDE y Distritales para formular políticas y planes de prevención|Ocultar las estadísticas para evitar críticas internacionales|Publicar los nombres y rostros de los estudiantes afectados en la prensa|Enviar los reportes únicamente a la policía internacional|Consolida la información estadística anual para diseñar políticas públicas eficaces de prevención.",
        "¿Qué establece el protocolo sobre la realización de trabajos escolares extra-aula por parte de los estudiantes con apoyo de maestros?|Que se realizarán en lo posible en grupo y con el consentimiento expreso de los padres, madres y/o tutores|Que los maestros pueden citar a los alumnos a su domicilio particular en horarios nocturnos|Que están totalmente prohibidos en cualquier circunstancia fuera del aula|Que no requieren supervisión ni conocimiento de los padres|Los trabajos extra-aula deben realizarse preferentemente en grupo y con autorización y conocimiento de los padres.",
        "¿Qué acción corresponde si un profesor es hallado en flagrancia cometiendo delitos de violencia sexual contra un estudiante en el recinto escolar?|Retenerlo conforme a ley, denunciar inmediatamente a la FELCV/Ministerio Público, replegarlo y activar el proceso administrativo de destitución|Darle una amonestación verbal y pedirle que renuncie en silencio|Permitirle que abandone el país sin reportar el hecho|Solucionar el conflicto mediante un acuerdo económico interno|Ante flagrancia o delitos graves se procede con la denuncia penal inmediata, el repliegue y la destitución.",
        "¿Cuál es el objetivo de fomentar la resiliencia en las víctimas de violencia durante el proceso de recuperación?|Fortalecer su capacidad de recuperarse, sobreponerse y adaptarse con éxito frente a la adversidad, desarrollando competencias personales y sociales|Lograr que olviden lo ocurrido sin necesidad de terapia psicológica|Obligarlas a trabajar en tareas escolares sin descanso|Evitar que soliciten medidas de protección legal|La resiliencia alude a la capacidad de sobreponerse a la adversidad y desarrollar competencias pese al estrés sufrido."
    ]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>
</body>
</html>
