    <script>
    // Cada pregunta: "pregunta|correcta|mala1|mala2|mala3|retroalimentación"
    const DOC={"i":"♿","f":"54-resolucion-ministerial-069-2025","n":"Resolución Ministerial N° 069/2025 — Educación Inclusiva","d":"7 de febrero de 2025","q":["¿Qué fecha fue emitida la Resolución Ministerial N° 0069/2025?|07 de febrero de 2025|12 de marzo de 2024|15 de abril de 2023|20 de diciembre de 2010|La RM N° 0069/2025 fue emitida el 07 de febrero de 2025 por el Ministerio de Educación.","¿Cuál es el objeto principal del Reglamento aprobado por la RM N° 0069/2025 (Art. 1)?|Garantizar el acceso, permanencia y conclusión de procesos educativos de estudiantes con discapacidad, dificultades en el aprendizaje y talento extraordinario en los subsistemas educativos|Regular el escalafón nacional del magisterio.|Normar exclusivamente las actividades administrativas de las direcciones distritales.|Establecer el calendario escolar de inscripciones y vacaciones.|El Artículo 1 establece que su objeto es garantizar el acceso, permanencia y conclusión mediante lineamientos pedagógicos y organizacionales.","¿Cuántos Capítulos y Artículos contiene el Reglamento para el Fortalecimiento de la Educación Inclusiva en el SEP - Modalidad Indirecta?|10 capítulos y 63 artículos|5 capítulos y 40 artículos|8 capítulos y 50 artículos|12 capítulos y 75 artículos|El reglamento está estructurado en 10 capítulos, 63 artículos y 3 disposiciones finales.","¿Cómo define el Reglamento a la Evaluación Multidisciplinaria (Art. 4)?|Un proceso de obtención y análisis de información especializada que sintetiza una valoración de las áreas del neurodesarrollo integral y educativo|Un examen punitivo de selección para ingresar a colegios privados.|Una prueba escrita de matemáticas aplicada al final de la gestión.|Un informe redactado exclusivamente por los padres de familia.|El Artículo 4 inciso a) define la evaluación multidisciplinaria como el proceso especializado de obtención y análisis del neurodesarrollo integral.","¿Qué son los Maestros de Apoyo Educativo según el Artículo 4 inciso b)?|Profesionales que desarrollan procesos de Apoyo Técnico Pedagógico en Modalidad Indirecta para equiparar y fortalecer las condiciones de acceso|Maestros encargados de reemplazar al director de la unidad educativa.|Personal administrativo encargado de la limpieza y seguridad.|Tutores particulares contratados por los padres de familia.|Son profesionales responsables de la orientación, asesoramiento, sensibilización y apoyo técnico pedagógico en modalidad indirecta.","¿Cómo se define el 'Diseño Plural para los Aprendizajes' (Art. 4 inciso g)?|Un conjunto de orientaciones curriculares para generar condiciones educativas inclusivas que alcanzan a todos los estudiantes|Un texto escolar obligatorio de venta exclusiva en el Ministerio de Educación.|Una norma de castigos corporales para estudiantes indisciplinados.|Un plan de estudios exclusivo para educación superior.|Es el conjunto de orientaciones curriculares en el marco de los principios de la Educación Inclusiva que alcanza a todos los estudiantes.","¿Qué comprende la Trayectoria Educativa según el Artículo 4 inciso j)?|El historial secuencial, cronológico e individual del recorrido educativo registrado en un Archivo Personal|El historial de amonestaciones y faltas disciplinarias del estudiante.|La lista de colegios donde estudiaron los padres de familia.|El promedio numérico final de notas de secundaria.|Es el historial secuencial e individual del recorrido educativo registrado en un archivo personal con información de logros, dificultades y recomendaciones.","¿Cuál es el ámbito de aplicación del Reglamento según su Artículo 2?|Es de aplicación obligatoria por directores, maestras, maestros, personal administrativo y autoridades de instituciones fiscales, de convenio y privadas|Solo se aplica en unidades educativas fiscales del área rural.|Es de carácter voluntario para los centros de educación privada.|Exclusivamente en institutos técnicos de educación superior.|El Artículo 2 determina su obligatoriedad en todas las instituciones educativas fiscales, de convenio y privadas del SEP.","¿Qué establece la Ley Nº 4024 mencionada en el marco jurídico (Art. 3)?|La aprobación de la 'Convención sobre los Derechos de las Personas con Discapacidad y su Protocolo Facultativo'|La Ley General del Trabajo.|La Ley de Pensiones del Sistema Integral.|La creación de las escuelas superiores de formación de maestros.|El Artículo 3 inciso b) cita la Ley Nº 4024 que aprueba dicha convención internacional.","¿Cuál es una de las finalidades principales de la Educación Inclusiva descritas en el Artículo 5?|Efectivizar la atención educativa con calidad y calidez, promoviendo la matriculación sin discriminación|Cobrar aranceles diferenciados en colegios privados según la discapacidad.|Reducir el horario escolar a solo dos horas diarias.|Seleccionar únicamente a estudiantes con notas sobresalientes.|El Artículo 5 busca efectivizar la atención con calidad, calidez y matriculación sin discriminación alguna.","¿Qué criterio rige para la inscripción de estudiantes con discapacidad, dificultades en el aprendizaje y talento extraordinario (Art. 6 inciso a)?|Las instituciones educativas inscribirán a todos, independientemente de sus condiciones del neurodesarrollo, personales, culturales, económicas y/o sociales|Deben ser rechazados si no cuentan con un certificado médico privado.|Solo pueden inscribirse en centros especiales alejados de la ciudad.|Requieren un examen de admisión obligatorio y eliminatorio.|El Artículo 6 inciso a) garantiza la inscripción universal sin discriminación por condiciones del neurodesarrollo o socioeconómicas.","¿Pueden los estudiantes con necesidades especiales inscribirse simultáneamente en el Ámbito de Educación Especial y en Educación Regular o Alternativa (Art. 6 inciso b)?|Sí, con el mismo Código de Registro Único de Estudiante (RUDE), sin ser requisito indispensable su inscripción previa en educación especial|No, está prohibido tener doble registro institucional.|Sí, pero pagando una matrícula doble obligatoria.|Solo si superan los 18 años de edad.|El Artículo 6 inciso b) permite la inscripción simultánea usando el mismo código RUDE.","¿Cuál es la diferencia máxima de edad permitida en Educación Inicial y Primaria para estudiantes con discapacidad intelectual respecto a sus pares (Art. 6 inciso d)?|Hasta 24 meses (2 años) previa presentación de evaluación multidisciplinaria|Hasta 12 meses (1 año)|Sin límite de edad en ningún curso.|Máximo 6 meses de diferencia.|El Artículo 6 inciso d) permite una diferencia de hasta 24 meses respaldada por el informe multidisciplinario.","¿Qué obligación tiene la unidad educativa de origen cuando un estudiante con necesidades especiales se traslada a otra institución (Art. 7 inciso a)?|Remitir el archivo de trayectoria educativa a la institución destinataria|Destruir el expediente académico por confidencialidad.|Cobrar una tasa de transferencia administrativa.|Guardar el archivo en el ministerio durante cinco años.|El Artículo 7 obliga a remitir el archivo de trayectoria educativa a la unidad educativa receptora.","¿Qué deben incorporar progresivamente las instituciones educativas en su Proyecto Educativo y Planificación Curricular (Art. 8 inciso a)?|El 'Diseño Plural para los Aprendizajes' en todos sus componentes|Un reglamento interno de sanciones pecuniarias.|Clases obligatorias de natación nocturna.|Manuales de contabilidad empresarial.|El Artículo 8 exige la incorporación progresiva del Diseño Plural para los Aprendizajes.","¿Qué sistemas de comunicación y lenguas deben aplicarse para facilitar el aprendizaje según el Artículo 8 inciso b)?|La Lengua de Señas Boliviana (LSB), el Sistema Braille, Sistemas Aumentativos o Alternativos y otras formas de comunicación|Únicamente el idioma inglés técnico.|Códigos secretos cifrados entre profesores.|Exclusivamente la lectura de labios.|El Artículo 8 inciso b) estipula la aplicación de LSB, Braille y sistemas aumentativos o alternativos.","¿Qué responsabilidad tienen las Direcciones Departamentales de Educación (Art. 10)?|Planificar, organizar, monitorear y evaluar las disposiciones del reglamento a través de sus subdirecciones|Contratar directamente a los profesores de todo el país mediante sorteo.|Administrar los recursos económicos de las alcaldías municipales.|Modificar los planes de estudio nacionales sin autorización.|El Artículo 10 asigna a las DDEs la planificación, organización, monitoreo y evaluación a través de sus subdirecciones.","¿Cuáles son las funciones de las Direcciones Distritales Educativas en este ámbito (Art. 11)?|Desarrollar procesos de seguimiento a centros y unidades educativas para garantizar el apoyo educativo y promover el acceso a la educación|Despedir a maestros que no sepan lenguas originarias.|Imponer multas a los padres que no compren uniformes.|Emitir títulos profesionales a nivel licenciatura.|El Artículo 11 establece el seguimiento, garantía de acceso y ampliación de servicios educativos.","¿Qué responsabilidad tienen las y los directores de instituciones educativas regulares, alternativas y superiores (Art. 12)?|Garantizar la matriculación, coordinar la atención inclusiva, sensibilizar a la comunidad y gestionar infraestructura accesible|Dictar todas las clases de apoyo de manera personal.|Cobrar cuotas de inscripción para mantenimiento de equipos.|Evitar el ingreso de estudiantes con discapacidad para proteger las estadísticas.|El Artículo 12 detalla las responsabilidades directivas sobre matriculación, sensibilización, gestión de infraestructura y accesibilidad.","¿Qué deben hacer las maestras y maestros de aula en su práctica pedagógica diaria (Art. 13)?|Desarrollar la planificación curricular y procesos educativos accesibles en el marco del Diseño Plural para los Aprendizajes y evaluación adecuada|Eximir a los estudiantes especiales de toda tarea escolar.|Aislar a los alumnos con dificultades en el fondo del aula.|Delegar toda la enseñanza al maestro de apoyo sin intervenir.|El Artículo 13 exige desarrollar procesos accesibles bajo el Diseño Plural para los Aprendizajes y evaluaciones pertinentes.","¿Qué deberes tienen los estudiantes que no presentan necesidades especiales respecto a sus compañeros (Art. 14 inciso b)?|Promover acciones que prevengan todo tipo de violencia, acoso y/o bullying, respetando la individualidad y diversidad|Ayudarles a realizar sus exámenes escritos obligatoriamente.|Informar al director sobre las limitaciones físicas de sus compañeros.|Ninguno en particular.|El Artículo 14 inciso b) fomenta la prevención de violencia, acoso y el respeto mutuo en la comunidad estudiantil.","¿Qué responsabilidad tienen las madres, padres de familia o tutores (Art. 15)?|Apoyar y orientar a sus hijos, promover la convivencia armónica y solicitar pruebas de detección temprana ante señales de alerta|Sustituir al profesor cuando este se encuentre ausente por enfermedad.|Financiar la construcción de rampas de acceso en el colegio.|Imponer calificaciones en el cuaderno pedagógico.|El Artículo 15 establece la corresponsabilidad familiar, apoyo, convivencia pacífica y solicitud de detección oportuna.","¿Cuál es el rol de los directores de los Centros de Educación Especial (Art. 16)?|Organizar las acciones técnico-pedagógicas de los maestros de apoyo (modalidad indirecta) y coordinar con las instituciones inclusivas|Imponer sanciones administrativas a los directores de educación regular.|Evaluar el desempeño financiero de las universidades privadas.|Cerrar unidades educativas que no cumplan los requisitos.|El Artículo 16 dispone organizar la modalidad indirecta, coordinar capacitaciones, garantizar calidad y hacer seguimiento.","¿Qué funciones específicas cumplen las maestras y maestros de apoyo (Art. 17)?|Asesorar, orientar y capacitar al personal docente en el Diseño Plural para los Aprendizajes y coordinar acciones pedagógicas con la familia|Dictar clases particulares pagadas fuera de la institución.|Firmar libretas escolares en reemplazo del director distrital.|Realizar trámites de compras para la alcaldía.|El Artículo 17 detalla la asesoría, capacitación docente, coordinación y presentación de informes mensuales.","¿Qué se exige al personal administrativo y de servicio de las instituciones educativas (Art. 18)?|Capacitarse progresivamente para brindar un trato de respeto y calidez adecuado a estudiantes con necesidades educativas|Dominar obligatoriamente cinco idiomas extranjeros.|Confeccionar material didáctico en braille de forma obligatoria.|No tener contacto directo con los estudiantes.|El Artículo 18 establece la capacitación progresiva para garantizar una convivencia comunitaria y comunicacional respetuosa.","¿Qué perfil debe poseer el maestro de apoyo para estudiantes con discapacidad auditiva (Art. 19 y 20)?|Alto nivel de conocimiento y fluidez en la Lengua de Señas Boliviana (LSB), además de manejo del Diseño Plural para los Aprendizajes|Título en medicina general con especialidad en otorrinolaringología.|Conocimientos básicos de computación sin dominar la LSB.|Experiencia exclusiva en traducción de textos en inglés.|Los Artículos 19 y 20 exigen fluidez en LSB, conocimiento normativo y aplicación del Diseño Plural para los Aprendizajes.","¿Qué busca el proceso de interpretación de la LSB a la lengua oral y viceversa (Art. 22)?|Eliminar barreras de comunicación transmitiendo información accesible, clara y precisa, evitando la traducción literal o incoherente|Realizar una traducción literal palabra por palabra sin importar el sentido.|Demostrar la superioridad de la lengua oral sobre la de señas.|Reducir el tiempo de explicación de los contenidos en clase.|El Artículo 22 busca accesibilidad clara y precisa, previniendo traducciones literales erróneas o sobreproducciones.","¿Qué condiciones de presentación y vestimenta debe cuidar el intérprete o maestro de apoyo de LSB (Art. 23)?|Vestimenta adecuada y cómoda, sin distractores visuales como joyas vistosas o prendas muy llamativas que afecten la comunicación|Usar disfraces llamativos para captar la atención de los alumnos sordos.|Llevar accesorios metálicos brillantes y prendas fluorescentes.|No hay ninguna recomendación sobre su vestimenta.|El Artículo 23 exige ropa cómoda sin distractores visuales (joyas o prendas llamativas) en respeto a la cultura sorda.","¿Qué perfil y conocimientos debe tener el maestro de apoyo para estudiantes con discapacidad visual (Art. 27 y 28)?|Dominio de signografía Braille (grados 1 y 2), código matemático unificado, tiflología, tiflotecnología y adaptaciones en macrotipo|Especialidad en oftalmología quirúrgica.|Conocimiento exclusivo de lectura rápida en pantallas digitales.|Habilidad para redactar únicamente textos en tinta.|Los Artículos 27 y 28 detallan el dominio de braille, tiflología, tiflotecnología y producción de materiales en relieve o macrotipo.","¿Cuál es el objetivo principal del apoyo educativo a estudiantes con discapacidad visual (Art. 29)?|Garantizar acceso, permanencia y conclusión mediante estrategias tiflológicas para lograr independencia y autonomía personal y social|Enseñar al estudiante a depender de un lazarillo humano permanente.|Eximir al alumno de la lectura de textos complejos.|Reemplazar los libros de texto por grabaciones de audio exclusivamente.|El Artículo 29 se centra en garantizar el recorrido educativo y la autonomía mediante estrategias tiflológicas.","¿Qué responsabilidad corresponde a los maestros de aula que trabajan con estudiantes con discapacidad visual (Art. 31)?|Desarrollar estrategias pedagógicas con elementos sonoros, relieve, macrotipo o contraste de color, aplicando evaluaciones accesibles|Calificar al estudiante únicamente con base en exámenes orales sin material escrito.|Aislar al estudiante durante las evaluaciones prácticas.|Reducir el contenido de la materia al 50%.|El Artículo 31 exige privilegiar elementos sonoros, relieve, macrotipo y evaluaciones adaptadas.","¿Qué formación complementaria debe tener el maestro de apoyo para estudiantes con discapacidad intelectual (Art. 32)?|Formación post-gradual inherente al área de atención y formación continua en áreas afines|Un curso intensivo de contabilidad y finanzas.|Experiencia en la enseñanza de educación física competitiva.|Ninguna formación especializada, solo título normalista general.|El Artículo 32 especifica formación post-gradual y continua en el área de discapacidad intelectual.","¿Qué requisito documental se exige para la atención de estudiantes con discapacidad intelectual en educación regular (Art. 33 inciso b)?|Contar con el informe de evaluación integral multidisciplinario que establezca que el currículo adecuado es el regular|Presentar un certificado de buena conducta emitido por la policía.|Una carta notariada firmada por el alcalde municipal.|Ningún documento es necesario.|El Artículo 33 inciso b) exige el informe multidisciplinario que avale el desarrollo curricular en educación regular.","¿Qué funciones específicas cumple el maestro de apoyo en discapacidad intelectual (Art. 35)?|Orientar a las familias, acompañar a los maestros de aula, realizar seguimiento y participar en la comisión técnica pedagógica|Reemplazar al maestro de aula en el dictado de materias teóricas.|Administrar los recursos financieros de la unidad educativa.|Decidir la expulsión de alumnos con bajo rendimiento.|El Artículo 35 detalla la orientación familiar, acompañamiento docente, cumplimiento de recomendaciones y talleres de sensibilización.","¿Qué perfil se requiere para el apoyo educativo a estudiantes con Trastornos del Espectro Autista - TEA (Art. 36)?|Maestro o profesional con formación inicial y especialización post-gradual inherente al área de atención|Título en ingeniería de sistemas con mención en robótica.|Certificado de participación en talleres virtuales sin aval académico.|Experiencia en administración escolar.|El Artículo 36 estipula formación especializada complementaria en el área de autismo.","¿A qué población con TEA está dirigido principalmente el ámbito de apoyo según el Artículo 37?|Estudiantes con Trastornos del Espectro Autista sin compromiso intelectual ni trastornos funcionales del lenguaje matriculados en regular, alternativa y superior|Únicamente a adultos mayores con autismo severo.|Estudiantes con autismo profundo recluidos en centros psiquiátricos.|Exclusivamente a niños menores de 3 años.|El Artículo 37 enfoca la atención en estudiantes con TEA sin compromiso intelectual ni trastornos funcionales severos del lenguaje.","¿Qué funciones cumple el maestro de aula que atiende a estudiantes con discapacidad intelectual o autismo (Art. 39)?|Detectar señales de alerta tempranas, incorporar sugerencias del apoyo técnico, aplicar adaptaciones curriculares y evaluar según perfiles de salida|Eximir al estudiante de toda calificación oficial.|Modificar el plan de estudios nacional de manera unilateral.|Solicitar el traslado obligatorio del estudiante a otra escuela.|El Artículo 39 detalla la detección temprana, aplicación de adaptaciones metodológicas, coordinación estrecha y evaluación pertinente.","¿Qué perfil debe poseer el maestro de apoyo en el área de Dificultades en el Aprendizaje (Art. 40)?|Profesional con amplio conocimiento de lineamientos inclusivos, diseño plural, adaptaciones curriculares y procesos de detección y evaluación|Especialista en contabilidad y auditoría financiera.|Técnico en mantenimiento de equipos de computación.|Licenciado en literatura clásica universal.|El Artículo 40 destaca el dominio de lineamientos, diseño plural, adaptaciones y detección de dificultades de aprendizaje.","¿Cuál es la cobertura prioritaria para el apoyo en Dificultades en el Aprendizaje (Art. 41)?|Unidades educativas que atienden el nivel de Educación Primaria Comunitaria Vocacional, con énfasis en 1ro, 2do y 3ro (preventivo) y 4to, 5to y 6to (reeducativo)|Exclusivamente el nivel de educación superior universitaria.|El nivel de educación inicial en familia comunitaria exclusivamente.|Los últimos cursos de educación secundaria productiva.|El Artículo 41 establece la cobertura en primaria, enfocando un carácter preventivo en los primeros cursos y reeducativo en los superiores.","¿Cuál es el objetivo del proceso de apoyo educativo en Dificultades en el Aprendizaje (Art. 42)?|Fortalecer acciones educativas y metodológicas para responder a las necesidades y superar paulatinamente las dificultades mediante atención pertinente|Sancionar al estudiante por bajo rendimiento académico.|Retener al alumno en el mismo curso hasta que memorice los contenidos.|Derivar automáticamente al estudiante a un centro de educación especial permanente.|El Artículo 42 busca fortalecer metodologías para superar las dificultades en el aula regular.","¿Qué procedimiento debe seguir el maestro de aula al observar señales de alerta de dificultades en el aprendizaje (Art. 44 inciso c)?|Aplicar la 'Guía de Observación - Detección de Signos de Riesgo de Dificultades en el Aprendizaje' y derivar para evaluación multidisciplinaria|Bajarle la nota de disciplina de forma inmediata.|Ocultar la información a los padres para no alarmarlos.|Suspender al estudiante temporalmente de clases.|El Artículo 44 detalla la aplicación de la guía de observación y la derivación para obtener un diagnóstico válido.","¿Qué perfil académico exige el Reglamento para el profesional de apoyo en el área de Talento Extraordinario (Art. 46)?|Profesional con formación académica pertinente, manejo de instrumentos de evaluación psicométrica y conocimiento normativo del área|Cualquier profesor titulado de educación física.|Un profesional en derecho mercantil e internacional.|Estudiantes universitarios de los primeros semestres.|El Artículo 46 exige formación académica pertinente y manejo de pruebas psicométricas y normativas.","¿Quiénes son los responsables iniciales de la detección de estudiantes con Talento Extraordinario (Art. 48)?|Las maestras y maestros de aula de las unidades educativas de educación regular, en coordinación con la Comisión Técnica Pedagógica|Exclusivamente los psicólogos contratados por las alcaldías.|Los directores departamentales de educación.|Los padres de familia mediante una carta notariada.|El Artículo 48 designa a los maestros de aula como responsables de la detección inicial de señales de alerta.","¿Cómo se realiza la identificación formal de estudiantes con Talento Extraordinario (Art. 49)?|Por los Equipos Multidisciplinarios mediante evaluación psicológica y/o psicopedagógica integral con instrumentos estandarizados|Mediante una votación entre los compañeros de curso.|A través de un sorteo público en la dirección distrital.|Con un examen escrito de opción múltiple elaborado por los padres.|El Artículo 49 estipula la evaluación psicológica/psicopedagógica integral con instrumentos estandarizados por equipos multidisciplinarios.","¿Qué deben incluir las Direcciones Departamentales y Distritales en sus POAs respecto al Talento Extraordinario (Art. 50 inciso b)?|Acciones de sensibilización, capacitación, seguimiento y fomento a estudiantes con talento extraordinario en coordinación con CEEs acreditados|Presupuesto para la compra de premios en efectivo para los mejores alumnos.|Viajes internacionales de estudio obligatorios para los alumnos destacados.|Sanciones para los colegios que no tengan alumnos sobresalientes.|El Artículo 50 obliga a incluir acciones de sensibilización, capacitación y fomento en sus POAs.","¿Qué normativa deben solicitar las instituciones educativas a los Gobiernos Subnacionales para la eliminación de barreras arquitectónicas (Art. 52)?|El Reglamento de Accesibilidad y Eliminación de Barreras Arquitectónicas aprobado por Resolución Ministerial Nº 0410/2016|Códigos municipales de construcción urbana generales sin relación educativa.|Normas internacionales de arquitectura europea.|Ordenanzas de tránsito vehicular.|El Artículo 52 remite a la RM Nº 0410/2016 sobre accesibilidad y eliminación de barreras arquitectónicas.","¿Qué previsión se debe adoptar en cuanto a la ubicación de los paralelos que cuenten con estudiantes con discapacidad físico-motora (Art. 53)?|Deben ubicarse en proximidad a la puerta principal de entrada o salida, así como a los baños destinados para su uso|Deben asignarse obligatoriamente en las plantas altas para mejorar su ventilación.|Deben instalarse en ambientes alejados para evitar ruidos molestos.|No importa la ubicación dentro de la infraestructura.|El Artículo 53 prioriza la ubicación cercana a la entrada y a los baños para facilitar la accesibilidad físico-motora.","¿A qué instancia corresponde garantizar la dotación de equipamiento mobiliario adecuado para estudiantes con discapacidad (Art. 54)?|A los Gobiernos Autónomos Municipales en el marco de sus competencias concurrentes|A los padres de familia mediante cuotas extraordinarias.|A las empresas privadas mediante patrocinios comerciales.|Directamente al Ministerio de Economía y Finanzas Públicas.|El Artículo 54 recuerda la obligación de los Gobiernos Autónomos Municipales en la dotación de mobiliario adecuado.","Según el Artículo 55, ¿cuál es la relación docente-estudiante y carga horaria individualizada para Dificultades Específicas en el Aprendizaje?|Más de 20 estudiantes promedio por ítem completo con 4 horas mensuales individualizadas|5 estudiantes con 12 horas mensuales.|4 estudiantes con 8 horas mensuales.|No aplica carga horaria.|El cuadro del Artículo 55 establece más de 20 estudiantes promedio por ítem con 4 horas mensuales individualizadas.","Según el Artículo 55, ¿cuál es la relación y carga horaria para el área de Discapacidad Auditiva?|Más de 4 estudiantes promedio por ítem completo con 8 horas mensuales individualizadas|Más de 20 estudiantes con 4 horas.|Más de 5 estudiantes con 12 horas.|15 estudiantes sin carga horaria.|El Artículo 55 estipula más de 4 estudiantes promedio con 8 horas mensuales individualizadas para discapacidad auditiva.","Según el Artículo 55, ¿cuál es la relación y carga horaria para el área de Discapacidad Visual?|Más de 5 estudiantes promedio por ítem completo con 12 horas mensuales individualizadas|Más de 20 estudiantes con 4 horas.|Más de 4 estudiantes con 8 horas.|No aplica carga horaria.|El Artículo 55 establece más de 5 estudiantes promedio con 12 horas mensuales individualizadas para discapacidad visual.","¿De qué instancia dependen administrativamente los maestros de apoyo de la Modalidad Indirecta que trabajan en Educación Regular y Alternativa (Art. 56)?|Dependen directamente del Centro de Educación Especial y su control está a cargo de los directores de los CEEs|Dependen exclusivamente del director de la unidad educativa regular donde prestan apoyo.|Dependen directamente del Ministerio de Gobierno.|Son independientes y no rinden cuentas a ninguna autoridad.|El Artículo 56 aclara que dependen directamente del Centro de Educación Especial y del control de su director.","¿En qué situaciones el alcance territorial del apoyo educativo en Modalidad Indirecta puede extenderse de forma intermunicipal o interdistrital (Art. 57)?|Por inexistencia de CEEs en el municipio, falta de acreditación en el área requerida o por situaciones de distancia y zonas dispersas|Únicamente cuando el maestro de apoyo lo decida por comodidad personal.|Está prohibido bajo cualquier circunstancia salir del municipio.|Solo por orden expresa de la junta de vecinos.|El Artículo 57 autoriza la extensión intermunicipal o interdistrital ante inexistencia de CEEs, falta de acreditación o zonas de difícil acceso.","¿A qué se refiere la cobertura educativa mediante maestros itinerantes o de apoyo en zonas dispersas (Art. 58)?|Atender lugares de difícil acceso, zonas fronterizas o ribereñas, y a personas que por razones fortuitas o socioeconómicas extremas no pueden apersonarse al CEE|Viajar al exterior del país para buscar estudiantes becados.|Atender únicamente a centros urbanos con más de 100 mil habitantes.|Realizar supervisiones turísticas a unidades educativas.|El Artículo 58 regula la cobertura en zonas dispersas, fronteras y casos extremos donde no pueden apersonarse al CEE.","¿Qué es el Plan de Apoyo Técnico Pedagógico (Art. 59)?|El instrumento de planificación de acciones operativas que realiza el maestro de apoyo en coordinación con el maestro de aula para viabilizar los procesos educativos|Un contrato de trabajo notariado entre el maestro y el padre de familia.|Un informe financiero anual presentado a la alcaldía.|Un examen final obligatorio para los estudiantes integrados.|El Artículo 59 define el plan de apoyo como el instrumento operativo coordinado entre maestros de apoyo y de aula.","¿Cómo se debe efectuar la matriculación de estudiantes que acceden a los apoyos educativos de los Centros de Educación Especial (Art. 61)?|De forma simultánea en el Centro de Educación Especial y en la institución educativa de otro subsistema usando el mismo código RUDE|Únicamente en el centro de educación especial sin registrarse en regular.|Primero concluyendo la escuela regular y luego inscribiéndose en especial años después.|Mediante una matrícula provisional pagada en efectivo.|El Artículo 61 exige la matriculación simultánea en ambas instituciones utilizando el mismo código RUDE.","¿Qué función cumple la Comisión Técnica Pedagógica respecto a los maestros de apoyo (Art. 62)?|Podrá convocarlos para fines de información, orientación, asesoramiento y capacitación|Evaluar sus notas trimestrales y sancionarlos si reprueban.|Asignarles nuevas funciones administrativas ajenas a su especialidad.|Cambiarlos de unidad educativa sin autorización distrital.|El Artículo 62 faculta a la CTP a convocar a los maestros de apoyo para asesoramiento, orientación y capacitación.","¿A qué instancia corresponde la revisión y actualización periódica del Reglamento (Art. 63)?|Al Ministerio de Educación a través del Viceministerio de Educación Alternativa y Especial|A las juntas escolares de padres de familia a nivel nacional.|A los sindicatos de trabajadores de educación urbana y rural.|A las universidades privadas de forma autónoma.|El Artículo 63 encarga la revisión y actualización al Ministerio de Educación a través del VEAE.","¿Qué establece la Disposición Final Segunda sobre el Escalafón Docente?|Los artículos del reglamento no modifican el Escalafón Docente establecido en la Ley Nº 070|Se anula el escalafón para todos los maestros de educación especial.|Se crea una nueva categoría dorada para profesores inclusivos.|Se rebaja de categoría a los docentes que no atiendan alumnos integrados.|La Disposición Final Segunda aclara que el reglamento no modifica el Escalafón Docente vigente.","¿Cómo se resuelven los aspectos técnico-pedagógicos de apoyo educativo no previstos en el Reglamento (Disposición Final Tercera)?|A través de instructivos emitidos por el Viceministerio respectivo previo informe técnico de la Dirección General correspondiente|Mediante votación en asamblea general de profesores.|Esperando la emisión de una nueva ley en el parlamento nacional.|Aplicando criterios personales del director distrital de turno.|La Disposición Final Tercera establece que los vacíos se resolverán mediante instructivos del viceministerio con informe técnico.","¿Qué se establece sobre la vigencia del Reglamento (Disposición Final Primera)?|Entra en vigencia a partir de la emisión de la Resolución Ministerial de aprobación y su publicación por los medios definidos|Entra en vigencia después de cinco años de prueba piloto.|Rige únicamente para la gestión pasada.|Requiere la aprobación de los gobiernos municipales antes de aplicarse.|La Disposición Final Primera fija su entrada en vigencia a partir de la emisión de la RM y su respectiva publicación.","¿Qué normas específicas abroga la Resolución Ministerial N° 0069/2025 (Artículo 3 de la RM)?|Se abrogan todas las disposiciones contrarias al presente instrumento|Únicamente las resoluciones de la gestión 2010.|Ninguna norma anterior queda afectada.|Se abroga totalmente la Ley de la Educación Avelino Siñani.|El Artículo 3 de la Resolución Ministerial establece la abrogatoria de todas las disposiciones contrarias.","¿Qué informe legal fundamentó la emisión de la RM N° 0069/2025 y la aprobación del reglamento?|El Informe Legal INNEAE No. 0015/2025 emitido por la Especialista en Seguimiento Normativo del VEAE|Un informe emitido por el Ministerio de Economía y Finanzas.|Un dictamen del Tribunal Supremo de Justicia.|Un informe de la Contraloría General del Estado.|Los Vistos y Considerandos de la RM N° 0069/2025 citan el Informe Legal INNEAE No. 0015/2025.","¿Qué recomienda el Informe Técnico INNEAE/DGEE No. 0026/2025 mencionado en los considerandos?|Aprobar el reglamento para cubrir vacíos pedagógicos, técnicos y legales que afectaban a los estudiantes del ámbito de educación especial matriculados en regular, alternativa y superior|Cerrar temporalmente los centros de educación especial.|Reducir el personal docente de apoyo en un cincuenta por ciento.|Trasladar la dirección de educación especial a otro departamento.|El considerando II detalla que el informe técnico recomendó la aprobación para cubrir vacíos pedagógicos, técnicos y legales.","¿Qué instancia del Ministerio de Educación queda encargada del cumplimiento de la disposición normativa (Artículo 4 de la RM)?|El Viceministerio de Educación Alternativa y Especial a través de la Dirección General de Educación Especial, Direcciones Departamentales, Subdirecciones y DGAA|El Ministerio de Relaciones Exteriores.|Las Fuerzas Armadas de la Nación.|El Ministerio de Obras Públicas.|El Artículo 4 de la RM N° 0069/2025 asigna la ejecución a las instancias de educación especial y departamentales.","¿Cuál es el rol de los Centros de Educación Especial frente a las instituciones educativas inclusivas (Art. 16 inciso b)?|Coordinar tareas de apoyo técnico pedagógico, capacitación docente según necesidades en el marco del Diseño Plural y acciones de sensibilización|Imponer sanciones económicas a los directores que rechacen alumnos.|Dictar clases obligatorias de fin de semana cobrando aranceles.|Revisar los balances contables de los colegios privados.|El Artículo 16 inciso b) dispone la coordinación técnica, capacitación y sensibilización con las instituciones inclusivas.","¿Qué se establece respecto al informe escrito que deben presentar los maestros de apoyo (Art. 17 inciso h)?|Deben reportar un informe escrito del proceso de apoyo técnico pedagógico al Centro de Educación Especial con visto bueno de la institución educativa correspondiente|Presentar un informe anónimo una vez cada cinco años.|Entregar el informe únicamente a la junta escolar de vecinos.|Publicar sus informes en redes sociales institucionales.|El Artículo 17 inciso h) exige reporte escrito del apoyo técnico pedagógico al CEE con el visto bueno de la institución educativa.","¿Qué objetivo persigue el proceso de apoyo educativo a estudiantes con discapacidad auditiva en el aula (Art. 21)?|Garantizar acceso, permanencia y conclusión mediante orientaciones pedagógicas y coordinación en el marco del Diseño Plural para los Aprendizajes|Lograr que el estudiante sordo hable oralmente de forma perfecta sin usar señas.|Reducir las exigencias académicas al mínimo nivel posible.|Reemplazar al maestro titular de la materia de forma permanente.|El Artículo 21 busca garantizar el acceso, permanencia y conclusión mediante lineamientos y el Diseño Plural.","¿Qué deben hacer los maestros de apoyo en discapacidad auditiva respecto a palabras nuevas y abstractas (Art. 24 inciso e)?|Explicarlas mediante ejemplificación y contextualización con situaciones reales en LSB, usando recursos lingüísticos adecuados|Ignorarlas para no confundir al estudiante con conceptos difíciles.|Obligar al alumno a memorizarlas en castellano escrito sin traducción.|Pedir que los padres las expliquen en casa por la noche.|El Artículo 24 inciso e) instruye explicar conceptos nuevos y abstractos mediante ejemplos reales y contextualización en LSB.","¿Qué deben hacer los maestros de apoyo en discapacidad visual respecto a la coordinación con los maestros de aula (Art. 30 inciso g)?|Coordinar previa y obligatoriamente el avance de contenidos planificados para consolidar condiciones educativas pertinentes|Actuar de forma independiente sin consultar al maestro titular de la materia.|Coordinar únicamente al finalizar el año escolar.|Dejar que el maestro de aula resuelva los problemas visuales solo.|El Artículo 30 inciso g) exige coordinación previa y obligatoria sobre los contenidos planificados para consolidar la pertinencia."]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>
</body>
</html>
