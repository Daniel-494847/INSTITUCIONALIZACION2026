        "¿Cómo se relacionan los tres niveles de formación en la evaluación (Art. 31)?|En forma articulada y complementaria a través del abordaje y valoración de las dimensiones Ser, Saber, Hacer y Decidir|De forma aislada e independiente sin conexión|Aplicando un solo examen idéntico para kínder y secundaria|Subordinando primaria a los criterios de educación superior|El Artículo 31 destaca la articulación y complementación dimensional en todo el subsistema.",
        "¿Qué formas de evaluación se aplican en Educación Primaria Comunitaria Vocacional (Art. 46)?|Evaluación de maestros a estudiantes, autoevaluación y evaluación comunitaria|Examen escrito mensual y defensa oral|Pruebas de suficiencia trimestral y pasantías|Evaluación externa nacional estandarizada|El Artículo 46 reitera las tres formas principales de evaluación en el nivel primario.",
        "¿Qué expresa la Libreta Escolar Electrónica en Educación Inicial (Art. 40)?|Los logros y dificultades de los procesos educativos de la niña o el niño, con estricta correspondencia con el cuaderno pedagógico|Notas numéricas reprobatorias|Un ranking de posición frente a sus compañeros|La asistencia exacta en horas y minutos|El Artículo 40 define la libreta como documento oficial que describe logros y dificultades en correspondencia con el cuaderno pedagógico.",
        "¿Qué instrumentos y estrategias se emplean en Educación Inicial para evaluar (Art. 43)?|Instrumentos lúdicos, creativos y artísticos como estrategias de evaluación|Exámenes escritos de opción múltiple con tiempo cronometrado|Cuestionarios teóricos sobre gramática y cálculo|Pruebas de selección con penalización de errores|El Artículo 43 prioriza instrumentos lúdicos, creativos y artísticos adecuados a la edad.",
        "¿Qué funciones tiene la Directora o Director de unidad educativa en la evaluación (Art. 9)?|Realizar seguimiento y apoyo técnico pedagógico, centralizar información de calificaciones, convocar a reuniones y derivar casos especiales|Dictar clases en los cursos donde falte el titular de forma permanente|Modificar arbitrariamente las notas registradas por los maestros|Cobrar las multas por retrasos de los profesores|El Artículo 9 numeral II detalla las responsabilidades directivas en seguimiento, centralización y derivación.",
        "¿Quiénes son responsables del registro de calificaciones en el Sistema de Información Educativa (SIE) en Secundaria (Art. 9)?|El tutor, en coordinación con la maestra o maestro de Área de Saberes y Conocimientos|Únicamente el director distrital|Los estudiantes representantes de curso|Los padres de familia del consejo educativo|El Artículo 9 numeral IV inciso i) asigna dicha responsabilidad al tutor en coordinación con el maestro de área.",
        "¿Quiénes son responsables del registro en el SIE en Inicial y Primaria (Art. 9)?|Las maestras y los maestros de aula|Los secretarios administrativos de la unidad educativa|Los directores de núcleo|Los propios estudiantes bajo supervisión|El Artículo 9 numeral IV inciso h) estipula que los maestros de aula en inicial y primaria realizan el registro en el SIE.",
        "¿Quién es responsable de la generación del archivo digital y la impresión de la Libreta Escolar Electrónica al finalizar el trimestre (Art. 9)?|La Directora o Director de la unidad educativa o núcleo, en coordinación con la asesora o asesor de curso|El Ministerio de Educación de forma centralizada|Cada padre de familia desde su domicilio|La junta escolar del distrito|El Artículo 9 numeral IV inciso j) establece que la dirección y el asesor de curso generan e imprimen la libreta debidamente firmada y sellada.",
        "¿Qué se establece sobre las sesiones de valoración para población en desventaja social (Art. 13)?|La Comisión Técnico Pedagógica establece fecha y hora, comunicando al interesado y/o progenitores para comparecer a la unidad educativa|Se realizan de forma secreta sin conocimiento de los padres|Son optativas y se resuelven mediante una llamada telefónica|Se postergan hasta el inicio de la siguiente gestión|El Artículo 13 indica que la CTP fija fecha y hora comunicando oportunamente a los interesados.",
        "¿Qué valor legal tiene el Acta Supletoria de Promoción (Art. 18)?|Tiene valor legal igual a la Libreta Escolar Electrónica|Ninguno, es un documento provisional sin validez oficial|Solo sirve para trámites internos de la alcaldía municipal|Requiere convalidación judicial previa en un juzgado|El Artículo 18 ratifica que el acta supletoria posee idéntico valor legal que la libreta escolar electrónica.",
        "¿Qué rol cumple la Defensoría de la Niñez y Adolescencia en relación con los estudiantes en desventaja social y sus padres (Art. 19)?|Coordinar acciones en caso necesario para garantizar el compromiso de corresponsabilidad en el proceso formativo|Asumir la tutela legal permanente de todos los estudiantes|Imponer sanciones penales a los maestros negligentes|Financiar los materiales escolares de los alumnos|El Artículo 19 señala la coordinación con la Defensoría cuando sea necesario para respaldar la corresponsabilidad familiar.",
        "¿Qué objetivos persigue la evaluación según el Artículo 4 del RE-EDC?|Enfatizar la investigación exploratoria, contribuir al desarrollo integral, brindar información a la comunidad, orientar a la CTP y apoyar a maestros y estudiantes|Sancionar económicamente a las unidades educativas con bajo rendimiento|Clasificar a los colegios en un ranking departamental de notas|Reemplazar los planes de estudio oficiales|El Artículo 4 detalla los objetivos múltiples de la evaluación orientados a la mejora educativa y el desarrollo integral.",
        "¿Cómo se toman las decisiones y recomendaciones de la Comisión Técnico Pedagógica (Art. 6)?|Por consenso, debiendo ser asumidas por las maestras y maestros de los diferentes niveles, áreas y campos|Por imposición directa del Director sin consultar a nadie|Por votación de simple mayoría con voto dirimente del padre de familia|Mediante sorteo entre las propuestas presentadas|El Artículo 6 numeral III estipula que las decisiones de la CTP se toman por consenso y son de cumplimiento institucional.",
        "¿Qué funciones cumple la CTP en cuanto al análisis de limitaciones y debilidades (Art. 8)?|Deliberar sobre las formas de intervención en la detección de limitaciones para tomar acciones oportunas en beneficio de los estudiantes|Sancionar con suspensión temporal a los alumnos distraídos|Trasladar a los profesores observados a zonas alejadas|Reducir las horas de clase de las materias difíciles|El Artículo 8 inciso b) le otorga la función de deliberar sobre formas de intervención ante limitaciones de los estudiantes.",
        "¿Qué deben hacer las maestras y maestros respecto a la información de resultados a los estudiantes (Art. 9)?|Brindar información en cualquier momento del desarrollo curricular respecto a los resultados obtenidos en la evaluación|Guardar los resultados en secreto hasta la entrega de libretas trimestrales|Publicar las notas en las redes sociales personales del docente|Informar únicamente a los padres de familia y excluir al estudiante|El Artículo 9 numeral IV inciso e) obliga a brindar información en cualquier momento sobre los resultados de la evaluación.",
        "¿Qué se evalúa en la dimensión del 'Decidir' en relación con la comunidad (Art. 31)?|La participación y compromiso social de la o el estudiante en organizaciones de la comunidad educativa|La asistencia a desfiles cívicos obligatorios|El pago de cuotas sindicales de los padres|La votación en elecciones políticas generales|El Artículo 31 numeral 4 inciso c) valora la participación y compromiso social en la comunidad educativa.",
        "¿Cómo se realiza la evaluación en el desarrollo de saberes técnico-tecnológicos y artísticos (Art. 31)?|Se valoran en la dimensión del Saber y del Hacer mediante procesos prácticos y productivos|Se eximen de evaluación por no ser materias teóricas principales|Se califican únicamente de forma cualitativa sin nota numérica|Se evalúan mediante la memorización de manuales técnicos|Los saberes técnico-tecnológicos y artísticos se abordan e integran en las dimensiones del Saber y del Hacer.",
        "¿Qué rol cumple la evaluación en la reorientación de la práctica pedagógica (Art. 3)?|Permite a la comunidad educativa identificar logros, capacidades y dificultades para la toma de decisiones, reorientando oportunamente la práctica pedagógica|Ninguno, la práctica pedagógica es rígida e invariable|Sirve únicamente para sancionar al maestro si el promedio es bajo|Permite cambiar de profesores cada trimestre|El Artículo 3 resalta que la valoración sirve para reorientar oportunamente la práctica pedagógica a partir del diálogo.",
        "¿Qué se estipula en las Disposiciones Transitorias del RE-EDC (Disposición Transitoria Única)?|Aspectos operativos y de adecuación temporal para la implementación del reglamento en la gestión educativa vigente|La suspensión de las clases escolares por dos años|La anulación de los títulos de bachiller anteriores|La privatización paulatina de todas las escuelas fiscales|Las disposiciones transitorias regulan la transición y aplicación armónica del reglamento en el periodo establecido."
    ]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=shuf(DOC.q).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="bar"><div style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="box"><small>Pregunta '+(st.n+1)+' de '+st.qs.length+'</small><h3>'+q.t+'</h3><div id="o"></div><div id="f"></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll(".opt")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.classList.add("ok")});
        if(t===q.c)st.ok++;else b.classList.add("ko");
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<p class="fb"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</p>':'')+'<button class="btn" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="box"><h2>Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p>'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button class="btn" onclick="start()">Reintentar</button><a class="btn g" href="../index.html">Volver al Panel</a></div>';
    }
    start();
    </script>
</body>
</html>
