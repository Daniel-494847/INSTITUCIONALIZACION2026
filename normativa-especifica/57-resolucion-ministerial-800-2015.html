        "¿Qué se valora en la dimensión del 'Hacer'?|Habilidades, destrezas prácticas, experimentación y aplicación productiva de los conocimientos en la realidad|La memorización pasiva de textos sin aplicación práctica|La expresión exclusiva de sentimientos poéticos|La asistencia obligatoria a reuniones políticas|El Hacer se relaciona con la práctica, las destrezas y los procesos productivos.",
        "¿Qué comprende la dimensión del 'Decidir'?|Capacidad de tomar decisiones con sentido comunitario, compromiso social, pensamiento crítico y transformación de la realidad|La decisión individual de abandonar los estudios ante la primera dificultad|La elección de cargos públicos partidarios|La selección de textos de lectura recreativa|El Decidir implica impacto social, compromiso comunitario y transformación.",
        "¿Por qué es importante la convalidación de saberes y conocimientos previos en educación alternativa?|Porque reconoce y valora la experiencia laboral y empírica de las personas adultas para acelerar su titulación y formación|Porque exime al estudiante de asistir a cualquier tipo de centro educativo|Porque permite regalar títulos sin ningún tipo de evaluación|Porque reemplaza los planes nacionales por criterios comerciales|Reconoce la experiencia y saberes acumulados en la práctica laboral y de la vida.",
        "¿Qué función cumple la coordinación interinstitucional en el desarrollo de programas de educación alternativa y técnica?|Articular la formación con el aparato productivo, empresas y demandas laborales de la comunidad|Cobrar impuestos a los talleres artesanales locales|Controlar las actividades ideológicas de los centros|Restringir la creación de nuevos cursos técnicos|Permite vincular la formación técnica con las necesidades productivas y laborales del entorno.",
        "¿Cómo se manejan los reclamos de los participantes respecto a errores involuntarios en sus calificaciones o libretas?|A través de un conducto regular técnico-administrativo ante el CEA y la Dirección Distrital para su corrección gratuita en el SIE|Mediante demandas judiciales penales directas contra el ministro|Destruyendo el sistema informático del centro educativo|No existe ningún mecanismo de rectificación de errores|Existen procedimientos técnicos establecidos para la rectificación formal y gratuita de errores.",
        "¿Qué rol cumple la investigación educativa en los Centros de Educación Alternativa?|Conectar los procesos formativos con la solución de problemas concretos de la comunidad y la optimización pedagógica|Redactar libros teóricos sin aplicación práctica nacional|Evaluar el coeficiente intelectual de los vecinos del barrio|Justificar el incremento de aranceles institucionales|La investigación vincula el aprendizaje con la transformación y solución de problemas comunitarios.",
        "¿Qué se garantiza mediante la emisión oportuna de libretas y certificados al finalizar cada período académico?|La continuidad educativa sin interrupciones, la inserción laboral y el ejercicio pleno de los derechos académicos del participante|La clausura anticipada de las actividades escolares del año siguiente|La obligación de matricularse obligatoriamente en universidades del exterior|El cobro de multas por mora en la entrega de documentos|Otorga seguridad jurídica y continuidad para el trabajo o estudios superiores.",
        "¿Qué principios ideológicos sustentan el Modelo Educativo en el que se enmarca la RM N° 800/2015?|Descolonización, despatriarcalización, comunitaria, productiva, intracultural, intercultural y plurilingüe|Individualismo liberal y competencia mercantil extrema|Centralismo burocrático y exclusión social|Homogeneización cultural sin participación comunitaria|Se fundamenta en los principios descolonizadores, comunitarios y productivos del Estado Plurinacional.",
        "¿Cómo se demuestra el compromiso de las autoridades educativas con la calidad en educación alternativa?|Mediante la dotación de normas claras, sistemas digitales seguros, fiscalización y apoyo técnico constante a los centros|Mediante el abandono de la supervisión pedagógica en zonas rurales|Reduciendo el presupuesto destinado a la capacitación docente|Promoviendo la informalidad en la entrega de títulos|Se refleja en la provisión de marcos normativos seguros, digitales y apoyo técnico permanente.",
        "¿Qué responsabilidad asumen los gobiernos subnacionales respecto a la infraestructura de educación alternativa?|Apoyar en la provisión, mantenimiento y adecuación de infraestructura y equipamiento en el marco de sus competencias|Imponer directrices pedagógicas y planes de estudio nacionales|Contratar y despedir a los maestros de aula directamente|Emitir libretas de calificaciones electrónicas municipales|Los gobiernos municipales y departamentales tienen atribuciones concurrentes en infraestructura y equipamiento.",
        "¿Qué importancia tiene la educación permanente dentro del subsistema alternativo y especial?|Promover procesos formativos comunitarios no escolarizados que respondan a las necesidades de la vida y la producción social|Sustituir completamente a la educación primaria de menores|Ofrecer títulos universitarios de posgrado a distancia|Capacitar únicamente a funcionarios públicos jerárquicos|La educación permanente fomenta procesos comunitarios orientados a la vida y la producción social.",
        "¿Qué se busca prevenir mediante la digitalización de registros académicos en el SIE?|La pérdida de información histórica de los participantes y la falsificación de documentos de egreso|El uso de internet en las unidades educativas del país|La participación de los estudiantes en actividades deportivas|La revisión de notas por parte de los directores distritales|La digitalización previene la pérdida de archivos y frena la falsificación documental.",
        "¿Cómo se evalúa el éxito de la aplicación de la RM N° 800/2015 en los centros de educación alternativa?|A través de la emisión fluida, transparente, sin observaciones y oportuna de libretas y certificados electrónicos a nivel nacional|Mediante la huelga indefinida de los centros educativos|Con el incremento de denuncias por corrupción administrativa|A través de la paralización total del sistema informático|El éxito se evidencia en la emisión fluida, oportuna y transparente de los documentos de certificación.",
        "¿Qué derechos tienen los participantes respecto a sus calificaciones al concluir un módulo o semestre?|Conocer los resultados de su evaluación de manera oportuna y transparente para fines de continuidad o nivelación|Modificar personalmente sus notas en el sistema informático|Exigir calificaciones aprobatorias sin haber rendido evaluaciones|Recibir bonos económicos por cada nota alta obtenida|Los participantes tienen derecho a conocer oportunamente sus resultados con absoluta transparencia.",
        "¿Qué características debe cumplir el diseño de los formularios electrónicos de libretas y certificados?|Estar normalizados institucionalmente, incluir medidas de seguridad, datos nominales exactos y firmas digitales autorizadas|Ser diseñados libremente por cada participante con colores llamativos|Carecer de marcas de agua o sellos institucionales|Imprimirse en hojas de papel común sin formato oficial|Los formatos oficiales están estandarizados e incorporan rigurosas medidas de seguridad y datos nominales.",
        "¿Qué representa la firma del director del CEA en los documentos electrónicos de calificación?|La validación institucional y la fe del contenido académico registrado en el marco de sus atribuciones legales|Un requisito decorativo sin implicancias jurídicas|La autorización para realizar cobros de dinero al participante|Una delegación de responsabilidades al Ministerio de Relaciones Exteriores|La firma del director avala la validez legal e institucional de los registros académicos.",
        "¿Cuál es la finalidad última de todo el andamiaje normativo y técnico de la RM N° 800/2015?|Consolidar un sistema educativo alternativo eficiente, transparente, inclusivo y con plena seguridad jurídica en la certificación|Complicar los trámites administrativos de los centros educativos|Disminuir la cantidad de personas tituladas en el país|Fomentar la burocracia documental en formato físico|Busca consolidar un sistema eficiente, transparente, seguro e inclusivo en beneficio de los participantes."]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>
    <script src="../leer.js"></script>
</body>
