        "¿Qué estipula la norma sobre el monto de la pensión escolar en institutos privados durante la gestión (Art. 56.II)?|Tendrá vigencia durante toda la Gestión Educativa 2026, sin posibilidad de incremento posterior tras la firma|Puede incrementarse a medio año según la inflación del dólar|Se modifica trimestralmente de acuerdo a la demanda de alumnos|Es fijada mensualmente por el centro de estudiantes|El monto de la pensión pactado en contrato rige para toda la gestión sin incrementos posteriores.",
        "¿Hasta qué fecha límite de 2026 los institutos privados debían presentar trámites de apertura y funcionamiento (Art. 59.II)?|Hasta el 31 de julio de 2026|Hasta el 09 de enero de 2026|Hasta el 03 de agosto de 2026|Hasta el 11 de septiembre de 2026|Los trámites de apertura y ratificación en institutos privados deben presentarse hasta el 31 de julio de 2026.",
        "¿Qué se determina en casos de delitos como violación, estupro o acoso sexual en contra de estudiantes (Art. 61)?|Presentar la denuncia ante la autoridad competente de manera inmediata y coadyuvar en la investigación|Resolver el conflicto mediante una conciliación privada interna en el instituto|Esperar la conclusión del semestre para sancionar con amonestación escrita|Ocultar el hecho para no dañar el prestigio institucional|Obliga a denunciar de manera inmediata ante autoridades competentes y coadyuvar en la investigación penal.",
        "¿Qué dispone la normativa respecto a las estudiantes embarazadas en los institutos (Art. 62)?|Queda terminantemente prohibido suspenderlas o expulsarlas, debiendo brindarles apoyo académico para culminar|Deben solicitar licencia obligatoria de un año completo sin derecho a examen|Deben pasar clases en turno nocturno separado del resto de alumnos|Se les sugiere cambiar de instituto de forma voluntaria|Prohíbe suspenderlas o expulsarlas y obliga a otorgar apoyo académico para garantizar su continuidad.",
        "¿Qué obligación tienen directivos, docentes y administrativos respecto al certificado de formación en Prevención de Violencia (Art. 65.II)?|Deben contar con el certificado en el marco del DS N° 3981 hasta el 06 de julio de 2026, registrado en el RP-DGESTTLA|Es un requisito opcional que no genera ninguna obligación|Deben presentarlo únicamente al momento de jubilarse|Solo aplica para el personal de intendencia y portería|Deben contar obligatoriamente con el certificado de prevención de violencia registrado hasta el 6 de julio de 2026.",
        "¿Qué prohíbe el Artículo 66.I sobre bebidas alcohólicas y estupefacientes en los institutos?|Su consumo, venta y presentarse en estado de ebriedad en instalaciones académicas, prácticas o comunitarias|Únicamente su consumo durante las horas nocturnas de fin de semana|Permitir su venta en tiendas escolares autorizadas por el centro|No existe prohibición si es fuera del aula principal|Prohíbe terminantemente consumo, venta y presentarse bajo efectos de alcohol o estupefacientes en actividades académicas.",
        "¿Qué prohíbe tajantemente el Artículo 67 respecto a los estudiantes y las movilizaciones?|Obligar o utilizar a los estudiantes en movilizaciones para protestas, reclamos o campañas políticas|Participar en marchas deportivas organizadas por los municipios|Fundar centros de estudiantes independientes|Realizar huelgas de hambre pacíficas dentro de los predios|Prohíbe utilizar u obligar a los estudiantes a participar en protestas, marchas o campañas políticas.",
        "¿Qué establece la Disposición Final Primera sobre aspectos no contemplados en la normativa superior (Disposición Final 1)?|Serán regulados mediante instructivos emitidos por el Viceministerio de Educación Superior de Formación Profesional|Deben resolverse mediante votación en el parlamento nacional|Quedan a criterio personal de cada centro privado|No se pueden resolver bajo ninguna circunstancia|Los vacíos o aspectos no contemplados se regulan mediante instructivos del Viceministerio de Educación Superior.",
        "¿Qué acciones asumirá el ministerio ante directivos o personal que incumplan estas disposiciones (Disposición Final Segunda)?|Acciones legales y administrativas contra directivos, docentes y administrativos infractores|Una llamada de atención verbal confidencial|Un descuento del 5% en su factura de luz|Ninguna acción punitiva|El ministerio asumirá acciones legales y administrativas directas contra quienes incumplan la normativa.",
        "¿Qué artículo del Reglamento de Evaluación del Desarrollo Curricular de Regular (RM N° 0190/2024) fue derogado por la RM N° 0001/2026 (Art. 3.I)?|El Artículo 49|El Artículo 15|El Artículo 31|El Artículo 60|El Artículo 3 de la RM N° 0001/2026 abroga/deroga expresamente el Artículo 49 del RE-EDC de educación regular por la nueva escala de dimensiones.",
        "¿Qué se establece en relación a la vigencia de normas contrarias a la RM N° 0001/2026 (Art. 3.II)?|Se derogan todas las disposiciones normativas contrarias a la presente resolución ministerial|Se mantienen vigentes durante toda la gestión 2026|Quedan sujetas a aprobación departamental|Solo se aplican en institutos privados|Deroga de forma general todas las disposiciones normativas que contraríen la presente resolución.",
        "¿Qué modelo educativo fundamenta las normas generales de la gestión 2026 (Art. 1)?|El Modelo Educativo Sociocomunitario Productivo (Ley N° 070)|El modelo pedagógico europeo tradicional|El sistema de educación competitiva por competencias de mercado|El modelo conductista de enseñanza programada|Todo el marco normativo se fundamenta en el Modelo Educativo Sociocomunitario Productivo de la Ley Nº 070.",
        "¿Quiénes son los encargados de la difusión, aplicación y cumplimiento de las normas de educación superior (Art. 4 de la RM)?|Viceministerios, DDEs, subdirecciones, distritales y directores de instituciones fiscales, privadas y de convenio|Únicamente los rectores de universidades estatales|Los gobiernos autónomos municipales de forma exclusiva|Las federaciones de fabriles y campesinos|El Artículo 4 de la resolución encarga su difusión y cumplimiento a todas las estructuras del sistema educativo y departamental.",
        "¿Qué se instruye realizar a las subdirecciones de educación superior respecto al funcionamiento institucional (Art. 9.II)?|La verificación in situ del funcionamiento de todas las instituciones fiscales, de convenio y privadas de forma semestral|Recibir un reporte anual telefónico sin visitar los institutos|Cobrar multas mensuales presenciales en cada instituto|Controlar únicamente las asistencias de los directores|Las subdirecciones son responsables de la verificación in situ y semestral del funcionamiento de los institutos.",
        "¿Qué se garantiza para los estudiantes con discapacidad en la formación superior técnica y tecnológica (Art. 63)?|Apoyo en la formación académica por parte de los directivos y representantes legales en instituciones fiscales, de convenio y privadas|Su eximición absoluta de toda actividad práctica de taller|Su traslado obligatorio a centros de educación especial nocturnos|La entrega automática de títulos sin cursar materias|El Artículo 63 establece la obligación de apoyar en la formación académica a los estudiantes con discapacidad en todos los institutos."]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>

</html>
