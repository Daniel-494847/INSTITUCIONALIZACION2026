<body>

        <header class="text-center mb-4">

    <script>
    // Cada pregunta: "pregunta|correcta|mala1|mala2|mala3|retroalimentación"
    const DOC={"i":"📜","n":"Constitución Política del Estado","d":"CPE 2009","q":["¿Cómo se constituye Bolivia según el Art. 1?|Estado Unitario Social de Derecho Plurinacional Comunitario|República unitaria presidencialista|Estado federal plurinacional|Estado confederado laico|El Art. 1 define a Bolivia como Estado Unitario Social de Derecho Plurinacional Comunitario, libre, independiente, soberano, democrático, intercultural, descentralizado y con autonomías.","¿Qué garantiza el Art. 2 a las naciones y pueblos indígena originario campesinos?|Su libre determinación en el marco de la unidad del Estado|La independencia territorial|Su separación del Estado|Solo el uso de su idioma|Se garantiza la libre determinación: autonomía, autogobierno, cultura, instituciones y entidades territoriales, siempre dentro de la unidad del Estado.","¿Quiénes conforman la nación boliviana (Art. 3)?|Bolivianas y bolivianos, naciones y pueblos indígena originario campesinos, comunidades interculturales y afrobolivianas|Solo los bolivianos por nacimiento|Solo los pueblos indígenas|Los ciudadanos mayores de 18 años|El Art. 3 incluye a todos esos sectores, que en conjunto constituyen el pueblo boliviano.","¿Qué establece el Art. 4 sobre la religión?|El Estado es independiente de la religión|El Estado tiene religión oficial católica|Se prohíbe toda religión|La religión es obligatoria en escuelas|El Estado respeta y garantiza la libertad de religión y de creencias espirituales, y es independiente de la religión (Estado laico).","¿Cuántos idiomas oficiales mínimo deben usar el Gobierno plurinacional y los departamentales?|Al menos dos, uno de ellos el castellano|Solo el castellano|Tres idiomas|Uno a elección|El Art. 5 reconoce el castellano y los idiomas de los pueblos indígena originario campesinos; se deben usar al menos dos idiomas oficiales.","¿Cuál es la capital de Bolivia (Art. 6)?|Sucre|La Paz|Cochabamba|Santa Cruz|El Art. 6 señala que Sucre es la Capital de Bolivia.","¿Cuál de estos es un símbolo del Estado según el Art. 6?|La wiphala|El cóndor andino|El charango|La Pachamama|Entre los símbolos están la bandera tricolor, el himno, el escudo, la wiphala, la escarapela, la kantuta y el patujú.","¿Dónde reside la soberanía según el Art. 7?|En el pueblo boliviano|En el Presidente|En la Asamblea Legislativa|En el Órgano Judicial|La soberanía reside en el pueblo boliviano, se ejerce de forma directa y delegada, y es inalienable e imprescriptible.","¿Qué significa ama qhilla, ama llulla, ama suwa (Art. 8)?|No seas flojo, no seas mentiroso ni seas ladrón|Vivir bien|Tierra sin mal|Vida armoniosa|Es el principio ético-moral que el Estado asume y promueve junto con suma qamaña (vivir bien), ñandereko, teko kavi, ivi maraei y qhapaj ñan.","¿Qué prohíbe el Art. 10?|La instalación de bases militares extranjeras|Las fuerzas armadas|Los tratados internacionales|El servicio militar|Bolivia es un Estado pacifista; rechaza la guerra de agresión y prohíbe bases militares extranjeras.","¿Qué formas de democracia reconoce el Art. 11?|Directa y participativa, representativa y comunitaria|Solo representativa|Directa y militar|Representativa y corporativa|La democracia se ejerce de forma directa y participativa, representativa y comunitaria.","¿Qué órganos conforman el poder público (Art. 12)?|Legislativo, Ejecutivo, Judicial y Electoral|Ejecutivo, Judicial y Militar|Legislativo, Ejecutivo y Judicial|Ejecutivo, Electoral y Contralor|El Estado se organiza en cuatro órganos con independencia, separación, coordinación y cooperación.","¿Cómo son los derechos reconocidos por la Constitución (Art. 13)?|Inviolables, universales, interdependientes, indivisibles y progresivos|Temporales y revocables|Jerarquizados|Solo para ciudadanos|El Art. 13 añade que la clasificación de derechos no determina jerarquía entre ellos.","¿Qué hace el Estado frente a la discriminación (Art. 14)?|La prohíbe y sanciona en todas sus formas|La tolera en privado|Solo la sanciona en lo laboral|La regula sin sancionar|El Art. 14 enumera motivos como sexo, color, edad, orientación sexual, idioma, religión, discapacidad y embarazo.","¿Existe la pena de muerte en Bolivia (Art. 15)?|No existe|Existe para delitos graves|Solo en tiempo de guerra|Existe para traición a la patria|El Art. 15 establece que no existe la pena de muerte, y protege la vida y la integridad física, psicológica y sexual.","¿Qué derecho reconoce el Art. 17 sobre educación?|Recibir educación en todos los niveles, universal, productiva, gratuita, integral e intercultural, sin discriminación|Educación gratuita solo en primaria|Educación solo privada|Educación obligatoria hasta la universidad|Es un derecho fundamental recogido también en el Art. 77 y siguientes.","¿Cómo es el sistema único de salud (Art. 18)?|Universal, gratuito, equitativo, intracultural, intercultural y participativo|De pago parcial|Solo privado|Solo para trabajadores|El Estado garantiza la inclusión y el acceso a la salud sin exclusión ni discriminación.","¿Qué dice el Art. 20 sobre agua y alcantarillado?|Son derechos humanos, no son objeto de concesión ni privatización|Pueden concesionarse|Son servicios solo privados|No son derechos|Están sujetos a régimen de licencias y registros conforme a ley.","¿Qué derecho civil reconoce el Art. 21 numeral 1?|A la autoidentificación cultural|Al porte de armas|A la doble nacionalidad obligatoria|A la objeción fiscal|Entre los derechos civiles están privacidad, libertad de pensamiento, reunión, expresión, información y residencia.","¿En qué plazo debe resolverse la situación jurídica de una persona aprehendida en flagrancia (Art. 23)?|Máximo 24 horas|48 horas|72 horas|8 horas|La aprehensión solo busca conducir a la persona ante autoridad judicial competente, que resuelve en 24 horas.","¿Cuándo pueden interceptarse comunicaciones privadas (Art. 25)?|Solo con autorización judicial|Con orden policial|Con orden del fiscal|Nunca, bajo ninguna circunstancia|El domicilio y las comunicaciones son inviolables salvo autorización judicial; la prueba obtenida con violación no produce efecto legal.","¿Cómo es el sufragio y desde qué edad se ejerce (Art. 26)?|Igual, universal, directo, individual, secreto, libre y obligatorio, desde los 18 años|Voluntario desde los 16 años|Obligatorio desde los 21 años|Público desde los 18 años|El Art. 26 también garantiza participación equitativa entre hombres y mujeres.","¿Cuál es una causal de suspensión de derechos políticos (Art. 28)?|Defraudación de recursos públicos, con sentencia ejecutoriada|Cambiar de domicilio|No votar|Ser extranjero|También: tomar armas y servir en fuerzas enemigas en guerra, y traición a la patria, mientras la pena no haya sido cumplida.","¿Qué caracteriza a una nación y pueblo indígena originario campesino (Art. 30)?|Su existencia es anterior a la invasión colonial española|Su origen es posterior a la república|Su ubicación en áreas rurales|Su idioma castellano|Comparte identidad cultural, idioma, tradición histórica, instituciones, territorialidad y cosmovisión.","¿A quién extiende derechos el Art. 32?|Al pueblo afroboliviano|A los extranjeros residentes|A los migrantes|A los menores de edad|El pueblo afroboliviano goza de los derechos económicos, sociales, políticos y culturales de los pueblos indígena originario campesinos.","¿Cómo califica el Art. 37 al derecho a la salud?|Función suprema y primera responsabilidad financiera del Estado|Servicio opcional|Responsabilidad de las familias|Servicio privado|Se prioriza la promoción de la salud y la prevención de enfermedades.","¿Qué garantiza el Art. 46 respecto al trabajo?|Trabajo digno, con seguridad industrial, higiene y salario justo|Trabajo sin contrato|Salario solo mínimo|Trabajo obligatorio|Se prohíbe el trabajo forzoso u otro modo de explotación sin consentimiento y justa retribución.","¿Hasta cuándo rige la inamovilidad laboral de mujeres embarazadas y progenitores (Art. 48)?|Hasta que la hija o el hijo cumpla un año|Hasta los seis meses|Hasta los dos años|Hasta que ingrese a la escuela|El Art. 48 VI también prohíbe despedir a las mujeres por estado civil, embarazo, edad o número de hijos.","¿Hasta cuándo gozan de fuero sindical los dirigentes (Art. 51)?|Hasta un año después de finalizada su gestión|Solo durante su gestión|Hasta tres años|Hasta seis meses|No se les disminuyen derechos sociales ni se les persigue por actos sindicales.","¿Qué garantiza el Art. 53?|El derecho a la huelga|El derecho a la reelección|El derecho al lockout|La jornada de 6 horas|La huelga es la facultad legal de suspender labores para defender derechos, conforme a ley.","¿A quién se considera niña, niño o adolescente (Art. 58)?|A toda persona menor de edad|A menores de 12 años|A menores de 16 años|A menores de 14 años|Son titulares de los derechos de la Constitución y de derechos específicos de su desarrollo.","¿Qué efectos tienen las uniones libres o de hecho (Art. 63)?|Los mismos que el matrimonio civil, si reúnen estabilidad y singularidad|Ninguno|Solo patrimoniales|Solo respecto a los hijos|La unión debe ser entre una mujer y un hombre sin impedimento legal.","¿Cómo define el Art. 77 a la educación?|Función suprema y primera responsabilidad financiera del Estado|Servicio privado regulado|Responsabilidad solo familiar|Servicio subvencionado|El Estado tiene la obligación indeclinable de sostenerla, garantizarla y gestionarla.","¿Cómo es la educación según el Art. 78?|Unitaria, pública, universal, democrática, participativa, comunitaria, descolonizadora y de calidad|Elitista y selectiva|Solo técnica|Confesional|También es intracultural, intercultural y plurilingüe en todo el sistema.","¿Qué establece el Art. 81?|Educación obligatoria hasta el bachillerato y fiscal gratuita hasta el nivel superior|Obligatoria hasta primaria|Gratuita solo hasta secundaria|Obligatoria hasta la licenciatura|El diploma de bachiller se otorga con carácter gratuito e inmediato.","¿Qué caracteriza a las universidades públicas (Art. 92)?|Son autónomas e iguales en jerarquía|Dependen del Ministerio de Educación|Son privadas|Son subvencionadas parcialmente|La autonomía incluye libre administración de recursos, nombramiento de autoridades y aprobación de estatutos.","¿Cómo es la formación docente del magisterio público (Art. 96)?|Única, fiscal, gratuita, intracultural, intercultural, plurilingüe, científica y productiva|Privada y arancelada|Solo universitaria|Optativa|Se garantiza la carrera docente y la inamovilidad del personal docente del magisterio.","¿Qué garantiza el Art. 106?|El derecho a la libertad de expresión, opinión e información sin censura previa|Censura de medios|Solo la prensa estatal|Información reservada|También reconoce el derecho a la rectificación y la réplica.","¿Qué deber establece el Art. 108 numeral 8?|Denunciar y combatir todos los actos de corrupción|Votar en elecciones|Pagar impuestos extranjeros|Portar documentos|Es uno de los deberes de las bolivianas y los bolivianos, junto con cumplir la Constitución y las leyes.","¿Qué dice el Art. 112 sobre delitos de servidores públicos contra el patrimonio del Estado con grave daño económico?|Son imprescriptibles y no admiten régimen de inmunidad|Prescriben a los 10 años|Admiten fuero|Prescriben a los 5 años|También el Art. 324 señala que no prescriben las deudas por daños económicos causados al Estado.","¿Qué ocurre con los servidores públicos que apliquen o instiguen tortura (Art. 114)?|Serán destituidos, sin perjuicio de otras sanciones|Solo serán amonestados|Serán suspendidos 30 días|No tienen sanción|Las declaraciones obtenidas mediante tortura o coacción son nulas de pleno derecho.","¿Qué garantiza el Art. 116?|Presunción de inocencia; en caso de duda rige la norma más favorable al imputado|Presunción de culpabilidad|Aplicación de la norma más severa|Juicio sin defensa|Además, cualquier sanción debe fundarse en una ley anterior al hecho punible.","¿Cuál es la máxima sanción penal (Art. 118)?|Treinta años de privación de libertad, sin derecho a indulto|Veinte años|Pena de muerte|Cadena perpetua|Está prohibida la infamia, la muerte civil y el confinamiento.","¿Cuándo tiene efecto retroactivo la ley (Art. 123)?|En materia laboral a favor del trabajador, penal si beneficia al imputado y en corrupción|Nunca|Siempre|Solo en materia civil|La ley solo dispone para lo venidero, salvo esas excepciones.","¿En qué plazo máximo se interpone la Acción de Amparo Constitucional (Art. 129)?|Seis meses desde la vulneración o la última decisión|Un mes|Un año|Quince días|Procede si no existe otro medio legal de protección inmediata.","¿Cuántos miembros tienen la Cámara de Diputados y la de Senadores (Arts. 146 y 148)?|130 diputados y 36 senadores|120 y 30|166 y 36|130 y 27|Cada departamento elige 4 senadores.","¿Cuándo es proclamada la candidatura presidencial sin segunda vuelta (Art. 166)?|Con 50% más uno, o 40% con diez puntos de diferencia sobre la segunda|Con mayoría simple|Con 60% de votos|Con 30% y 5 puntos de diferencia|Si no se cumple, hay segunda vuelta en 60 días.","¿Cuánto dura el mandato presidencial (Art. 168)?|Cinco años, con reelección una sola vez de manera continua|Cuatro años sin reelección|Seis años|Cinco años con reelección indefinida|Rige igual para el Vicepresidente.","¿Qué vela por la vigencia de los derechos humanos (Art. 218)?|La Defensoría del Pueblo|La Contraloría|La Procuraduría|El Ministerio de Gobierno|Es una institución con autonomía funcional, financiera y administrativa, que no recibe instrucciones de los órganos del Estado.","¿Cuál es la jerarquía normativa del Art. 410?|Constitución, tratados internacionales, leyes nacionales y estatutos, y decretos y reglamentos|Leyes, Constitución, decretos|Tratados, Constitución, leyes|Decretos, leyes, Constitución|La Constitución es la norma suprema; el bloque de constitucionalidad incluye los tratados de derechos humanos ratificados."],"_old":["¿Cómo se constituye Bolivia según el Art. 1?|Estado Unitario Social de Derecho Plurinacional Comunitario|República unitaria presidencialista|Estado federal plurinacional|Estado laico confederado","¿Cuál es la capital de Bolivia según la CPE?|Sucre|La Paz|Cochabamba|Santa Cruz","¿Cuál es la máxima sanción penal?|30 años de privación de libertad sin derecho a indulto|Pena de muerte|20 años con indulto|Cadena perpetua","¿Desde qué edad se ejerce el sufragio y la ciudadanía?|18 años|16 años|21 años|25 años","¿Cuánto dura el mandato presidencial y cuántas reelecciones continuas permite?|5 años, una sola vez continua|4 años, dos veces|6 años, sin reelección|5 años, indefinida","¿Qué dice el Art. 112 sobre delitos de servidores públicos contra el patrimonio del Estado con grave daño económico?|Son imprescriptibles y no admiten inmunidad|Prescriben a los 10 años|Admiten fuero|Prescriben a los 5 años","¿Cuántos miembros tiene la Cámara de Diputados?|130|36|166|120","¿En qué plazo se realiza la audiencia de la Acción de Libertad?|Dentro de las 24 horas de interpuesta|En 48 horas|En 72 horas|En 8 días","¿Hasta qué nivel es obligatoria la educación (Art. 81)?|Bachillerato|Primaria|Licenciatura|Secundaria básica"]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>
    <script src="../leer.js"></script>
</body>
