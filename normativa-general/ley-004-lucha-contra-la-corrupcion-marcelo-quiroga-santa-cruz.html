        "¿A qué están sujetos los jueces, fiscales y policías especializados (Art. 16)?|A un sistema de evaluación permanente para garantizar probidad y eficiencia, con participación del Control Social|A evaluaciones anuales tomadas por universidades extranjeras|A ascensos automáticos por antigüedad en el cargo|A la inamovilidad absoluta sin evaluaciones periódicas|Art. 16: Estarán sujetos a un sistema de evaluación permanente implementado en cada entidad con participación del Control Social.",

        "¿Qué obligación tiene el Ministerio de Transparencia respecto a los denunciantes (Art. 17.III)?|Guardar reserva de la identidad de particulares y servidores que denuncien corrupción y de la documentación recolectada|Publicar los nombres en la Gaceta Oficial del Estado|Entregar los datos a los medios de comunicación masiva|Remitir la lista completa a las cámaras empresariales|Art. 17.III: Guardará reserva de la identidad de las personas que denuncien hechos de corrupción y de la documentación generada.",
        "¿Cuáles son las atribuciones de la Unidad de Investigaciones Financieras - UIF (Art. 18)?|Realizar análisis e inteligencia financiera y patrimonial a requerimiento de autoridades competentes o de oficio para identificar corrupción|Conceder créditos bancarios a pequeñas empresas|Emitir billetes y monedas de curso legal en el país|Regular las tasas de interés del sistema financiero privado|Art. 18: A requerimiento escrito o de oficio, realizará actividades de inteligencia financiera y patrimonial para identificar presuntos delitos de corrupción.",
        "¿Se puede invocar secreto o confidencialidad ante requerimientos de información de la UIF o Fiscalía (Art. 19)?|No se puede invocar secreto en materia comercial, tributaria, económica, de valores y seguros; se obtiene sin orden judicial|Sí, el secreto bancario es inviolable bajo orden judicial previa|Sí, requiere obligatoriamente autorización de la ASFI|Sí, mediante trámite notarial de tres días hábiles|Art. 19.I: No se podrá invocar secreto o confidencialidad comercial, tributaria, económica, de valores y seguros; será obtenida sin necesidad de orden judicial.",

        "¿Cuáles son algunos de los nuevos tipos penales creados por la Ley Nº 004 (Art. 25)?|Uso indebido de bienes públicos, enriquecimiento ilícito, cohecho activo/pasivo transnacional y obstrucción de la justicia|Homicidio, lesiones graves y secuestro extorsivo|Robo agravado, estafa inmobiliaria y falsificación de moneda|Hurto famélico y daños a la propiedad privada común|Art. 25: Se crean: Uso indebido de bienes/servicios públicos, enriquecimiento ilícito, cohecho transnacional, obstrucción de la justicia, falsedad en DDJJ, etc.",

        "¿Qué establece el artículo 105 del Código Penal (modificado por la Ley Nº 004) respecto a la prescripción de la pena en delitos de corrupción?|No procederá la prescripción de la pena, bajo ninguna circunstancia, en delitos de corrupción|Prescribe a los 10 años computados desde la sentencia|Prescribe a los 5 años si el reo se encuentra prófugo|Prescribe de forma automática al cesar en el cargo público|Art. 34 (Modif. Art. 105 CP): No procederá la prescripción de la pena, bajo ninguna circunstancia, en delitos de corrupción.",

        "¿Cómo se sanciona el Consorcio de Jueces, Fiscales y/o Abogados (Art. 174 del Código Penal)?|Privación de libertad de 5 a 10 años por concertar ventajas económicas ilícitas en detrimento de la justicia|Privación de libertad de 1 a 2 años con fianza económica|Inhabilitación temporal de la profesión por un año|Multa del 50% de los honorarios profesionales percibidos|Art. 34 (Modif. Art. 174 CP): Juez, fiscal o abogado que concertare consorcios para ventajas ilícitas (5 a 10 años de privación de libertad).",
        "¿Qué establece el artículo 185 Bis sobre la Legitimación de Ganancias Ilícitas?|Sanciona con 5 a 10 años de cárcel al que adquiera, convierta o transfiera bienes vinculados a delitos graves (autónomo y sin necesidad de sentencia previa)|Sanciona exclusivamente el contrabando hormiga en fronteras|Tipifica las infracciones bancarias de menor cuantía|Sanciona el incumplimiento de contratos civiles entre particulares|Art. 34 (Modif. Art. 185 Bis CP): Legitimación de ganancias ilícitas (5 a 10 años de cárcel, multa y carácter autónomo sin necesidad de sentencia penal previa por el delito previo).",
        "¿Cuál es la pena por Contratos Lesivos al Estado (Art. 221 del Código Penal)?|Privación de libertad de 5 a 10 años si se celebra a sabiendas en perjuicio del Estado (1 a 4 años si es culposo)|Privación de libertad de 6 meses a 1 año|Multa equivalente al 10% del contrato suscrito|Anulación del contrato sin responsabilidad penal|Art. 34 (Modif. Art. 221 CP): Servidor que a sabiendas celebra contratos en perjuicio del Estado (5 a 10 años de cárcel; culposo de 1 a 4 años).",
        "¿Qué sanciona la Conducta Antieconómica (Art. 224 del Código Penal)?|Privación de libertad de 3 a 8 años al servidor o directivo que cause daños al patrimonio del Estado por mala administración|Privación de libertad de 1 a 2 años por retraso en obras civiles menores|Multa del 5% del presupuesto institucional anual|Amonestación escrita y cambio de destino laboral|Art. 34 (Modif. Art. 224 CP): Servidor o directivo que por mala administración cause daños al patrimonio estatal (3 a 8 años de cárcel; culposo de 1 a 4 años).",
        "¿Qué beneficio otorga la Denuncia Voluntaria a partícipes de corrupción (Art. 35)?|Reducción de dos tercios de la pena que le correspondiere si colabora voluntariamente en la investigación y juzgamiento|Absolución total e inmediata de culpa sin pasar por fiscalía|Indulto presidencial directo otorgado por el Ministerio de Justicia|Exención de cualquier responsabilidad civil por los daños causados|Art. 35: El partícipe que voluntariamente denuncie y colabore en la investigación y juzgamiento se beneficiará con la reducción de dos tercios de la pena.",
        "¿Qué establece el artículo 29 Bis del Código de Procedimiento Penal incorporado por la Ley Nº 004?|La imprescriptibilidad de los delitos cometidos por servidores públicos que atenten contra el patrimonio del Estado y causen grave daño económico|Prescripción a los 8 años de iniciada la investigación fiscal|Inmunidad temporal para exautoridades legislativas|Caducidad de las pruebas documentales a los 5 años|Art. 36 (Inc. Art. 29 Bis CPP): Imprescriptibilidad de los delitos cometidos por servidores públicos que atenten contra el patrimonio del Estado y causen grave daño económico.",
        "¿Qué dispone el artículo 91 Bis del Código de Procedimiento Penal sobre la rebeldía?|El proceso no se suspende respecto al rebelde; se designa defensor de oficio y es juzgado en rebeldía juntamente con los presentes|Se suspende todo el juicio hasta la captura del prófugo|Se archivan obrados de manera definitiva e inapelable|Se anulan todas las pruebas acumuladas en la fase preliminar|Art. 36 (Inc. Art. 91 Bis CPP): Prosecución del juicio en rebeldía: el proceso no se suspende respecto al rebelde; se designa defensor de oficio y es juzgado juntamente con los presentes.",
        "¿Qué permite el artículo 148 Bis del Código de Procedimiento Penal en el ámbito internacional?|Solicitar a autoridades extranjeras la cooperación necesaria para recuperar bienes y activos sustraídos fuera del país|Embargar cuentas bancarias de gobiernos extranjeros en Bolivia|Extraditar a ciudadanos extranjeros sin convenio bilateral previo|Intervenir embajadas acreditadas en el territorio nacional|Art. 36 (Inc. Art. 148 Bis CPP): Recuperación de bienes en el extranjero: el Estado podrá solicitar cooperación a autoridades extranjeras para recuperar activos sustraídos.",
        "¿Cuál es el plazo y procedimiento para la incautación en delitos de corrupción según el artículo 253 Bis del CPP?|Desde el inicio de investigaciones, previo requerimiento fiscal y en plazo perentorio de 5 días, se procede a la incautación de bienes|Plazo de 90 días con autorización judicial previa de la Corte Suprema|Plazo de un año tras dictarse sentencia condenatoria ejecutoriada|Incautación voluntaria acordada con el imputado ante notario|Art. 36 (Inc. Art. 253 Bis CPP): En plazo perentorio de 5 días desde el inicio de investigaciones se procederá a la incautación de bienes y activos producto del delito.",
        "¿Qué modifica el artículo 37 de la Ley Nº 004 respecto a la Suspensión Condicional de la Pena (Art. 366 del CPP)?|Establece que la suspensión condicional de la pena no procede en delitos de corrupción bajo ninguna circunstancia|Permite la suspensión si la pena es menor a dos años|Reduce la pena a la mitad por buena conducta procesal|Otorga libertad condicional a los 6 meses de reclusión|Art. 37 (Modif. Art. 366 CPP): La suspensión condicional de la pena no procede en delitos de corrupción bajo ninguna circunstancia.",
        "¿Procede el Perdón Judicial en delitos de corrupción según la modificación del artículo 368 del CPP?|No procederá el perdón judicial, bajo ninguna circunstancia, en delitos de corrupción|Sí, si es el primer delito y la pena no supera dos años|Sí, previo pago de una fianza económica ante el juez|Sí, con autorización del Consejo de la Magistratura|Art. 37 (Modif. Art. 368 CPP): No procederá el perdón judicial, bajo ninguna circunstancia, en delitos de corrupción.",
        "¿Qué establece la modificación del artículo 1502 del Código Civil respecto a la prescripción de deudas con el Estado?|La prescripción no corre en cuanto a las deudas por daños económicos causados al Estado|Prescribe a los 10 años de ejecutoriado el fallo|Prescribe a los 5 años si el deudor se declara insolvente|Prescribe automáticamente al fallecimiento del deudor|Art. 39 (Modif. Art. 1502 CC): La prescripción no corre respecto a las deudas por daños económicos causados al Estado.",
        "¿Qué facultad otorga la modificación del artículo 1552 del Código Civil a la Procuraduría y al Ministerio de Transparencia?|Pedir la anotación preventiva de sus derechos en el registro público para la protección del Patrimonio del Estado|Embargar bienes privados de cualquier ciudadano sin demanda judicial|Dictar sentencias civiles de desalojo de inmuebles urbanos|Modificar los títulos de propiedad inmobiliaria municipal|Art. 39 (Modif. Art. 1552 CC): La Procuraduría y el Ministerio de Transparencia podrán pedir anotación preventiva en registros públicos para proteger el patrimonio del Estado.",
        "¿Cuál es el plazo de caducidad de la anotación preventiva a favor del Estado (Art. 1553 del Código Civil)?|Caducará a los cuatro años, prorrogables a dos más, si no es convertida en inscripción definitiva|Caducará a los seis meses improrrogables|Caducará a los diez años exactos|No caduca nunca bajo ninguna condición temporal|Art. 39 (Modif. Art. 1553 CC): La anotación preventiva a favor del Estado caducará a los cuatro años, prorrogables a dos más, si no es convertida en inscripción definitiva.",
        "¿Qué establecen las Disposiciones Transitorias sobre los juzgados anticorrupción en tanto no estén en funcionamiento?|Los jueces penales ordinarios otorgarán prioridad en el trámite y resolución a los procesos donde estén en juego intereses del Estado|Los juicios se suspenderán indefinidamente hasta la creación de nuevos juzgados|Los casos serán transferidos a tribunales arbitrales privados|Las causas prescribirán en un plazo de noventa días|Disposición Transitoria Primera: Los jueces penales otorgarán prioridad en el trámite y resolución a los procesos en los que estén en juego los intereses del Estado.",
        "¿Cómo se garantiza el financiamiento de las políticas y proyectos de lucha contra la corrupción (Disp. Final Segunda)?|El Estado garantizará el financiamiento anual con recursos propios para investigación, acusación y juzgamiento|Mediante préstamos condicionados de la banca internacional privada|A través de donaciones directas de organismos no gubernamentales|Con el cobro de aranceles procesales a los denunciantes particulares|Disposición Final Segunda: El Estado garantizará el financiamiento anual de las políticas y proyectos de lucha contra la corrupción con recursos propios.",
        "¿Cuál es la pena para el Cohecho Pasivo Propio (Art. 145 del Código Penal)?|Privación de libertad de 3 a 8 años y multa de 50 a 150 días para el servidor que reciba dádivas para hacer o dejar de hacer un acto|Privación de libertad de 1 a 2 años sin multa económica|Multa del doble de la dádiva recibida sin cárcel|Inhabilitación temporal por treinta días calendario|Art. 34 (Modif. Art. 145 CP): Servidor o autoridad que reciba dádivas para hacer o dejar de hacer un acto de sus funciones (3 a 8 años de cárcel y multa de 50 a 150 días).",
        "¿Cómo se sanciona el delito de Exacciones (Art. 152 del Código Penal)?|Privación de libertad de 1 a 4 años para el servidor que exija ventajas para convertirlas en beneficio de la administración pública|Privación de libertad de 5 a 10 años sin derecho a fianza|Multa pecuniaria fija de quinientos días de salario|Amonestación administrativa interna en la institución|Art. 34 (Modif. Art. 152 CP): Servidor que exigiere ventajas para convertirlas en beneficio de la administración pública (1 a 4 años; agravado en un tercio si hay violencia).",
        "¿Cuál es la pena para el Cohecho Pasivo de la Jueza, Juez o Fiscal (Art. 173 Bis del Código Penal)?|Privación de libertad de 5 a 10 años, multa de 200 a 500 días e inhabilitación especial para función pública o cargos electos|Privación de libertad de 1 a 3 años sin inhabilitación|Multa económica de treinta días sin privación de libertad|Suspensión temporal del ejercicio profesional por seis meses|Art. 34 (Modif. Art. 173 Bis CP): Juez o fiscal que aceptare promesas o dádivas para dictar o demorar resoluciones (5 a 10 años de cárcel, multa e inhabilitación).",
        "¿Qué sanción se aplica a los Nombramientos Ilegales (Art. 157 del Código Penal)?|Privación de libertad de 1 a 4 años y multa de 30 a 100 días para el servidor que nombre a persona sin condiciones legales|Privación de libertad de 5 a 8 años obligatorios|Multa equivalente a diez salarios mínimos nacionales|Censura pública por la máxima autoridad ejecutiva|Art. 34 (Modif. Art. 157 CP): Servidor que propusiere o nombrare a persona que no reúna condiciones legales (1 a 4 años de cárcel y multa de 30 a 100 días).",
        "¿Cuál es la pena para la Negativa o Retardo de Justicia (Art. 177 del Código Penal)?|Privación de libertad de 5 a 10 años para el funcionario judicial o administrativo que retarde o incumpla términos procesales|Privación de libertad de 6 meses a 1 año|Multa pecuniaria del 5% del sueldo mensual|Amonestación escrita ante el Consejo de la Magistratura|Art. 34 (Modif. Art. 177 CP): Funcionario judicial o administrativo que con jurisdicción retarde o incumpla términos procesales (5 a 10 años de privación de libertad).",
        "¿Cómo se sanciona el Incumplimiento de Contratos con el Estado (Art. 222 del Código Penal)?|Privación de libertad de 3 a 8 años si no los cumple sin justa causa (1 a 4 años si deriva de culpa)|Privación de libertad de 10 años fijos sin excepciones|Multa económica del 50% del valor total del contrato|Rescisión administrativa del contrato sin cargos penales|Art. 34 (Modif. Art. 222 CP): El que no cumpla contratos celebrados con el Estado sin justa causa (3 a 8 años de cárcel; si es culposo, de 1 a 4 años).",
        "¿Cuál es la pena para la Infidencia Económica (Art. 225 del Código Penal)?|Privación de libertad de 1 a 4 años para quien revele datos reservados de política económica (agravado si es en beneficio propio)|Privación de libertad de 5 a 8 años fijos|Multa del doble de los perjuicios ocasionados|Destitución inmediata de funciones públicas sin proceso|Art. 34 (Modif. Art. 225 CP): Servidor que en posesión de datos reservados de política económica los revele (1 a 4 años; agravado en un tercio si es en beneficio propio).",
        "¿Qué sanciona el delito de Contribuciones y Ventajas Ilegítimas (Art. 228 del Código Penal)?|Privación de libertad de 1 a 3 años al que simule funciones u órdenes superiores para exigir dinero (agravado si es servidor público a 3-8 años)|Privación de libertad de 6 meses a 1 año sin multa|Multa fija de veinte días de salario básico|Suspensión temporal de actividades gremiales|Art. 34 (Modif. Arts. 228 y 228 Bis CP): Exigir dinero simulando funciones u órdenes (1 a 3 años; si es servidor público causando daño económico, de 3 a 8 años).",
        "¿Cómo se sancionan las Sociedades o Asociaciones Ficticias (Art. 229 del Código Penal)?|Privación de libertad de 1 a 4 años y multa de 100 a 500 días (si es servidor público, de 3 a 8 años y multa de 30 a 100 días)|Privación de libertad de 6 meses sin multa económica|Multa del 10% del capital social constituido|Disolución voluntaria de la sociedad sin sanciones penales|Art. 34 (Modif. Art. 229 CP): Organizar asociaciones ficticias para obtener privilegios (1 a 4 años; si es servidor público, de 3 a 8 años).",
        "¿Cuál es la pena por Franquicias, Liberaciones o Privilegios Ilegales (Art. 230 del Código Penal)?|Privación de libertad de 3 a 8 años (agravado en un tercio si el servidor público los concede o negocia ilegalmente)|Privación de libertad de 1 a 2 años con derecho a fianza|Multa única de cincuenta días de salario mínimo|Retiro de franquicias aduaneras sin procesos penales|Art. 34 (Modif. Art. 230 CP): Obtener o negociar ilegalmente franquicias o privilegios (3 a 8 años; si los concede un servidor público, pena agravada en un tercio).",
        "¿Qué establece el artículo 344 Bis del Código de Procedimiento Penal sobre el juicio oral en rebeldía por corrupción?|Se señalará nuevo día de audiencia de juicio oral para su celebración en ausencia del imputado con defensor de oficio y notificación por edictos|Se suspenderá indefinidamente el juicio hasta la captura del acusado|Se dictará sentencia absolutoria automática por inasistencia|Se extinguirá la acción penal a los treinta días de rebeldía|Art. 36 (Inc. Art. 344 Bis CPP): En caso de incomparecencia por corrupción se declarará rebeldía y se celebrará juicio oral en su ausencia con defensor de oficio y edictos."
    ]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>
    <script src="../leer.js"></script>
