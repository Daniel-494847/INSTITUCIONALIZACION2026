        "¿Qué entidad investiga y diseña estrategias de apoyo a la transformación educativa (Art. 87)?|Instituto de Investigaciones Educativas Plurinacional|Observatorio de la Calidad Educativa|Universidad Pedagógica|Dirección General de Planificación|Art. 87: Se crea el Instituto de Investigaciones Educativas Plurinacional dependiente del Ministerio de Educación.",
        "¿Cómo se financia el Sistema Educativo Plurinacional (Art. 89)?|Por el TGE y Entidades Territoriales Autónomas|Por pensiones obligatorias a los padres|Mediante créditos de la banca privada|Por donaciones internacionales exclusivamente|Art. 89: Financiado por el Tesoro General del Estado (TGE) y las entidades territoriales autónomas.",
        "¿Qué instancia es la máxima representación para definir la política plurinacional de educación (Art. 92.1)?|Congreso Plurinacional de Educación|Asamblea Legislativa|Consejo de Ministros|Magisterio Urbano|Art. 92.1: El Congreso Plurinacional de Educación es la instancia máxima de participación de todos los sectores de la sociedad.",
        "¿Qué son los Consejos Educativos de Pueblos Originarios (CEPOs) según el Art. 92.3?|Instancias de las NPIOC que participan en la formulación de políticas y gestión educativa|Sindicatos de profesores rurales|Juntas escolares de distrito urbano|Comités de infraestructura municipal|Art. 92.3: Instancias de las NPIOC para velar por la implementación de la educación intracultural, intercultural y plurilingüe.",
        "¿Cuál es una de las prioridades educativas obligatorias en planes intersectoriales (Disposición Transitoria 12ª)?|Educación sin violencia, en derechos humanos y derechos de la Madre Tierra|Enseñanza de comercio internacional|Educación financiera bancaria|Instrucción militar obligatoria en primaria|Disposición Transitoria 12ª: Prioridades: Educación sin violencia, derechos humanos, seguridad ciudadana, derechos de la Madre Tierra, contra el racismo, valores y ética.",
        "¿Qué ley quedó abrogada con la promulgación de la Ley 070?|La Ley 1565 de Reforma Educativa|La Ley 1333 del Medio Ambiente|El Código de la Educación de 1956|La Ley de Inversiones|Disposición Abrogatoria Única: Se abroga la Ley 1565 de Reforma Educativa de 7 de julio de 1994.",
        "¿Qué profesionales apoyan y fortalecen el SEP en diseño curricular y orientación sin entrar al escalafón (Art. 67)?|Profesionales en Ciencias de la Educación y Pedagogía|Trabajadores Sociales|Administradores de Empresas|Ingenieros de Sistemas|Art. 67: Las y los profesionales en Ciencias de la Educación y Pedagogía apoyan funciones técnicas/orientación sin incorporarse al escalafón docente.",
        "¿Qué carácter tienen las escuelas ubicadas en zonas de frontera (Disposición Transitoria 11ª)?|Prioridad del Estado y atención preferencial en infraestructura y personal|Gestión privada obligatoria|Atención únicamente en días festivos|Dependencia militar exclusiva|Disposición Transitoria 11ª: Las escuelas de frontera son prioridad del Estado y recibirán atención en personal, infraestructura y equipamiento.",
        "¿En qué fecha fue promulgada la Ley 070 Avelino Siñani - Elizardo Pérez?|20 de diciembre de 2010|7 de julio de 1994|1 de mayo de 2006|6 de agosto de 2012|Encabezado de la Ley: Promulgada el 20 de diciembre de 2010 por el Presidente Evo Morales Ayma.",
        "¿Qué reconoce el Estado respecto a la participación de padres de familia en educación (Art. 2.1)?|Reconoce y garantiza la Participación Social Comunitaria|Prohíbe la intervención de padres en asuntos escolares|Limita la participación solo al pago de cuotas|La permite únicamente en escuelas privadas|Art. 2.1: Se reconoce y garantiza la participación social comunitaria de madres y padres de familia en todo el SEP.",
        "¿Cuál es el fin pedagógico de la educación liberadora según el Art. 3.14?|Que la persona tome conciencia de su realidad para transformarla|Aceptar pasivamente los conocimientos transmitidos|Aprender contenidos teóricos sin cuestionar|Memoria repetitiva para exámenes estandarizados|Art. 3.14: Es liberadora en lo pedagógico porque promueve que la persona tome conciencia de su realidad para transformarla."
    ]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>
    <script src="../leer.js"></script>
</body>
</html>
