<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley 1178 SAFCO Administración y Control Gubernamentales</title>
    <meta name="description" content="Ley 1178 SAFCO Administración y Control Gubernamentales — Ley de 20/07/1990. Cuestionario interactivo de 9 preguntas.">
    <meta property="og:title" content="Ley 1178 SAFCO Administración y Control Gubernamentales">
    <meta property="og:description" content="Ley de 20/07/1990 · 9 preguntas — Sistema de Capacitación.">
    <meta property="og:type" content="website">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-body-tertiary">
    <div class="container py-4">
        <a href="../index.html" class="btn btn-sm btn-outline-secondary mb-4" onclick="if(history.length>1){history.back();return false;}">
            <i class="fas fa-arrow-left"></i> Volver al Panel
        </a>
        <header class="text-center mb-4">
            <h1 class="h3 fw-bold">Ley 1178 SAFCO Administración y Control Gubernamentales</h1>
            <p class="text-body-secondary mb-0">Ley de 20/07/1990 · 9 preguntas</p>
        </header>

        <main id="app" class="mx-auto" style="max-width: 820px;"></main>
    </div>

    <script>
    // Cada pregunta: "pregunta|correcta|mala1|mala2|mala3|retroalimentación"
    const DOC={"i":"🏛️","n":"Ley 1178 SAFCO Administración y Control Gubernamentales","d":"Ley de 20/07/1990","q":["¿Cuál es el órgano rector del Control Gubernamental?|Contraloría General|Ministerio de Hacienda|Procuraduría|Defensoría del Pueblo","¿Qué sanciones corresponden a la responsabilidad administrativa?|Multa hasta 20%, suspensión hasta 30 días o destitución|Solo amonestación|Prisión de 1 a 4 años|Multa del 50%","¿Cuándo hay responsabilidad civil?|Cuando se causa daño al Estado valuable en dinero|Cuando se incumple un reglamento interno|Cuando hay delito tipificado|Cuando no se rinde cuentas","¿En cuántos días se envía a la Contraloría copia de los contratos perfeccionados?|Cinco días|30 días|10 días|Tres meses","¿En cuánto tiempo deben entregarse los estados financieros tras concluir el ejercicio fiscal?|Tres meses|Un mes|Seis meses|Un año","¿Qué responsabilidad corresponde cuando la acción u omisión está tipificada en el Código Penal?|Penal|Administrativa|Ejecutiva|Civil","¿Qué se presume de las operaciones de todo servidor público?|Su licitud, mientras no se demuestre lo contrario|Su culpabilidad|Su ilegalidad|Nada","¿Cuántos sistemas de administración y control regula la ley?|Ocho|Cinco|Diez|Seis","¿Qué jurisdicción crea el Capítulo VII?|Jurisdicción coactiva fiscal|Jurisdicción tributaria|Jurisdicción militar|Jurisdicción agroambiental"]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>
</body>
</html>
