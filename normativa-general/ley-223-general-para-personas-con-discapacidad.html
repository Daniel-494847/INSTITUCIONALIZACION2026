        "¿Cuál es el objeto principal de la Ley N° 223?|Garantizar a las personas con discapacidad el ejercicio pleno de derechos y deberes en igualdad de condiciones y equiparación de oportunidades|Otorgar bonos económicos mensuales de carácter universal a toda la población|Crear empresas públicas autogestionarias de producción exclusiva para personas con discapacidad|Modificar los códigos penales y civiles en materia de comercio internacional|Art. 1: Garantizar a las personas con discapacidad el ejercicio pleno de sus derechos y deberes en igualdad de condiciones y equiparación de oportunidades bajo un sistema de protección integral.",
        "¿Cuál es uno de los fines fundamentales de la Ley N° 223 (Art. 2)?|Promover, proteger y asegurar el goce pleno de todos los derechos humanos y libertades fundamentales|Aumentar los impuestos a las empresas privadas que no contraten personal sin discapacidad|Establecer un régimen aduanero especial preferencial para importación de vehículos particulares|Sustituir a los gobiernos autónomos departamentales en la gestión de salud pública|Art. 2.1: Promover, proteger y asegurar el goce pleno de todos los derechos humanos y libertades fundamentales.",

        "¿Qué establece el principio de Igualdad en Dignidad (Art. 4.1)?|Las personas con discapacidad tienen la misma dignidad y derechos que el resto de los seres humanos|Las personas con discapacidad requieren autorización especial para ejercer derechos civiles|La dignidad humana se adquiere mediante la mayoría de edad institucional|Los derechos fundamentales varían según el grado de discapacidad de la persona|Art. 4.1: Por el que las personas con discapacidad tienen la misma dignidad y derechos que el resto de los seres humanos.",
        "¿Cómo se define el principio de No Discriminación en la Ley N° 223 (Art. 4.2)?|No se anula o afecta el reconocimiento, goce o ejercicio pleno de los derechos en base a distinciones fundadas en su situación de discapacidad|Se permite restringir derechos políticos a personas con discapacidad intelectual grave|Se excluye a las personas con discapacidad de ciertas actividades deportivas públicas|Se establecen diferencias salariales basadas en el rendimiento físico general|Art. 4.2: No se anula o afecta el reconocimiento, goce o ejercicio pleno de los derechos en base a cualquier forma de distinción fundada en su situación.",
        "¿Qué define el principio de Accesibilidad (Art. 4.4)?|Que los servicios de la sociedad puedan también acomodarse para ser accedidos por personas con discapacidad sin restricción arquitectónica, física, social o comunicacional|La obligación de construir rampas únicamente en edificios públicos nacionales|El acceso gratuito a internet en plazas y parques municipales|La gratuidad en el transporte público interdepartacional terrestre|Art. 4.4: Por el que los servicios que goza la sociedad puedan también acomodarse para ser accedidos por las personas con discapacidad sin restricción alguna.",
        "¿Cómo define la Ley N° 223 el concepto de Discapacidad (Art. 5.1)?|Es el resultado de la interacción de la persona con deficiencias físicas, psíquicas, intelectuales y/o sensoriales con diversas barreras|Una enfermedad incurable que impide absolutamente el aprendizaje escolar|Una condición biológica exclusiva del sistema nervioso central|Un trastorno temporal de la conducta social y familiar|Art. 5.1: Es el resultado de la interacción de la persona, con deficiencias de función físicas, psíquicas, intelectuales y/o sensoriales a largo plazo con diversas barreras.",
        "¿Qué se entiende por Trato Preferente según el Art. 5.2?|Acciones integradoras que procuran eliminar desventajas, garantizando equiparación e igualdad con carácter de primacía|La entrega de subsidios económicos mensuales incondicionales a tutores legales|Exenciones tributarias totales en la compra de bienes inmuebles urbanos|Asignación obligatoria de cargos públicos directivos sin concurso de méritos|Art. 5.2: Acciones integradoras que procuran eliminar desventajas, garantizando su equiparación e igualdad con carácter de primacía.",
        "¿Cómo define la ley a las Personas con Discapacidad Física - Motora (Art. 5.5)?|Personas con deficiencias anatómicas y neuromúsculofuncionales causantes de limitaciones en el movimiento|Personas con pérdida total o parcial de la agudeza visual binocular|Personas con alteraciones cognitivas del desarrollo evolutivo|Personas con trastornos severos de la personalidad y conducta social|Art. 5.5: Personas con deficiencias anatómicas y neuromúsculofuncionales causantes de limitaciones en el movimiento.",
        "¿Qué caracteriza a las Personas con Discapacidad Intelectual (Art. 5.8)?|Deficiencias anatómicas y/o funcionales del sistema nervioso central que ocasionan limitaciones en la inteligencia y conducta adaptativa|Alteraciones auditivas severas que requieren lenguaje de señas manual|Trastornos psicosociales temporales derivados del estrés laboral|Dificultades exclusivamente motrices en extremidades superiores e inferiores|Art. 5.8: Personas caracterizadas por deficiencias del sistema nervioso central que ocasionan limitaciones en el funcionamiento de la inteligencia y conducta adaptativa.",
        "¿Cómo define la ley el Grado de Discapacidad Leve (Art. 5.11)?|Síntomas, signos o secuelas que justifican alguna dificultad para la vida diaria, pero son compatibles con la práctica de las mismas|Imposibilidad absoluta para realizar actividades de autocuidado personal|Requerimiento de asistencia permanente de otra persona las 24 horas|Disminución gravísima de las funciones cognitivas superiores|Art. 5.11: Calificación que se refiere a personas con síntomas o secuelas que justifican alguna dificultad para la vida diaria, pero compatibles con la práctica de las mismas.",
        "¿A qué se refiere el Grado de Discapacidad Muy Grave (Art. 5.14)?|Personas con secuelas que imposibilitan la realización de actividades de la vida diaria y requieren asistencia permanente de otra persona|Dificultades leves en la comunicación oral y desplazamiento autónomo|Personas independientes en el autocuidado pero con limitaciones laborales|Alteraciones sensoriales visuales corregibles mediante lentes clínicos|Art. 5.14: Calificación que se refiere a personas con secuelas que imposibilitan la realización de las actividades de la vida diaria y requiere asistencia permanente.",
        "¿Qué establece el Artículo 6 sobre el Derecho a la Vida?|El Estado Plurinacional de Bolivia garantiza el derecho a la vida de las personas con discapacidad desde su concepción|El derecho a la vida se garantiza exclusivamente desde la mayoría de edad jurídica|La vida e integridad física están sujetas a evaluación médica anual obligatoria|El Estado asume la patria potestad automática de todo recién nacido con discapacidad|Art. 6: El Estado Plurinacional de Bolivia garantiza el derecho a la vida de las personas con discapacidad, desde su concepción, al igual que el resto de las personas.",
        "¿Cuál es el rol de la familia respecto a la persona con discapacidad según el Artículo 7?|Es el primer espacio de inclusión, obligada a proporcionar protección y bienestar promoviendo autonomía y autodeterminación|Debe ejercer la tutela legal absoluta impidiendo la toma de decisiones independientes|Tiene la potestad de restringir el derecho al trabajo y estudio por motivos de seguridad|Asume la representación económica total sin rendición de cuentas estatal|Art. 7.I: La familia siendo el primer espacio de inclusión está obligada a proporcionar protección y bienestar promoviendo su autonomía y respetando su autodeterminación.",
        "¿Qué dispone el Artículo 10 sobre el Derecho a la Educación?|El Estado garantiza el acceso y permanencia de estudiantes con discapacidad en el Sistema Educativo Plurinacional en el marco de la educación inclusiva|Se establece la educación segregada obligatoria en institutos especializados cerrados|La educación escolarizada es optativa y financiada por las familias de los estudiantes|Las universidades públicas están exentas de recibir estudiantes con discapacidad sensorial|Art. 10: El Estado Plurinacional de Bolivia garantiza el acceso y permanencia de estudiantes con discapacidad en el Sistema Educativo Plurinacional, en el marco de la educación inclusiva e integral.",
        "¿Qué garantiza el Estado en el ámbito de la Salud (Art. 12)?|Acceso a servicios integrales de promoción, prevención, atención, rehabilitación y habilitación con carácter gratuito, de calidad y calidez|Atención médica privada subsidiada al cincuenta por ciento por los municipios|Provisión exclusiva de medicamentos paliativos sin cobertura de rehabilitación física|Servicios de salud arancelados según la condición socioeconómica familiar|Art. 12: El Estado garantiza el acceso a servicios integrales de promoción, prevención, atención, rehabilitación y habilitación, con carácter gratuito, de calidad y calidez.",
        "¿Qué establece el Artículo 13 sobre el Empleo y Trabajo Digno?|El Estado garantiza y promueve el acceso a toda forma de empleo y trabajo digno con remuneración justa a través de políticas de inclusión socio-laboral|La obligación patronal de contratar un 50% de personal con discapacidad en empresas privadas|El trabajo exclusivo en talleres protegidos no competitivos administrados por municipios|La prohibición absoluta de realizar actividades laborales que requieran esfuerzo físico|Art. 13: El Estado garantiza y promueve el acceso a toda forma de empleo y trabajo digno con una remuneración justa, a través de políticas públicas de inclusión socio-laboral.",
        "¿Qué dispone el Artículo 15 sobre el Derecho a la Vivienda?|El Estado garantiza programas y proyectos especiales de vivienda digna estableciendo un porcentaje del presupuesto de planes de vivienda social|La entrega gratuita de viviendas urbanas a todas las familias con personas con discapacidad|La exención total de pago de impuestos municipales sobre bienes inmuebles propios|La obligación de los gobiernos departamentales de construir albergues residenciales|Art. 15: El Estado garantiza programas y proyectos especiales de vivienda digna y adecuada estableciendo un porcentaje del presupuesto de los planes de vivienda social.",
        "¿Qué medidas introduce el Tribunal Supremo Electoral en los actos eleccionarios (Art. 18.II)?|Ajustes razonables para que voten libre y conscientemente, incluyendo ingresar acompañados de una persona de confianza|Urnas electorales electrónicas obligatorias ubicadas en domicilios particulares|Exención de la obligación de emitir sufragio en todas las elecciones nacionales|Mesas de sufragio exclusivas atendidas por notarios electorales bilingües|Art. 18.II: El Tribunal Supremo Electoral introducirá ajustes razonables para que voten libre y conscientemente, incluyendo ingresar acompañados de una persona de confianza.",
        "¿Cuáles son causales para la pérdida de beneficios de personas allegadas a la persona con discapacidad (Art. 21)?|Cometer actos de violencia doméstica, intrafamiliar, abusos, malos tratos, discriminación, racismo o limitar oportunidades de desarrollo|Cambiar de domicilio habitual sin previa comunicación al CONALPEDIS|No afiliarse a las organizaciones sindicales de trabajadores institucionales|Percibir ingresos económicos superiores al salario mínimo nacional vigente|Art. 21: Se pierden beneficios cuando la familia limita oportunidades de autonomía, comete violencia doméstica, intrafamiliar, abusos, malos tratos, discriminación o racismo.",
        "¿Cuál es uno de los deberes de las personas con discapacidad según el Artículo 22?|Capacitarse y prepararse según sus posibilidades para ser una persona independiente y productiva|Prestar servicio militar obligatorio en unidades de infantería del ejército|Financiar parcialmente los programas estatales de salud y rehabilitación física|Asumir cargos directivos en las asociaciones departamentales de discapacidad|Art. 22.11: Capacitarse y prepararse según sus posibilidades para ser una persona independiente y productiva, debiendo apoyar en este deber la familia.",
        "¿Qué deben priorizar el Órgano Ejecutivo y las entidades territoriales autónomas en la reducción de pobreza (Art. 23)?|El acceso de personas con discapacidad, padres, madres y/o tutores a planes de promoción, inclusión social y estrategias de reducción de pobreza|La entrega de bonos mensuales en efectivo a todas las empresas comerciales privadas|La condonación total de deudas bancarias contraídas por personas sin discapacidad|La construcción de centros recreativos exclusivos en áreas rurales alejadas|Art. 23: Deberán priorizar el acceso a planes y programas de promoción e inclusión social y a estrategias de reducción de pobreza destinadas a eliminar la exclusión.",
        "¿Qué medidas se disponen respecto al Acceso al Crédito (Art. 25)?|El Estado promoverá programas de créditos y microcréditos para autoempleo y proyectos económicos, eliminando restricciones en entidades financieras|La prohibición absoluta de otorgar préstamos monetarios a personas con discapacidad visual|La obligación de los bancos privados de condonar intereses corrientes y penales|La exigencia de garantías hipotecarias urbanas por el triple del monto solicitado|Art. 25: El Estado promoverá el acceso a programas de créditos y microcréditos para autoempleo y emprendimientos, debiendo las entidades financieras adecuar sus políticas.",
        "¿A partir de qué año se establece la Renta Solidaria para personas con discapacidad grave y muy grave (Art. 28)?|A partir del año 2013, regulada por norma reglamentaria|Desde la promulgación oficial de la ley en el mes de marzo de 2012|A partir del primer mes del año fiscal 2015 sin excepción reglamentaria|Desde que la persona cumpla la mayoría de edad institucionalizada|Art. 28.I: Se establece la renta solidaria para personas con discapacidad grave y muy grave a ser regulado por norma reglamentaria, a partir del año 2013.",
        "¿Quiénes están excluidos de percibir la Renta Solidaria según el Artículo 28.II?|Las personas con discapacidad visual y aquellas personas con discapacidad mientras desempeñen funciones en el sector público|Los estudiantes universitarios que reciban becas de estudio estatales|Los adultos mayores que perciban la Renta Dignidad mensual|Las personas que residan temporalmente fuera del territorio nacional|Art. 28.II: En ningún caso las personas con discapacidad visual podrán percibir la Renta Solidaria, ni aquellas personas mientras desempeñen funciones en el sector público.",
        "¿Cuáles son las fuentes de recursos económicos para la gestión pública en discapacidad (Art. 29)?|Recursos de la Ley 3925 (eliminación de subsidios a partidos políticos), donaciones, legados y cooperación nacional e internacional|Un porcentaje fijo del Impuesto Directo a los Hidrocarburos (IDH) departamental|Aportes obligatorios descontados de las planillas del sector privado industrial|Tasas consulares cobradas en embajadas bolivianas en el exterior del país|Art. 29: Provenientes de la Ley 3925 (eliminación de subsidios a partidos políticos), donaciones, legados y recursos de cooperación nacional e internacional.",

        "¿Qué garantiza el Estado en el ámbito de la Educación Superior Universitaria (Art. 31.VIII y IX)?|Extender de manera gratuita diplomas académicos y títulos en provisión nacional, y dotar de instrumentos de evaluación adecuados (braille y lengua de señas)|Cobrar aranceles diferenciados reducidos al cincuenta por ciento en postgrados|Eximir a los estudiantes de la presentación de tesis de grado o examen de suficiencia|Garantizar becas de manutención económica mensual en dinero efectivo|Art. 31.VIII y IX: Extender gratuitamente diplomas académicos y títulos en provisión nacional, y facilitar instrumentos de evaluación adecuados como braille e intérpretes de señas.",
        "¿Qué establece la ley sobre medicamentos e insumos relacionados con la discapacidad (Art. 32.II)?|El Estado otorgará medicamentos e insumos de necesidad permanente de manera gratuita cuando no cuenten con otros mecanismos de provisión|La venta obligatoria de medicamentos subvencionados en farmacias privadas comerciales|La importación libre de aranceles aduaneros únicamente para medicamentos importados|La entrega mensual de bonos compensatorios para la adquisición de fármacos en clínicas|Art. 32.II: El Estado otorgará medicamentos e insumos de necesidad permanente relacionados con la discapacidad de manera gratuita cuando no cuenten con otros mecanismos.",
        "¿Qué exención tributaria otorga el Estado según el Artículo 33?|Exención total del pago de tributos para la importación de órtesis, prótesis y ayudas técnicas, exceptuando vehículos automotores|Exención total de impuestos municipales a la propiedad de bienes inmuebles urbanos|Liberación del pago de aranceles de importación para vehículos automotores adaptados|Exención del impuesto al valor agregado (IVA) en la compra de alimentos de consumo|Art. 33: Exención total del pago de tributos para la importación de órtesis, prótesis y ayudas técnicas, exceptuando vehículos automotores.",
        "¿Qué garantiza el Estado en el ámbito del trabajo (Art. 34.II)?|La inamovilidad laboral a las personas con discapacidad, cónyuges, padres, madres y/o tutores de hijos con discapacidad, cumpliendo la normativa|La prohibición absoluta de despido bajo cualquier circunstancia, incluso por comisión de delitos|El ascenso automático de categoría funcionaria cada dos años de servicio institucional|La jubilación forzosa obligatoria al cumplir los cincuenta años de edad laboral|Art. 34.II: El Estado garantizará la inamovilidad laboral a las personas con discapacidad, cónyuges, padres, madres y/o tutores de hijos con discapacidad.",
        "¿Quién otorga el beneficio de gratuidad para el reconocimiento de personalidad jurídica de organizaciones (Art. 35)?|El Ministerio de Autonomías y los Gobiernos Departamentales del Estado Plurinacional|El Tribunal Supremo Electoral y las Cortes Electorales Departamentales|El Ministerio de Justicia a través del CONALPEDIS central|La Contraloría General del Estado y la Procuraduría General|Art. 35: El Ministerio de Autonomías y los Gobiernos Departamentales otorgarán el beneficio de gratuidad para el trámite de reconocimiento de la personalidad jurídica.",
        "¿Qué obligación tienen instituciones públicas, servicios privados y Unidades Educativas en comunicación (Art. 36.I)?|Incorporar comunicación alternativa y un intérprete en Lengua de Señas Boliviana (LSB) en actos de relevancia institucional|Impartir clases obligatorias de braille a todo el personal administrativo superior|Traducir todas las leyes nacionales a lenguajes informáticos digitales especiales|Contar con subtitulado simultáneo en pantallas gigantes obligatorias|Art. 36.I: Están obligadas a incorporar comunicación alternativa y un intérprete en Lengua de Señas Boliviana (LSB) para traducción en actos de relevancia.",

        "¿Qué se establece sobre la gratuidad de la Libreta de Servicio Militar (Art. 40)?|La gratuidad del trámite de la libreta de servicio militar para las personas con discapacidad que requieran de este documento|La eximición de la obligación de portar documentos de identificación militar personal|La entrega automática de la libreta a los dieciocho años sin evaluación médica previa|La condecoración honorífica militar anual para ciudadanos con discapacidad motora|Art. 40: Se establece la gratuidad del trámite de la libreta de servicio militar para las personas con discapacidad que requieran de este documento.",
        "¿Qué instituye el Artículo 41 sobre documentos de Registro Civil?|El Órgano Electoral implementará medidas para que personas con discapacidad grave y muy grave accedan a gratuidad en certificados de nacimiento, matrimonio y defunción|La emisión gratuita de cédulas de identidad personal para toda la población del país|La inscripción registral automática de hijos de padres con discapacidad en oficinas locales|La condonación de multas por inscripción tardía de partidas de nacimiento civil|Art. 41: El Órgano Electoral implementará medidas que permitan a toda persona con discapacidad grave y muy grave acceder al beneficio de gratuidad en certificados.",

        "¿Quiénes conforman el Directorio del CONALPEDIS (Art. 47.I)?|Nueve representantes de la COBOPDI y nueve representantes del Órgano Ejecutivo designados por Ministerios|Representantes de las cámaras de senadores y diputados de la Asamblea Legislativa|Delegados elegidos por voto universal de las organizaciones departamentales de ciegos|Unidades militares de las Fuerzas Armadas y de la Policía Boliviana|Art. 47.I: Nueve representantes de la COBOPDI y nueve representantes del Órgano Ejecutivo designados mediante Resolución Ministerial.",
        "¿Qué atribuciones tienen las Asambleas Legislativas Departamentales y Concejos Municipales (Art. 48)?|Dictar normas sobre condiciones técnicas de diseño y obras de edificación en construcciones públicas, vías peatonales, señalización y transporte|Modificar el presupuesto general del Estado asignado a los ministerios de Estado|Aprobar tratados internacionales bilaterales en materia de derechos humanos|Nombrar a los jueces públicos en materia de niñez, adolescencia y familia|Art. 48: Dictarán normas sobre condiciones técnicas de diseño y obras de edificación, rutas peatonales, señalización y beneficios en transporte.",

        "¿Qué ley se dispone mantener vigente transitoriamente mediante la Disposición Transitoria Única?|La vigencia de derechos de la Ley N° 1678 de 15 de diciembre de 1995 hasta que se aprueben estatutos autonómicos y cartas orgánicas|La Ley Orgánica de Municipalidades promulgada en el período constitucional anterior|El Código de Procedimiento Penal de la República de Bolivia de 1999|La Ley de Reforma Educativa N° 1565 de 7 de julio de 1994|Disposición Transitoria Única: Se dispone transitoriamente la vigencia de derechos de la Ley N° 1678 de 15 de diciembre de 1995 hasta que se aprueben estatutos autonómicos y cartas orgánicas.",
        "¿Qué norma se mantiene vigente de manera explícita en la Disposición Final Única de la Ley N° 223?|La Ley de 22 de enero de 1957, que crea el Instituto Boliviano de la Ceguera y los Decretos Reglamentarios|La Ley de Pensiones del Sistema Integral de Seguridad Social boliviano|El Decreto Supremo de creación de las escuelas normales superiores de maestros|La Ley General del Trabajo en sus artículos referidos a despidos injustificados|Disposición Final Única: Se mantiene vigente la Ley de 22 de enero de 1957, que crea el Instituto Boliviano de la Ceguera y los Decretos Reglamentarios.",
        "¿En qué fecha fue promulgada la Ley N° 223 General para Personas con Discapacidad?|2 de marzo de 2012|8 de octubre de 2010|31 de marzo de 2010|20 de diciembre de 2010|Encabezado de la Ley N° 223: Promulgada el 2 de marzo de 2012 por el Presidente Constitucional Evo Morales Ayma.",
        "¿Quién era el Presidente de Bolivia al promulgarse la Ley N° 223 en marzo de 2012?|Evo Morales Ayma|David Choquehuanca Céspedes|Héctor Enrique Arce Zaconeta|Juan Ramón Quintana Taborga|Encabezado de la Ley N° 223: Evo Morales Ayma, Presidente Constitucional del Estado Plurinacional de Bolivia.",
        "¿Qué finalidad persiguen los programas de Habilitación y Rehabilitación (Art. 5.16)?|Lograr que personas con deficiencias congénitas o adquiridas obtengan la máxima independencia y capacidad física, intelectual, mental y social|Aislar temporalmente a los pacientes en centros médicos especializados cerrados|Otorgar certificados médicos de invalidez permanente para jubilación anticipada|Sustituir los tratamientos farmacológicos clínicos por terapias alternativas|Art. 5.16: Medidas efectivas destinadas a lograr que personas con deficiencias congénitas o adquiridas obtengan la máxima independencia, capacidad física, intelectual, social y vocacional.",

        "¿Qué son los Ajustes Razonables según el Artículo 5.22?|Modificaciones y adaptaciones necesarias y adecuadas que no impongan carga desproporcionada para garantizar el ejercicio de derechos fundamentales|La reducción temporal de jornadas laborales por razones de enfermedad común|El incremento salarial automático anual por antigüedad en la institución pública|La condonación de deudas tributarias acumuladas en oficinas de impuestos|Art. 5.22: Modificaciones, adaptaciones necesarias y adecuadas, que no impongan carga desproporcionada, para garantizar el goce o ejercicio de derechos humanos.",
        "¿Qué establece el Artículo 9 sobre el Derecho a la Protección del Estado?|El Estado adoptará políticas públicas para la protección y desarrollo integral, y asumirá la responsabilidad en caso de abandono u orfandad|La obligación de otorgar una pensión vitalicia en dinero a todas las familias numerosas|La tutela legal de menores de edad mediante tribunales militares de honor|La expropiación de bienes inmuebles privados para instalar albergues temporales|Art. 9: El Estado adoptará políticas públicas para protección y desarrollo integral, y en caso de abandono u orfandad asumirá la responsabilidad de acuerdo a competencias.",
        "¿Qué garantiza el Artículo 11 sobre Comunicación en Sistemas y Lenguas Alternativas?|El Estado promueve la comunicación en sistemas y lenguas alternativas para la inclusión, acceso a la información y ejercicio pleno de derechos|La obligatoriedad de aprender braille en todas las escuelas fiscales del país|La traducción simultánea en lengua extranjera de todos los programas radiales|La edición de textos escolares impresos exclusivamente en tipografía gigante|Art. 11: El Estado Plurinacional promueve la comunicación en sistemas y lenguas alternativas para la inclusión y el acceso a la información y ejercicio pleno.",
        "¿Qué garantiza el Artículo 14 sobre el Derecho a la Identidad?|El derecho a la identidad, respetando la pluriculturalidad, al nombre, nacionalidad y a ser inscrito inmediatamente después de su nacimiento|La asignación automática de un apellido convencional en caso de desconocimiento familiar|La gratuidad en la otorgación de pasaportes diplomáticos internacionales|El registro civil centralizado obligatorio en la ciudad de La Paz|Art. 14: El Estado garantiza el derecho a la identidad, respetando su pluriculturalidad, al nombre, nacionalidad, a ser inscrito inmediatamente después de su nacimiento.",
        "¿Qué dispone el Artículo 16 sobre Albergues o Centros de Acogida?|Para personas con discapacidad en situación de abandono, promueve la existencia de albergues garantizando atención con calidad y calidez|La internación obligatoria de adultos mayores con discapacidad en asilos estatales|La prohibición de administrar hogares de acogida por instituciones privadas o religiosas|La administración exclusiva de centros residenciales por las Fuerzas Armadas|Art. 16: Para las personas con discapacidad en situación de abandono promueve la existencia de albergues o centros de acogida y garantiza atención con calidad y calidez.",
        "¿Qué establece el Artículo 19 sobre el Derecho a la Integridad?|Derecho a que se respete la integridad física y mental, especialmente de niñas, niños y mujeres, informando sobre precauciones contra el abuso sexual|La prohibición de someter a exámenes médicos periódicos a personas con discapacidad|La obligación de portar certificados de buena salud mental para actos civiles|La tutela médica obligatoria en centros psiquiátricos cerrados preventivos|Art. 19: Derecho a que se respete su integridad física y mental especialmente de niñas, niños y mujeres, debiendo estar informados de precauciones para prevenir abuso.",
        "¿Qué derecho asiste a personas con discapacidad intelectual y mental leve o moderada según el Artículo 20?|Derecho a ser consultadas respecto a todas las decisiones que se refieran a su vida, salud, educación, familia y seguridad social|La representación legal absoluta e irrevocable por parte de los ministerios de Estado|La inhabilitación civil automática para contraer matrimonio o adquirir bienes|La obligación de someterse a tratamientos médicos experimentales autorizados|Art. 20: Tienen el derecho a ser consultadas respecto a todas las decisiones que se refieran a su vida, salud, educación, familia, seguridad social, según sus posibilidades.",
        "¿Qué políticas de estímulo promueve el Estado para Sociedades Cooperativas (Art. 26)?|Promueve y respalda la organización y funcionamiento de cooperativas organizadas por personas con discapacidad, padres, madres o tutores|La concesión de créditos fiscales preferenciales exentos de pago de IVA corporativo|La inyección de capital estatal no reembolsable en empresas comerciales privadas|La compra estatal obligatoria de la producción cooperativa sin licitación previa|Art. 26.I: El Estado promueve y respalda la organización y funcionamiento de las cooperativas organizadas por personas con discapacidad, padres, madres y/o tutores.",
        "¿Qué ámbito comprende la Transversalidad de la Temática de Discapacidad (Art. 43)?|El Estado en todos sus niveles deberá transversalizar la temática de discapacidad en su régimen normativo, planes, programas y proyectos|La aplicación exclusiva de normas sectoriales en el Ministerio de Salud y Deportes|La centralización de presupuestos públicos en una sola cuenta fiscal nacional|La obligatoriedad de dictar materias sobre discapacidad en universidades privadas|Art. 43: El Estado Plurinacional en todos sus niveles deberá transversalizar la temática de discapacidad, en su régimen normativo, planes, programas y proyectos.",
        "¿A qué están sujeta las políticas públicas, programas y proyectos en materia de discapacidad según el Artículo 44?|Estarán sujetos al control social, rendición de cuentas y a la consulta permanente con las organizaciones de personas con discapacidad|A la fiscalización exclusiva del Ministerio de Economía y Finanzas Públicas|A la aprobación previa de las cámaras legislativas nacionales en sesión plenaria|A auditorías externas semestrales realizadas por empresas extranjeras|Art. 44: Estarán sujetos al control social, rendición de cuentas y a la consulta permanente con las organizaciones de personas con discapacidad.",
        "¿Cuál es una de las atribuciones específicas del CONALPEDIS (Art. 46)?|Ser el organismo de consulta y asesoría obligatoria para dependencias y Ministerios del Órgano Ejecutivo que realicen programas|Dictar sentencias judiciales de cumplimiento obligatorio en materia laboral privada|Administrar directamente los recursos financieros de la Renta Solidaria nacional|Intervenir instituciones educativas privadas que incumplan adaptaciones curriculares|Art. 46.9: Ser el organismo de consulta y asesoría obligatoria para las dependencias y Ministerios del Órgano Ejecutivo que realicen programas y proyectos.",
        "¿Qué deben registrar obligatoriamente las Organizaciones sin fines de lucro en el CONALPEDIS (Art. 46.10)?|Las ONGs, Fundaciones y Asociaciones Civiles sin fines de lucro que trabajan con programas y proyectos en materia de discapacidad|Los balances financieros corporativos anuales presentados a impuestos internos|Las planillas salariales de sus trabajadores profesionales nacionales y extranjeros|Los títulos profesionales universitarios de sus directores ejecutivos y gerentes|Art. 46.10: Registrar a las Organizaciones no Gubernamentales, Fundaciones y Asociaciones Civiles sin fines de lucro que trabajan con programas y proyectos.",

    ]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>
