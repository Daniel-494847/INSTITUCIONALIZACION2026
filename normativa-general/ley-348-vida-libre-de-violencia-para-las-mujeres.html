        "¿Cuál es el objeto fundamental de la Ley Nº 348 (Art. 2)?|Establecer mecanismos, medidas y políticas integrales de prevención, atención, protección, reparación y sanción a los agresores para garantizar a las mujeres una vida digna|Regular de manera exclusiva los contratos comerciales mercantiles entre empresas privadas y cónyuges|Modificar el Código de Procedimiento Civil boliviano en materia de herencias familiares|Establecer un régimen aduanero especial de importación para productos de uso doméstico|Art. 2: Establecer mecanismos, medidas y políticas integrales de prevención, atención, protección y reparación a las mujeres en situación de violencia, así como la persecución y sanción a los agresores.",
        "¿Cómo asume el Estado Plurinacional de Bolivia la erradicación de la violencia hacia las mujeres (Art. 3.I)?|Como una prioridad, por ser una de las formas más extremas de discriminación en razón de género|Como un programa opcional administrado por organizaciones no gubernamentales internacionales|Como una competencia exclusiva de los gobiernos autónomos municipales sin apoyo central|Como un asunto de resolución privada entre las familias afectadas por conflictos|Art. 3.I: El Estado Plurinacional de Bolivia asume como prioridad la erradicación de la violencia hacia las mujeres, por ser una de las formas más extremas de discriminación en razón de género.",

        "¿Cuál es el ámbito de aplicación territorial y personal de la Ley Nº 348 (Art. 5)?|Rige en todo el territorio del Estado Plurinacional de Bolivia, es de cumplimiento obligatorio y de aplicación preferente sin fuero ni privilegio alguno|Únicamente en las capitales de departamento y en instituciones públicas del nivel central|Exclusivamente en las áreas rurales e indígena originario campesinas del país|Solo en los establecimientos educativos fiscales y centros de salud pública autorizados|Art. 5: Rige en todo el territorio del Estado Plurinacional; es de aplicación preferente, de cumplimiento obligatorio sin fuero ni privilegio alguno y aplicable a personas en situación de vulnerabilidad.",
        "¿Cómo define la Ley Nº 348 el concepto de Violencia (Art. 6.1)?|Cualquier acción u omisión, abierta o encubierta, que cause muerte, sufrimiento o daño físico, sexual o psicológico a una mujer por el sólo hecho de serlo|Un desacuerdo de carácter estrictamente civil o patrimonial entre socios comerciales|Cualquier error administrativo involuntario cometido en oficinas públicas del Estado|Un conflicto laboral colectivo regulado por la Ley General del Trabajo vigente|Art. 6.1: Constituye cualquier acción u omisión, abierta o encubierta, que cause la muerte, sufrimiento o daño físico, sexual o psicológico a una mujer u otra persona por el sólo hecho de ser mujer.",
        "¿Qué se entiende por Violencia Feminicida (Art. 7.2)?|La acción de extrema violencia que viola el derecho fundamental a la vida y causa la muerte de la mujer por el hecho de serlo|Cualquier accidente de tránsito fatal ocurrido en carreteras interdepartamentales del país|Un homicidio cometido en legítima defensa propia o de terceros dependientes|Un suicidio derivado exclusivamente de problemas económicos de índole mercantil|Art. 7.2: Es la acción de extrema violencia que viola el derecho fundamental a la vida y causa la muerte de la mujer por el hecho de serlo.",
        "¿Cómo define la ley la Violencia Mediática (Art. 7.4)?|Aquella producida por medios masivos a través de publicaciones, mensajes e imágenes estereotipadas que promueven sumisión, explotación u homologan humillaciones|La prohibición de difundir noticias de carácter político en canales estatales de televisión|La censura previa ejercida por el Ministerio de Comunicación en redes sociales digitales|La difusión de información oficial gubernamental sin traducción a lenguas originarias|Art. 7.4: Aquella producida por los medios masivos de comunicación a través de publicaciones, difusión de mensajes e imágenes estereotipadas que promueven la sumisión y/o explotación de mujeres.",

        "¿Quién es el Ente Rector responsable de la coordinación, articulación y vigilancia de la Ley Nº 348 (Art. 16)?|El Ministerio de Justicia|El Ministerio de Gobierno y Policía Boliviana|El Ministerio de Salud y Deportes|El Ministerio de Educación y Culturas|Art. 16: El Ministerio de Justicia, en el marco de sus competencias y atribuciones es el Ente Rector responsable de coordinación, articulación y vigilancia de la aplicación efectiva de la Ley.",

        "¿Cuáles son los tres criterios de acción para la prevención de la violencia establecidos en el Artículo 17?|Prevención Estructural, Prevención Individual y Prevención Colectiva|Prevención Primaria, Prevención Secundaria y Prevención Terciaria|Prevención Policial, Prevención Judicial y Prevención Administrativa|Prevención Escolar, Prevención Laboral y Prevención Comunitaria|Art. 17.I: Se adoptarán medidas bajo tres criterios de acción: Prevención Estructural, Prevención Individual y Prevención Colectiva.",
        "¿Qué obligación tiene el personal de salud ante un caso de violencia según el Artículo 20.I.9 y II?|Extender certificado médico obligatorio y gratuito de oficio y reportar el caso al Ente Rector en el plazo de 48 horas|Cobrar aranceles hospitalarios preferenciales a las víctimas antes de atenderlas|Exigir la presencia de un fiscal de materia antes de prestar atención de emergencia|Derivar obligatoriamente a la paciente a centros médicos privados acreditados|Art. 20.I.9 y II: Extender de oficio, de forma obligatoria y gratuita un certificado médico, y reportar casos al Ente Rector dentro de las 48 horas de conocidos los hechos.",
        "¿Qué medidas debe adoptar el Ministerio de Trabajo respecto al empleo según el Artículo 21?|Garantizar acceso a trabajo digno sin discriminación, prohibir pruebas de embarazo o VIH/SIDA y sancionar despido injustificado|Fijar cuotas obligatorias de contratación de personal extranjero en empresas privadas|Establecer la obligatoriedad de turnos rotativos nocturnos para trabajadoras madres|Otorgar subsidios monetarios estatales directos a empresas que contraten varones|Art. 21.I: Adoptar mecanismos que garanticen derechos laborales, prohibir pruebas de VIH/SIDA o embarazo como requisito, y regular/sancionar el despido injustificado.",
        "¿Qué son las Casas de Acogida y Refugio Temporal (Art. 25)?|Instancias creadas, equipadas y mantenidas por Entidades Territoriales Autónomas para brindar refugio seguro y gratuito a mujeres en situación de violencia|Centros penitenciarios de máxima seguridad destinados al cumplimiento de penas privativas de libertad|Hospitales psiquiátricos especializados en el tratamiento de trastornos mentales graves|Oficinas administrativas municipales de registro civil de matrimonios y uniones libres|Art. 25: Las Entidades Territoriales Autónomas tienen la responsabilidad de crear, equipar, mantener y atender Casas de Acogida y Refugio Temporal para mujeres en situación de violencia.",
        "¿Cuál es el tiempo máximo de permanencia de una mujer en las Casas de Acogida (Art. 28)?|No podrán permanecer más de tres meses, salvo casos excepcionales justificados por persistir situación de riesgo o inestabilidad física/psicológica|Hasta un plazo fijo e improrrogable de treinta días calendario sin excepciones|Un período continuo de dos años computables desde el día de su ingreso oficial|Indefinidamente hasta que la justicia emita sentencia condenatoria ejecutoriada|Art. 28: No podrán permanecer más de tres meses, a menos que por la gravedad o persistencia de la situación de riesgo se requiera prolongar hasta su completo restablecimiento.",

        "¿Qué objetivo tienen las medidas de protección según el Artículo 32?|Interrumpir e impedir un hecho de violencia, o garantizar la investigación, procesamiento y sanción, salvaguardando la vida e integridad de la mujer|Sustituir por completo las penas privativas de libertad dictadas en sentencia condenatoria|Obligar a los agresores al pago inmediato de indemnizaciones civiles millonarias|Garantizar la libertad provisional del imputado durante la etapa preparatoria fiscal|Art. 32.I y II: Tienen por objeto interrumpir e impedir un hecho de violencia y son de aplicación inmediata para salvaguardar la vida, integridad y derechos de las mujeres.",
        "¿Qué establece el Artículo 46 respecto a la Conciliación?|La conciliación está prohibida en cualquier hecho de violencia contra las mujeres que comprometa su vida e integridad sexual|Se permite la conciliación voluntaria en cualquier etapa del proceso penal por delitos graves|Es obligatoria antes de presentar cualquier denuncia formal ante la Policía o Fiscalía|Los jueces de familia pueden promover acuerdos de conciliación en casos de feminicidio|Art. 46.I: La conciliación está prohibida en cualquier hecho de violencia contra las mujeres, que comprometa su vida e integridad sexual. Ninguna institución receptora podrá promoverla.",
        "¿Qué dependencias deben organizar los Gobiernos Autónomos Municipales según el Artículo 50?|Los Servicios Legales Integrales Municipales (SLIM) para la protección y defensa psicológica, social y legal de las mujeres|Fiscalías de materia especializadas en investigación de delitos económicos y financieros|Juzgados instructores de sentencia en materia penal ordinaria departamental|Unidades policiales de patrullaje urbano de control migratorio y aduanero|Art. 50.I: Los Gobiernos Autónomos Municipales tienen la obligación de organizar los Servicios Legales Integrales Municipales o fortalecerlos para la protección y defensa de mujeres.",
        "¿Qué organismo especializado de la Policía Boliviana se crea mediante el Artículo 53?|La Fuerza Especial de Lucha Contra la Violencia (FELCV), encargada de prevención, auxilio, investigación e identificación de agresores|La Dirección General de Investigación Criminal de Delitos Patrimoniales Ordinarios|El Batallón de Seguridad Física Privada autorizado para control municipal|La Brigada Operativa de Protección Ambiental y Forestal del Estado|Art. 53.I: Se crea la Fuerza Especial de Lucha Contra la Violencia, como organismo especializado de la Policía Boliviana encargado de la prevención, auxilio e investigación.",
        "¿Cuál es el plazo máximo para que la FELCV ponga a disposición del Ministerio Público a un aprehendido en delito flagrante (Art. 54.2)?|En el plazo máximo de ocho (8) horas|En un plazo improrrogable de veinticuatro (24) horas hábiles|Dentro de las cuarenta y ocho (48) horas judiciales siguientes al hecho|En forma inmediata sin superar el límite de dos horas cronológicas|Art. 54.2: Aprehenderlos de inmediato en caso de delito flagrante y ponerlos a disposición del Ministerio Público, en el plazo máximo de ocho (8) horas.",
        "¿Cómo se tipifica el delito de Feminicidio en el Artículo 252 bis del Código Penal incorporado por la Ley Nº 348?|Se sancionará con pena de presidio de treinta (30) años sin derecho a indulto cuando se mate a una mujer bajo circunstancias específicas de género|Con privación de libertad de quince a veinte años sin derecho a beneficios penitenciarios|Con reclusión de diez a quince años si media emoción violenta excusable|Con presidio de veinticinco años con derecho a indulto presidencial extraordinario|Art. 252 bis: Se sancionará con la pena de presidio de treinta (30) años sin derecho a indulto, a quien mate a una mujer, en cualquiera de las siguientes circunstancias establecidas.",

        "¿Qué sanciona el Artículo 308 bis sobre Violación de Infante, Niña, Niño o Adolescente?|Privación de libertad de veinte (20) a veinticinco (25) años si la víctima es menor de 14 años, y 30 años sin indulto si hay agravantes|Privación de libertad de diez a quince años con posibilidad de indulto parcial|Reclusión menor de cuatro a ocho años si media consentimiento de la víctima|Multas pecuniarias diarias y trabajos comunitarios obligatorios por cinco años|Art. 308 bis: Si el delito fuere cometido contra menor de catorce (14) años, será sancionado con privación de libertad de veinte (20) a veinticinco (25) años, y 30 años sin indulto con agravantes.",
        "¿Qué establece el Artículo 312 ter sobre Padecimientos Sexuales (delitos de lesa humanidad)?|Pena privativa de libertad de quince (15) a treinta (30) años en ataques generalizados o sistemáticos (violación, prostitución forzada, confinamiento para embarazo forzado)|Sanción administrativa de destitución funcionaria e inhabilitación temporal por diez años|Multas económicas equivalentes a trescientos sesenta y cinco días de salario mínimo|Reclusión de dos a cuatro años sujeta a medidas sustitutivas a la detención preventiva|Art. 312 ter: Sancionado con pena de 15 a 30 años quien en ataque generalizado o sistemático incurra en violación, prostitución forzada o confinamiento de mujer embarazada a la fuerza.",

        "¿Qué establece el principio de Gratuidad procesal en el Artículo 86.1?|Las mujeres en situación de violencia estarán exentas del pago de valores, legalizaciones, notificaciones, formularios, testimonios, certificaciones y peritajes|La obligación del Estado de pagar los honorarios de abogados particulares contratados libremente|La subvención estatal de pasajes de transporte público para asistencia a audiencias judiciales|La gratuidad en la adquisición de medicamentos en farmacias privadas comerciales|Art. 86.1: Las mujeres en situación de violencia estarán exentas del pago de valores, legalizaciones, notificaciones, formularios, testimonios, certificaciones, peritajes y otros en reparticiones.",
        "¿A quién corresponde la carga de la prueba en procesos penales por violencia contra las mujeres según el Art. 86.12?|La carga de la prueba corresponderá al Ministerio Público, sin exigirse a la mujer demostrar hechos de violencia|Exclusivamente a la víctima denunciante mediante la presentación de testigos presenciales|A la defensa técnica del imputado mediante la aportación de peritajes privados|En partes iguales a la víctima y al Ministerio Público en la etapa preparatoria|Art. 86.12 y Art. 94: La carga de la prueba corresponderá al Ministerio Público; ninguna mujer debe tener la responsabilidad de demostrar judicialmente los hechos de violencia.",

        "¿Cuál es el plazo establecido en la Disposición Transitoria Séptima para la creación de la institucionalidad prevista por la ley?|En el plazo de tres (3) meses a partir de su promulgación por parte del nivel central del Estado y Entidades Territoriales Autónomas|En un plazo improrrogable de treinta días calendario contados desde su publicación oficial|Dentro de los ciento ochenta días hábiles administrativos del año fiscal en curso|En el plazo de un año contado desde la aprobación de los estatutos autonómicos departamentales|Disposición Transitoria Séptima: El nivel central del Estado adoptará las medidas necesarias para la creación y funcionamiento de la institucionalidad en el plazo de 3 meses.",
        "¿En qué fecha fue promulgada oficialmente la Ley Nº 348 Integral para Garantizar a las Mujeres una Vida Libre de Violencia (Fin de texto)?|9 de marzo de 2013|8 de octubre de 2010|2 de marzo de 2012|6 de agosto de 2013|Encabezado y Promulgación: Ley promulgada el 9 de marzo de 2013 por el Presidente Constitucional Evo Morales Ayma.",
        "¿Quién era el Presidente de Bolivia al promulgarse la Ley Nº 348 en marzo de 2013?|Evo Morales Ayma|David Choquehuanca Céspedes|Héctor Enrique Arce Zaconeta|Juan Ramón Quintana Taborga|Encabezado de la Ley Nº 348: Evo Morales Ayma, Presidente Constitucional del Estado Plurinacional de Bolivia.",
        "¿Qué tipos de violencia contra las mujeres enumera el Artículo 7 de forma enunciativa y no limitativa?|Física, Feminicida, Psicológica, Mediática, Simbólica, Contra la honra, Sexual, Reproductiva, En salud, Patrimonial, Laboral, Educativa, Política, Institucional, Familiar y Libertad sexual|Exclusivamente Violencia Física, Violencia Psicológica y Violencia Sexual tipificada en el Código Penal|Violencia Comercial, Violencia Bancaria, Violencia Arancelaria y Violencia Mercantil internacional|Violencia Partidaria, Violencia Sindical, Violencia Deportiva y Violencia Diplomática exterior|Art. 7: Enunciativamente contempla violencia física, feminicida, psicológica, mediática, simbólica, contra la honra, sexual, reproductiva, en salud, patrimonial, laboral, educativa, política, institucional, familiar y libertad sexual.",
        "¿Qué responsabilidades tienen las Entidades Territoriales Autónomas respecto a la violencia (Art. 3.III)?|En el marco de sus competencias, asignarán recursos humanos y económicos destinados a la implementación de políticas, programas y proyectos para erradicar la violencia|Financiar el pago de salarios de los jueces y fiscales de materia en todo el país|Administrar los recintos penitenciarios de máxima seguridad y centros de rehabilitación penal|Importar medicamentos e insumos médicos gratuitos para hospitales de tercer nivel|Art. 3.III: Las Entidades Territoriales Autónomas, en el marco de sus competencias, asignarán los recursos humanos y económicos destinados a la implementación de políticas y programas.",
        "¿Qué se establece sobre la obligatoriedad de la formación en género (Art. 12)?|Todos los Órganos del Estado, Ministerio Público, Policía, FFAA y entidades públicas adoptarán programas de formación obligatorios y actualizados en cultura contra la violencia e igualdad|Es un curso optativo para funcionarios jerárquicos superiores con más de cinco años de antigüedad|Aplica únicamente al personal administrativo de ministerios coordinadores del nivel central|Es un requisito exigido exclusivamente para postular a cargos electivos políticos generales|Art. 12: Órganos del Estado, Ministerio Público, Policía, FFAA y toda entidad pública adoptarán programas de formación específica relativos a cultura contra la violencia e igualdad, con carácter obligatorio.",
        "¿Qué medidas comprende la Prevención Estructural según el Artículo 17.I.1?|Medidas de carácter integral para modificar actitudes, prácticas y omisiones que generan violencia, a través de sensibilización y educación en familia, escuela y sociedad|Dotación de botones de pánico electrónicos y cámaras de vigilancia en calles urbanas|Patrullaje policial permanente en zonas rojas de alta peligrosidad delictiva urbana|La aplicación de multas pecuniarias drásticas a infractores en dependencias policiales|Art. 17.I.1: Medidas de carácter integral destinadas a modificar actitudes y prácticas que tienen como efecto la violencia, a través de sensibilización y educación en familia y sociedad.",
        "¿Qué establece el Artículo 19 sobre las medidas en el ámbito educativo?|El Ministerio de Educación debe incorporar estrategias de prevención, enfoque de género en currículas, centros psicológicos escolares y prohibir textos sexistas|Establecer la obligación de cursar materias militares obligatorias en secundaria|Prohibir el ingreso de estudiantes mujeres a carreras técnicas industriales superiores|Otorgar becas de estudio universitarias financiadas por empresas privadas comerciales|Art. 19.I: Incorporar estrategias de prevención, enfoque de género en currícula, crear centros de atención psicológica, prohibir textos con contenidos sexistas y discriminatorios.",
        "¿Qué se dispone sobre los certificados médicos expedidos por profesionales de salud (Art. 20.I.9)?|Deberán ser extendidos de oficio, de forma obligatoria, gratuita y en papel corriente; el médico forense los homologará con carácter prioritario|Tienen un costo arancelario fijo pagado por la paciente al momento de la revisión clínica|Deben ser legalizados por un notario de fe pública antes de ser presentados ante la FELCV|Son emitidos exclusivamente por médicos forenses adscritos al Ministerio Público|Art. 20.I.9: El personal médico deberá extender de oficio, obligatoria, gratuita y en papel corriente, un certificado médico; el médico forense homologará con carácter prioritario.",
        "¿Qué medidas adopta el Ministerio de Comunicación según el Artículo 22?|Diseño e implementación de una estrategia nacional de comunicación con campañas masivas para informar, sensibilizar y desestructurar estereotipos patriarcales|Censura previa de contenidos informativos en medios impresos independientes privados|Transmisión obligatoria de cadenas gubernamentales diarias en canales de televisión abierta|Subsidio estatal directo a empresas periodísticas impresas de circulación nacional|Art. 22: Diseño e implementación de una estrategia nacional de comunicación, que incluya campañas en medios masivos para sensibilizar y desestructurar estereotipos patriarcales.",
        "¿Qué obligaciones tienen los medios de comunicación según el Artículo 23?|Adoptar códigos de ética, destinar espacio mínimo gratuito para mensajes de valores y difundir informaciones de forma objetiva precautelando la dignidad de la mujer|Transmitir obligatoriamente programas educativos culturales durante ocho horas diarias|Publicar las identidades completas de las víctimas de delitos sexuales sin restricciones|Pagar un impuesto extraordinario anual al Ente Rector por difusión publicitaria|Art. 23: Adoptar códigos de ética, destinar espacio mínimo gratuito para mensajes de valores y difundir informaciones de forma objetiva precautelando la defensa de la autonomía y dignidad.",
        "¿Qué servicios deben prestar obligatoriamente las Casas de Acogida y Refugio Temporal (Art. 26.II)?|Hospedaje, alimentación, programas reeducativos, capacitación en habilidades laborales y acceso prioritario al sistema de colocación de empleo|Asesoramiento mercantil corporativo y gestión de créditos bancarios comerciales|Atención médica quirúrgica general de alta complejidad en hospitales de tercer nivel|Asistencia escolar obligatoria para hijos de tutores legales en centros privados|Art. 26.II: Hospedaje y alimentación, programas reeducativos integrales, capacitación en habilidades y técnicas laborales, y acceso prioritario al sistema de colocación de empleo.",
        "¿Qué se garantiza respecto a la localización de las Casas de Acogida (Art. 27)?|Su localización no podrá ser revelada, garantizando el anonimato y privacidad de las mujeres acogidas como refugio seguro|Deben estar ubicadas obligatoriamente en zonas céntricas de fácil acceso público general|Sus instalaciones físicas son de libre ingreso para familiares y cónyuges denunciados|Deben exhibir placas identificatorias visibles en el frontis de los inmuebles urbanos|Art. 27: Se constituyen en refugio seguro, por tanto su localización no podrá ser revelada, garantizando el anonimato y privacidad de las mujeres acogidas.",
        "¿Qué establece el Artículo 34 respecto a la denuncia en procesos judiciales familiares?|Si un juez de familia conoce actos de violencia, tiene la obligación de remitir antecedentes al Ministerio Público y adoptar medidas de protección para la mujer y sus hijos|Los jueces familiares tienen competencia privativa para conocer y sancionar delitos de feminicidio|La vía familiar suspende automáticamente los plazos procesales de la investigación penal|Se prohíbe a los jueces de familia dictar medidas de protección provisionales cautelares|Art. 34: Si durante un proceso el juez tuviera conocimiento de actos de violencia, tiene obligación de remitir antecedentes al Ministerio Público y adoptar medidas de protección.",
        "¿Qué medidas de protección específicas puede dictar la autoridad competente (Art. 35)?|Ordenar salida del agresor del domicilio, prohibir enajenar bienes, disponer asistencia familiar, prohibir acercamiento, restituir al domicilio y otras|Dictar orden de apremio corporal definitiva sin derecho a cesación en delitos menores|Disponer la confiscación inmediata de todos los bienes propios del agresor a favor del Estado|Conceder libertad irrestricta provisional al imputado bajo fianza juratoria simple|Art. 35: Ordenar salida del agresor, prohibir enajenar bienes, disponer asistencia familiar, prohibir acercamiento, restituir a la mujer al domicilio, suspender visitas y otras.",
        "¿Qué se dispone sobre la protección a niñas y niños huérfanos por feminicidio (Art. 36)?|Serán puestos de inmediato bajo custodia de abuelos u otro familiar cercano por línea materna con acompañamiento de la Defensoría de la Niñez y Adolescencia|Deben ser internados obligatoriamente en centros residenciales estatales de acogida permanente|Quedan bajo la tutela legal automática del Ministerio de Justicia sin intervención familiar|Son entregados en adopción internacional directa sin agotar instancias de parentesco|Art. 36: Serán puestos de inmediato bajo custodia de los abuelos u otro familiar cercano por línea materna, con acompañamiento de la Defensoría de la Niñez y Adolescencia.",
        "¿Cuándo se declara la Alerta contra la violencia hacia las mujeres según el Artículo 37.II?|Cuando se registre un alto índice de delitos contra la vida, libertad e integridad, o se detecte un ámbito especial que impida el ejercicio pleno de derechos|Cuando se produzca una huelga general de trabajadores en el sector salud público|Cuando los gobiernos municipales reduzcan sus presupuestos anuales de inversión social|Cuando se reporten conflictos políticos partidarios en capitales de departamento|Art. 37.II: Se emitirá cuando se registre un alto índice de delitos contra la vida y libertad, o se detecte un ámbito especial en el que se reporten casos que impidan derechos.",
        "¿Quién puede denunciar un hecho de violencia contra las mujeres según el Artículo 42.I?|La víctima o cualquier otra persona que conozca de un delito, ante la Policía Boliviana o el Ministerio Público|Únicamente la afectada directa asistida por un abogado particular titulado|Exclusivamente los familiares consanguíneos en línea directa hasta el segundo grado|Solamente las defensorías municipales de la niñez y adolescencia acreditadas|Art. 42.I: Todo hecho de violencia podrá ser denunciado por la víctima o cualquier otra persona que conozca de un delito, ante la Policía Boliviana o el Ministerio Público.",
        "¿Qué obligaciones tienen las instancias de recepción de denuncias según el Artículo 43?|Asesorar sobre preservación de pruebas, proveer información sobre derechos y servicios, solicitar atención integral y elaborar informe detallado|Cobrar tasas administrativas por formulación de actas de denuncia policial previa|Exigir a la víctima la presentación de testigos presenciales antes de admitir la denuncia|Derivar el caso a tribunales arbitrales privados de conciliación civil obligatoria|Art. 43: Asesorar sobre preservación de pruebas, proveer información sobre derechos, solicitar atención integral, elaborar informe y absolver consultas de la víctima.",
        "¿Qué garantías asegura el Estado a toda mujer en situación de violencia (Art. 45)?|Acceso a la justicia gratuita, decisiones judiciales sin sesgos de género, protección inmediata, asistencia jurídica gratuita y evitar revictimización|Exención total de pago de impuestos comerciales si posee actividades económicas privadas|Asignación de una renta mensual vitalicia financiada por el Tesoro General de la Nación|Inmunidad procesal penal absoluta en caso de cometer infracciones menores colaterales|Art. 45: Acceso a justicia gratuita, decisiones sin sesgos de género, servicios de protección inmediata, asistencia jurídica gratuita, atención con calidad y calidez, y evitar revictimización.",
        "¿Qué rol cumple el Servicio Plurinacional de Defensa a la Víctima (Sepdep) según el Artículo 49?|Apoyar a mujeres en situación de violencia carentes de recursos económicos mediante patrocinio legal gratuito y apoyo psicológico|Administrar los fondos económicos provenientes de multas judiciales impuestas a agresores|Ejercer funciones fiscales de investigación criminal en suplencia del Ministerio Público|Calificar y homologar certificados médicos forenses en capitales de departamento|Art. 49: Como institución descentralizada bajo tuición del Ministerio de Justicia, apoyará a mujeres carentes de recursos económicos mediante patrocinio legal gratuito y apoyo psicológico.",
        "¿Qué establecen los Servicios Integrados de Justicia Plurinacional (SIJPLU) según el Artículo 48?|Reciben denuncias, brindan orientación y patrocinio legal gratuito aplicando enfoque de derechos humanos a mujeres en situación de violencia|Dictan sentencias condenatorias en juicios orales por delitos de acción pública graves|Administran las Casas de Acogida y Refugio Temporal en áreas rurales y urbanas|Emiten resoluciones de declaratoria de rebeldía para imputados contumaces|Art. 48.I: Dependientes del Ministerio de Justicia, reciben denuncias y brindan orientación y patrocinio legal gratuito, aplicando enfoque de derechos humanos a mujeres en situación de violencia.",
        "¿Cómo actúa la Fuerza Especial de Lucha Contra la Violencia en caso de flagrancia (Art. 54.3)?|Socorrer a personas agredidas y dependientes aun dentro de un domicilio, sin necesidad de mandamiento ni limitación de hora y día para prestar protección|Solicitar autorización judicial por escrito con veinticuatro horas de anticipación al juez cautelar|Esperar la presencia del fiscal de materia asignado antes de ingresar a inmuebles privados|Exigir la autorización de los propietarios del domicilio para verificar agresiones físicas|Art. 54.3: En caso de flagrancia, socorrer a personas agredidas y dependientes, aun dentro de un domicilio, sin necesidad de mandamiento ni limitación de hora y día.",
        "¿Qué establece el Artículo 59 sobre la Investigación de Oficio?|La investigación se seguirá de oficio independientemente del impulso de la denunciante; toda denuncia será remitida al Ministerio Público y reportada al SIPPASE|Los fiscales pueden archivar obrados si la víctima decide abandonar el proceso penal|Se requiere querella formal por escrito con firmas legalizadas para iniciar investigación fiscal|La investigación penal prescribe a los treinta días si no hay acusación particular de parte|Art. 59.I: La investigación se seguirá de oficio, independientemente del impulso de la denunciante. Toda denuncia será obligatoriamente remitida al Ministerio Público y reportada al SIPPASE.",
        "¿Qué medidas debe adoptar el Ministerio Público en la investigación de delitos de violencia (Art. 61)?|Adoptar medidas de protección, recolección de pruebas sin someter a la mujer a interrogatorios o peritajes innecesarios, y recurrir a investigación científica|Exigir a la víctima la contratación de peritos técnicos privados particulares a su costo|Suspender los plazos de la etapa preparatoria hasta que el agresor preste su declaración informativa|Ordenar la detención preventiva obligatoria en todos los delitos sin excepción legal|Art. 61.1 y 2: Adoptar medidas de protección y recolección de pruebas necesarias sin someter a la mujer a pruebas, interrogatorios o peritajes no imprescindibles.",
        "¿Qué especialidad deben tener los médicos forenses designados para la atención de mujeres (Art. 64)?|Especialidad en violencia de género, atendiendo con respeto, cuidado, calidez y comprensión, evitando revisiones reiteradas e innecesarias|Especialidad en medicina legal mercantil y tasación de daños patrimoniales civiles|Conocimientos exclusivos en traumatología deportiva y medicina forense general de varones|Especialidad en psiquiatría forense penitenciaria de reclusos de máxima seguridad|Art. 64: Se designarán médicos forenses con especialidad en violencia de género, quienes atenderán con respeto, cuidado y calidez, evitando revisiones reiteradas e innecesarias.",
        "¿Qué Juzgados se modifican e incorporan en la Ley del Órgano Judicial mediante el Artículo 68 de la Ley Nº 348?|Juzgados de Instrucción en Materia contra la Violencia hacia las Mujeres, Juzgados de Sentencia y Tribunales de Sentencia especializados|Juzgados de Partido en lo Civil y Comercial y Juzgados de Minería e Hidrocarburos|Tribunales Departamentales de Justicia en materia administrativa y coactiva fiscal|Juzgados de Paz Letrados cantonales y tribunales de arbitraje mercantil privado|Art. 68: Modifica la Ley del Órgano Judicial creando Juzgados de Instrucción de Materia contra la Violencia, Juzgados de Sentencia y Tribunales de Sentencia en la materia.",
        "¿Qué requisitos se exigen para ser juez o jueza en juzgados de materia contra la violencia (Art. 69)?|Especialidad en materia penal y conocimientos de género o derechos humanos, y certificado de suficiencia de aptitud psicotécnica expedido por el Consejo de la Magistratura|Experiencia laboral exclusiva en gerencia administrativa financiera de empresas comerciales|Haber ejercido como notario de fe pública o registrador de derechos reales por diez años|Título profesional universitario en administración de empresas y auditoría financiera|Art. 69: Especialidad en materia penal y conocimientos de género o derechos humanos, y certificado de suficiencia expedido por el Consejo de la Magistratura de aptitud psicotécnica.",
        "¿Qué efectos produce la aplicación de sanciones alternativas según el Artículo 76?|En delitos con pena no mayor a 3 años y autor no reincidente, se pueden aplicar sanciones alternativas (multa, fin de semana, trabajos comunitarios) junto a medidas de seguridad|Sustituyen definitivamente la obligación de reparar el daño civil a favor de la víctima|Eximen al condenado del cumplimiento de las órdenes e instrucciones judiciales de conducta|Otorgan libertad condicional automática sin necesidad de cumplir el tiempo de pena principal|Art. 76.I y II: Siempre que el autor no sea reincidente y la pena no sea mayor a tres años, se remplazará por sanción alternativa; la autoridad aplicará medidas para proteger a la mujer.",
        "¿Cómo se define y aplica la Detención de Fin de Semana (Art. 78)?|Limitación de libertad que se aplica desde el día viernes a horas 19:00 hasta el lunes a horas 6:00 (un día de privación equivale a un día de detención de fin de semana)|Reclusión nocturna diaria obligatoria de lunes a viernes desde las 20:00 hasta las 06:00 horas|Arresto domiciliario total durante los días sábados y domingos bajo vigilancia policial estricta|Trabajo obligatorio en dependencias municipales durante los días feriados nacionales|Art. 78: Limitación de la libertad que se aplica desde el día viernes a horas 19:00 hasta el día lunes a horas 6:00. Un día de privación corresponde a un día de detención de fin de semana.",
        "¿Qué alcances tiene la Inhabilitación como sanción en delitos de violencia (Art. 81)?|Para quienes ejerzan profesiones u ocupaciones relacionadas con educación, salud, cuidado de personas, consejería, con límite temporal de hasta 12 años (rehabilitación tras la mitad o mínimo 5 años)|Prohibición vitalicia y perpetua para ejercer cualquier actividad comercial o industrial en el país|Pérdida temporal de la nacionalidad boliviana y de los derechos políticos electorales generales|Confiscación definitiva de todos los bienes inmuebles propios inscriptos en Derechos Reales|Art. 81: Cuando quien fuera sancionado ejerza profesión u ocupación relacionada con educación, cuidado, salud, consejería, con límite temporal de 12 años; rehabilitación tras mitad de plazo o mínimo 5 años.",
        "¿Qué instrucciones o plan de conducta puede imponer la autoridad judicial al condenado con sanciones alternativas (Art. 82)?|Prohibición de portar armas, abstenerse de consumir alcohol o drogas, prohibir concurrir a lenocinios, incorporarse a programas de modificación de conducta u oficios|Obligación de residir obligatoriamente en un departamento diferente al de la víctima|Pago mensual de una asignación dineraria compensatoria al Ministerio de Justicia|Presentación personal semanal ante la FELCV los días lunes por la mañana|Art. 82: Prohibición de portar armas, abstenerse de alcohol y drogas, concurrir a lenocinios, incorporarse a programas para modificar comportamientos o aprender un oficio."
    ]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>
    <script src="../leer.js"></script>
