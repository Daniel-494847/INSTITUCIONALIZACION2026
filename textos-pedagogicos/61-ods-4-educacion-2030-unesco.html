        "193. ¿Cómo se clasifican las faltas disciplinarias del personal docente y administrativo en el marco del Escalafón y reglamentos internos?|En faltas leves, graves y gravísimas, sujetas a proceso administrativo interno y plazos de descargo|Únicamente en amonestaciones verbales sin registro escrito|En multas monetarias directas descontadas por los directores de colegio|En despidos voluntarios automáticos sin derecho a defensa|El régimen disciplinario clasifica las faltas y establece procesos administrativos formales con derecho a defensa.",
        "194. ¿Qué efecto legal produce una sanción ejecutoriada de destitución en el marco del Reglamento del Escalafón Nacional?|La inhabilitación definitiva para el ejercicio de la docencia y funciones administrativas en el Sistema Educativo Plurinacional|El traslado inmediato a otro departamento con ascenso de categoría|La jubilación voluntaria anticipada con goce de haberes íntegros|La conmutación de la pena mediante el pago de una fianza comercial|La destitución ejecutoriada inhabilita definitivamente al infractor para ejercer en el sistema educativo.",
        "195. ¿Qué principios fundamentales orientan la Ley N.º 070 'Avelino Siñani - Elizardo Pérez' en el sistema educativo boliviano?|Descolonizadora, despatriarcalizadora, comunitaria, productiva, intracultural, intercultural y plurilingüe|Capitalista, mercantil, individualista y unilingüe|Privada, excluyente, centralizada y de élite corporativa|Selectiva basada exclusivamente en rendimiento industrial|La Ley 070 establece los principios de descolonización, comunitaria, productiva, intracultural e intercultural.",
        "196. ¿Qué se establece sobre la obligatoriedad de la lengua originaria en la formación docente y el ejercicio profesional?|Constituye un requisito fundamental en el marco del carácter plurilingüe e intracultural del modelo educativo plurinacional|Es una actividad opcional sin valor curricular ni escalafonario|Está prohibida en las unidades educativas de capitales de departamento|Se restringe únicamente a institutos de investigación lingüística|El manejo de la lengua originaria es parte fundamental del modelo sociocomunitario productivo y la formación docente.",
        "197. ¿Cuál es el propósito de los consejos educativos comunitarios sectoriales (pueblos indígena originario campesinos)?|Participar en la gestión social, planificación, seguimiento y control de la educación en corresponsabilidad con el Estado|Recaudar impuestos prediales urbanos para los municipios|Administrar las cuentas bancarias personales de los directores|Impartir clases magistrales de física cuántica en secundaria|Los consejos educativos comunitarios participan en la gestión social y control comunitario de la educación.",
        "198. ¿Qué se estipula respecto a la evaluación cualitativa y cuantitativa del rendimiento escolar de los estudiantes?|Que es un proceso continuo, integral y comunitario que valora tanto los saberes y conocimientos como los valores sociocomunitarios|Que se reduce a un solo examen de opción múltiple al final de año|Que es totalmente subjetiva y queda a criterio arbitrario del profesor|Que no requiere registro oficial en libretas electrónicas|La evaluación en el modelo educativo es un proceso continuo, integral, cualitativo y cuantitativo.",
        "199. ¿Qué establece la normativa sobre la prohibición de retención de libretas escolares o documentos por deudas económicas en colegios privados?|Está terminantemente prohibido retener documentos académicos por retrasos en el pago de pensiones escolares, debiendo recurrirse a otras vías legales|Los colegios privados pueden retener libretas hasta el pago total de la gestión|Los directores pueden confinar a los alumnos deudores fuera del aula|La retención de documentos es un derecho comercial plenamente válido|La retención de documentos por pensiones en colegios privados está prohibida por vulnerar el derecho a la educación.",
        "200. ¿Cuál es la finalidad última de la normativa y las directrices de gestión educativa anual en el Estado Plurinacional de Bolivia?|Garantizar una educación de calidad, inclusiva, descolonizadora y con equidad para la consolidación del Sistema Educativo Plurinacional|Incrementar las utilidades comerciales de las instituciones privadas|Centralizar el control burocrático sin participación de la comunidad|Reducir la cobertura escolar en las regiones rurales y de frontera|Las normas de gestión buscan garantizar una educación de calidad, inclusiva y descolonizadora para todo el país."
    ]};
    const app=document.getElementById("app");
    let st={};
    const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    function start(){
        const qs=(DOC.orden?DOC.q.slice():shuf(DOC.q)).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();
    }
    function show(){
        const q=st.qs[st.n];
        app.innerHTML='<div class="progress mb-4" role="progressbar" aria-label="Avance" aria-valuenow="'+st.n+'" aria-valuemin="0" aria-valuemax="'+st.qs.length+'" style="height:8px"><div class="progress-bar" style="width:'+(st.n/st.qs.length*100)+'%"></div></div>'+
        '<div class="card shadow-sm"><div class="card-body p-4">'+
        '<div class="text-uppercase text-body-secondary fw-semibold mb-2" style="font-size:.75rem;letter-spacing:.05em">Pregunta '+(st.n+1)+' de '+st.qs.length+'</div>'+
        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';
        const o=document.getElementById("o");
        q.o.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="btn btn-outline-secondary text-start";b.textContent=t;b.onclick=()=>answer(b,t,q);o.appendChild(b)});
    }
    function answer(b,t,q){
        [...document.querySelectorAll("#o .btn")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.className="btn btn-success text-start"});
        if(t===q.c)st.ok++;else b.className="btn btn-danger text-start";
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="card shadow-sm"><div class="card-body p-4 text-center"><h2 class="h4 mb-3">Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p class="text-body-secondary">'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button type="button" class="btn btn-primary me-2" onclick="start()">Reintentar</button><a class="btn btn-outline-secondary" href="../index.html">Volver al Panel</a></div></div>';
    }
    start();
    </script>
    <script src="../leer.js"></script>
</body>
