    const DOC={"i":"🎓","f":"62-lidei-2022-liderazgo-directivo-oei","n":"LIDEI 2022 — Liderazgo Directivo en Iberoamérica, OEI","d":"Liderazgo Directivo en Iberoamérica","q":[
        "1. ¿Qué organizaciones elaboraron el informe LIDEI 2022 sobre Liderazgo Directivo en Iberoamérica?|La OEI y el INEE del Ministerio de Educación y Formación Profesional de España.|La UNESCO y el Banco Mundial exclusivamente.|La OCDE y la Comisión Europea.|El Fondo Monetario Internacional y la UNICEF.|El estudio fue elaborado bajo la supervisión de la OEI y del INEE de España.",
        "2. Según Fullan (2016), ¿cuáles son los tres rasgos o cualidades clave que el ejercicio del liderazgo exige en la era digital?|Disciplina fanática, aprender de los buenos datos y paranoia productiva.|Rigidez burocrática, control centralizado y jerarquía estricta.|Aislamiento institucional, memorización y enseñanza tradicional.|Competencia mercantil, privatización y selección de élites.|Fullan señala la disciplina fanática, aprender de los buenos datos y la paranoia productiva.",
        "3. ¿Cuántos indicadores principales identifica la OEI (2017) para caracterizar un liderazgo activo, integrado y contextualizado?|Seis indicadores principales.|Diez indicadores estrictamente financieros.|Tres indicadores de carácter militar.|Doce indicadores de control burocrático.|La OEI identifica seis indicadores principales para un liderazgo activo, integrado y contextualizado.",
        "4. ¿Cómo define Uribe (2005), citado en el estudio de la OEI (2020), el concepto de liderazgo?|Un conjunto de actitudes, conocimientos, habilidades y competencias que permiten cumplir responsabilidades, resolver conflictos y gestionar innovaciones.|Un cargo de autoridad suprema exento de rendición de cuentas.|Una función estrictamente contable y de cobro de matrículas.|Un título honorífico sin implicaciones en la gestión escolar.|El liderazgo engloba actitudes, conocimientos y competencias para gestionar innovaciones y resolver conflictos.",
        "5. ¿Qué modelo de liderazgo propone la OEI basándose en los principios de inclusión, interculturalidad, responsabilidad y sostenibilidad (UN, 2015)?|Modelo de liderazgo pedagógico, inclusivo y distribuido.|Modelo de liderazgo autoritario y centralizado.|Modelo de gestión mercantil y competitiva.|Modelo de administración burocrática clásica.|Se propone el modelo de liderazgo pedagógico, inclusivo y distribuido.",
        "6. ¿Cómo define Spillane (2006) el concepto de liderazgo distribuido?|Actividades y dinámicas educativas desarrolladas en el centro que son diseñadas de manera compartida por los miembros de la comunidad.|La concentración absoluta de decisiones en la figura unipersonal del director.|La delegación de tareas administrativas en personal externo pagado.|La división de los estudiantes en grupos según su nivel socioeconómico.|El liderazgo distribuido se refiere a actividades diseñadas de manera compartida por los miembros de la comunidad.",
        "7. ¿Qué dos teorías del cambio se identifican en el análisis de las políticas educativas según Lessard y Carpentier (2016)?|Teoría normativa del cambio (centralizada/determinista) y teoría comprensiva del cambio (complejidad y construcción de significados).|Teoría económica del libre mercado y teoría industrial de producción.|Teoría de selección de élites y teoría de exclusión rural.|Teoría de la privatización total y teoría del funcionariado vitalicio.|Se distinguen la teoría normativa del cambio y la teoría comprensiva del cambio.",
        "8. ¿Cuáles son las tres fases interconectadas que abarca el proceso de innovación según Pacheco (2019) y Fullan (2015)?|Cambio externo, cambio interno y personalización del cambio.|Planificación teórica, ejecución militar y auditoría financiera.|Selección de alumnos, evaluación estandarizada y cierre de centros.|Recaudación de fondos, compra de equipos y matriculación masiva.|La innovación abarca cambio externo, cambio interno y personalización del cambio.",
        "9. ¿Qué tres factores intervienen en el desarrollo de la cultura del aprendizaje escolar?|El profesorado en su desarrollo profesional, el alumnado en su formación y la escuela a través de la autoevaluación institucional.|El ministerio de hacienda, los sindicatos y las cámaras de comercio.|Los inspectores de policía, los alcaldes y los padres de familia.|Las empresas privadas, las editoriales y los bancos acreedores.|Intervienen el profesorado, el alumnado y la escuela mediante procesos de autoevaluación institucional.",
        "10. Según Stufflebeam (2003), ¿cuáles son las cuatro variables interdependientes consideradas en la evaluación orientada a la toma de decisiones?|Contexto, insumos, proceso y resultados.|Presupuesto, salarios, matrícula y sindicatos.|Infraestructura, mobiliario, textos y tecnología.|Leyes, decretos, circulares y sanciones.|Las cuatro variables interdependientes son contexto, insumos, proceso y resultados.",
        "11. En el estudio de casos de Chile, ¿qué figura técnica apoya la labor docente y tiene un rol fundamental en el liderazgo educativo?|El Jefe o Jefa Técnico.|El inspector general de finanzas.|El auditor contable externo.|El asesor jurídico municipal.|Se destaca la figura del Jefe o Jefa Técnico que apoya la labor docente.",
        "12. ¿Qué documento marco en Chile establece las directrices sobre las competencias directivas agrupadas en cinco dimensiones?|El Marco para la Buena Dirección y el Liderazgo Escolar.|El Estatuto Docente General de la República.|La Ley de Presupuestos del Sector Público.|El Reglamento de Convivencia Comunal.|Es el Marco para la Buena Dirección y el Liderazgo Escolar.",
        "13. ¿Cuáles son las cinco dimensiones prácticas que incluye el Marco para la Buena Dirección y el Liderazgo Escolar en Chile?|Visión estratégica, capacidades profesionales, procesos de enseñanza-aprendizaje, convivencia/participación y gestión del establecimiento.|Contabilidad, auditoría, compras públicas, recursos humanos y marketing.|Disciplina, sanciones, vigilancia, control horario y archivo.|Relaciones internacionales, comercio, aduanas, finanzas y diplomacia.|Las dimensiones abarcan visión estratégica, capacidades profesionales, enseñanza-aprendizaje, convivencia y gestión del establecimiento.",
        "14. En Portugal, ¿en qué marco normativo fundamental se sustenta el modelo de gestión democrática de las escuelas públicas?|La Ley Básica del Sistema Educativo (LBSE, 1986) y el Decreto-Lei n.º 75/2008.|Los estatutos de corporaciones mercantiles privadas.|Las ordenanzas de los gobiernos municipales locales.|Los convenios colectivos de la industria pesada.|El modelo se fundamenta en la LBSE (1986) y el Decreto-Lei n.º 75/2008.",
        "15. En el modelo de evaluación externa de escuelas en Portugal, ¿qué dominios se evalúan conjuntamente?|Liderazgo y Gestión, Autoevaluación, Prestación de Servicios y Resultados.|Contabilidad, Tesorería, Inventario y Ventas.|Infraestructura, Mobiliario, Limpieza y Jardinería.|Seguridad, Tránsito, Sanidad y Obras Públicas.|Los dominios son Liderazgo y Gestión, Autoevaluación, Prestación de Servicios y Resultados.",
        "16. Al comparar los casos de Brasil y España analizados por Batista y Pereyra (2020), ¿qué principio se identifica como denominador común de la gestión escolar?|La gestión democrática orientada a la justicia social, inclusión y equidad.|La privatización absoluta de los servicios educativos.|La centralización militar de los centros de enseñanza.|La supresión de la participación de las familias.|El denominador común es la gestión democrática orientada a la justicia social y equidad.",
        "17. ¿Qué nueva ley educativa en España modifica la LOE (2006) y reestablece el equilibrio en la atribución de competencias entre dirección y Consejo Escolar?|La Ley Orgánica LOMLOE (2020).|La Ley de Reforma Financiera de 2012.|El Estatuto de la Función Pública de 1990.|La Ley General de Universidades de 2001.|La ley LOMLOE (2020) modifica la LOE y refuerza el modelo democrático-participativo.",
        "18. ¿Cómo se estructuró la encuesta aplicada en el informe LIDEI 2022 para conocer la realidad de los directores en Iberoamérica?|En secciones que abarcan variables personales, contexto, acceso, responsabilidades, autonomía, liderazgo distribuido, emergencia COVID-19 y atractivo profesional.|Únicamente en preguntas de carácter estrictamente financiero y contable.|En un cuestionario físico de opción binaria sin dimensiones conceptuales.|En una auditoría penal de antecedentes de los profesores.|El cuestionario se divide en secciones que cubren perfil, contexto, responsabilidades, autonomía, liderazgo, pandemia y atractivo profesional.",
        "19. ¿Cuántos directores y directoras participaron en total en la muestra del estudio piloto del informe LIDEI 2022 (Argentina, Chile y España)?|77 directores y directoras.|Exactamente 1.000 directores.|15 directores en total.|Más de 5.000 directivos.|Participaron un total de 77 directores y directoras en la muestra piloto.",
        "20. Según los datos del estudio piloto, ¿cuántas horas de trabajo semanales declaran dedicar en promedio los directores en los tres países?|Entre 40 y 42 horas a la semana (Argentina: 40,2; Chile: 42,1; España: 42).|Exactamente 20 horas semanales.|Más de 80 horas de trabajo continuo.|Menos de 15 horas a la semana.|Los directores declaran dedicar en promedio entre 40 y 42 horas semanales a su labor.",
        "21. ¿Cuáles son las tareas que requieren mayor porcentaje de tiempo según las respuestas de los directores encuestados?|La gestión administrativa, el liderazgo pedagógico y otro tipo de tareas generales.|La docencia directa obligatoria en el aula.|La organización de eventos deportivos y festivos.|Las labores exclusivas de mantenimiento e higiene.|Las tareas que consumen más tiempo son la gestión administrativa y el liderazgo pedagógico.",
        "22. En cuanto al acceso a la función directiva, ¿qué aspecto se destaca como el más valorado en el proceso de selección en España?|El proyecto de dirección presentado por el candidato o candidata.|La afiliación a partidos políticos.|La designación directa y secreta ministerial.|Un sorteo al azar entre la planta docente.|En España el aspecto más valorado en el acceso es el proyecto de dirección.",
        "23. ¿Qué porcentaje de directores en la muestra piloto de Argentina, Chile y España afirma que existe un proceso regulado para acceder al cargo?|El 100% de los directores de los tres países afirman que existe un proceso regulado.|Menos del 10% en todos los casos.|Únicamente en Chile existe regulación formal.|Ningún país cuenta con procesos regulados.|Todos los directores de los tres países afirman que existe un proceso regulado para el acceso.",
        "24. ¿Qué porcentaje de directores en la muestra piloto declara haber sido nombrado de forma forzosa por la administración?|Un porcentaje de entre el 8% y el 14% según el país.|Exactamente el 50% en los tres países.|El 0% absoluto.|Más del 90% de los directivos.|Entre el 8% y el 14% de los directores fueron nombrados de forma forzosa.",
        "25. A juicio de los directores encuestados, ¿cómo valoran la adecuación de los programas de formación al modelo de liderazgo pedagógico, inclusivo y distribuido?|Más del 50% de los directores de Argentina (54%), Chile (67%) y España (53%) están de acuerdo o totalmente de acuerdo.|El 0% considera que los programas son adecuados.|Todos los directores expresan total desacuerdo.|Únicamente los docentes noveles rechazan la formación.|Más de la mitad de los directores en los tres países considera que los programas se ajustan al modelo.",
        "26. ¿Qué opinan los directores sobre si su formación está diferenciada según la experiencia en el ejercicio de la función directiva?|Consideran mayoritariamente que la formación no está diferenciada (Argentina: 70%; España: 72%; Chile: 47%).|Afirman que está altamente diferenciada en diez niveles distintos.|Sostienen que solo se capacita a los directores con más de veinte años de experiencia.|Desconocen por completo los planes formativos.|La gran mayoría opina que la formación recibida no está diferenciada según la experiencia.",
        "27. ¿Qué porcentaje de directores en Argentina, Chile y España declara no haber recibido formación de actualización tras ser nombrados?|El 50% en Argentina, el 33% en Chile y el 25% en España.|El 0% en los tres países.|El 100% absoluto en toda la región.|Menos del 2% en Europa.|Una proporción importante declara no haber recibido formación tras su nombramiento (50% en Argentina, 33% en Chile, 25% en España).",
        "28. ¿Qué opinan los directores respecto a la equidad de sus salarios en comparación con otros puestos de nivel de responsabilidad similar?|Consideran unánimemente que sus salarios no son acordes ni equiparables al nivel de responsabilidad asumido.|Afirman que perciben sueldos excesivamente elevados superiores a los ministros.|Manifiestan absoluta satisfacción económica sin ninguna queja.|Indican que ganan el doble que los ingenieros industriales.|Existe una demanda unánime de que la remuneración sea más adecuada al grado de responsabilidad.",
        "29. En cuanto a la evaluación del desempeño, ¿qué factor es el más utilizado y valorado por los directores en los tres países?|La consecución de objetivos del Plan de Centro Anual o del proyecto de dirección.|La cantidad de multas y sanciones disciplinarias impuestas.|El volumen de recaudación de fondos privados.|La cantidad de horas de ausencia laboral del personal.|El factor más evaluado es la consecución de objetivos del Plan de Centro Anual.",
        "30. Respecto a la autonomía para la selección y renovación de la plantilla docente, ¿qué situación reportan los directores?|Es la tarea para la que menor autonomía perciben (especialmente en España y Argentina, con algo más de margen en Chile).|Poseen autonomía total e ilimitada para despedir y contratar sin restricciones.|Tienen la competencia exclusiva de asignar plazas ministeriales de gabinete.|No existe ninguna norma que regule al personal docente.|La selección y renovación de plantilla es donde reportan menor nivel de autonomía.",
        "31. ¿Qué porcentaje de directores españoles e hispanoamericanos señala que las acciones de la dirección están mediatizadas por la administración?|Alrededor del 80% al 92% (Argentina: 88%; Chile: 80%; España: 92%).|Menos del 5% en toda la muestra.|Exactamente el 10% en los tres países.|Ningún director se siente influenciado por la administración.|La gran mayoría coincide en que sus acciones están mediatizadas por lo impuesto desde la administración educativa.",
        "32. ¿Qué obstáculo administrativo señalan los directores como debilitamiento crítico de su autonomía de decisión?|La complejidad y la larga duración de los procesos administrativos (Argentina: 96%; Chile: 87%; España: 74%).|La escasez absoluta de energía eléctrica en las ciudades.|La prohibición de utilizar herramientas digitales y computadoras.|La inexistencia de leyes escritas en los ministerios.|La complejidad y duración de los procesos administrativos debilitan fuertemente la autonomía directiva.",
        "33. Respecto al liderazgo distribuido en centros de más de 100 alumnos, ¿qué declaran hacer los directores encuestados?|Que permiten y propician la distribución del liderazgo, considerando opiniones de órganos de participación y creando espacios de diálogo.|Concentrar todas las decisiones de aula en su persona sin consultar a nadie.|Prohibir reuniones de profesores y asociaciones de padres.|Delegar el 100% de las funciones legales en empresas privadas externas.|Prácticamente la totalidad de los directores declara propiciar la distribución del liderazgo y espacios de diálogo.",
        "34. ¿Qué porcentaje de directores en la muestra afirma que, a pesar de los obstáculos y demandas, volvería a ser director o directora?|Argentina: 92%; Chile: 100%; España: 81%.|Menos del 10% en todos los países.|Exactamente el 0% por arrepentimiento general.|Únicamente el 20% en las zonas urbanas.|Pese a las dificultades, una amplísima mayoría de directores repetiría en el cargo (92% en Argentina, 100% en Chile, 81% en España).",
        "35. Ante la emergencia de la pandemia de COVID-19, ¿cuál señalan los directores que fue el cambio esencial en el funcionamiento escolar?|La implantación del aprendizaje a distancia mediante el uso masivo de tecnologías digitales (España: 94%; Chile: 87%; Argentina: 85%).|La suspensión definitiva de cualquier actividad pedagógica por diez años.|La transformación de las escuelas en centros comerciales de abasto.|El reemplazo de los docentes por sistemas robóticos autónomos.|El gran cambio operativo fue el paso al aprendizaje a distancia mediante tecnologías digitales.",
        "36. ¿Cómo valoraron los directores la adaptación inicial del profesorado a los cambios de enseñanza digital durante la pandemia?|El 89% de los directores en España consideró la adaptación sencilla, frente al 60% en Argentina y Chile.|Todos los profesores se negaron rotundamente a utilizar dispositivos.|El 100% de los docentes renunció en la primera semana.|Ningún país registró clases a distancia.|En España el 89% vio la adaptación sencilla, mientras que en Argentina y Chile alcanzó al 60% de los directores.",
        "37. ¿Qué consecuencias negativas principales destacó el informe respecto al cierre presencial de los centros educativos por la pandemia?|El aumento de la carga burocrática docente y el incremento de las desigualdades de aprendizaje entre estudiantes.|El superávit financiero incontrolable en los presupuestos escolares.|La reducción drástica de las horas semanales de estudio a solo dos minutos.|La desaparición total de los libros impresos en el mundo.|Se destacó el aumento del trabajo burocrático y el agravamiento de las desigualdades de aprendizaje.",
        "38. ¿Qué aspecto socioemocional prioritario señalaron los directores como más importante que la enseñanza de contenidos tras la reapertura?|El acompañamiento emocional de los estudiantes (Argentina: 85%; Chile: 80%; España: 63%).|La aplicación de exámenes de reprobación masiva.|La exigencia de rendimiento competitivo en pruebas estandarizadas.|La supresión de actividades recreativas y artísticas.|Los directores señalaron que el acompañamiento emocional era más importante que la transmisión de contenidos.",
        "39. ¿Cuáles son las demandas principales identificadas por los directores para desarrollar un liderazgo pedagógico, inclusivo y distribuido?|Programas de formación en liderazgo, autonomía en recursos humanos, tiempos para el trabajo colaborativo e incentivos económicos acordes.|Supresión de inspectores, eliminación de presupuestos y cierre de secretarías.|Aumento de exámenes escritos y reducción de vacaciones docentes.|Privatización de la gestión escolar y aranceles a las familias.|Las demandas principales son formación en liderazgo, autonomía en recursos humanos, tiempos colaborativos e incentivos profesionales.",
        "40. Según las conclusiones del informe LIDEI 2022, ¿qué se requiere de las administraciones educativas hacia la figura del director?|Valorar y acompañar su trabajo, depositar confianza, cubrir sus necesidades y reconocer su contribución en el desarrollo profesional.|Ejercer control punitivo estricto sin derecho a apelación ni diálogo.|Reducir sus atribuciones normativas a cero nivel de decisión.|Reemplazar la dirección unipersonal por juntas militares.|Es necesario valorar y acompañar su trabajo, depositar confianza y cubrir sus necesidades profesionales.",
        "41. ¿Qué porcentaje aproximado de la muestra de directores en Argentina declaró tener entre 3 y 5 años de experiencia en el puesto?|El 38% de los directores en Argentina.|Exactamente el 90%.|El 0% absoluto.|El 5% de los encuestados.|La experiencia que más se repite en Argentina está entre 3 y 5 años (38%).",
        "42. ¿Qué intervalo de experiencia docente previa es el que más se repite entre los directores encuestados en Argentina?|El intervalo de 16 a 20 años de experiencia docente (35%).|Menos de un año de enseñanza.|Exactamente 40 años.|Ninguna experiencia previa.|El intervalo docente más repetido en Argentina es de 16 a 20 años.",
        "43. ¿Cómo se distribuye la titularidad de los centros de los directores encuestados en Argentina según el estudio LIDEI 2022?|Provienen de centros privados y públicos al 50%.|El 100% pertenecen a colegios privados católicos.|El 99% son de gestión estatal exclusiva.|Únicamente escuelas rurales comunitarias.|En Argentina los centros de la muestra provienen de entidades públicas y privadas al 50%.",
        "44. ¿Qué porcentaje de directores encuestados en Chile ejercen su función en centros de titularidad pública?|El 80% de los directores encuestados ejercen en centros públicos.|Exactamente el 10% del total.|El 50% de gestión mixta.|Ningún director de la muestra chilena es público.|El 80% de los directores chilenos encuestados pertenecen al sector público.",
        "45. ¿Qué proporción de directores en España encuestados pertenecen a la red de centros públicos?|Nueve de cada diez directores pertenecen a centros públicos (aprox. 90%).|El 20% de gestión estatal.|El 100% privado concertado.|Cero escuelas públicas.|Uno de cada diez pertenece a centros privados y el resto (90%) a centros públicos.",
        "46. ¿Qué porcentaje de directores en Argentina pertenece a centros situados en entornos rurales?|El 15% de los directores pertenecen a centros rurales.|El 80% en zonas agrícolas.|El 0% absoluto.|Exactamente la mitad de la muestra.|El 15% de los directores encuestados en Argentina labora en centros rurales.",
        "47. ¿Qué porcentaje de directores en Chile corresponde a centros situados en zonas rurales?|El 7% de los directores encuestados.|El 60% de las escuelas.|El 50% en zonas insulares.|Cero por ciento.|El 7% de la muestra chilena corresponde a centros rurales.",
        "48. ¿Qué porcentaje de directores en España pertenece a centros situados en localidades de menos de 3.000 habitantes?|El 11% de los directores.|El 75% en municipios pequeños.|El 0% en todo el territorio.|Exactamente el 50%.|El 11% de los directores en España pertenece a centros en localidades de menos de 3.000 habitantes.",
        "49. ¿Qué tamaño de centro (número de alumnos) predomina entre los directores encuestados en Argentina?|La mitad (50%) pertenece a centros que tienen entre 100 y 500 estudiantes.|Centros masivos de más de 5.000 alumnos.|Unidades con menos de 10 alumnos obligatorios.|Escuelas sin matrícula registrada.|El 50% de los directores argentinos en la muestra dirige centros de entre 100 y 500 estudiantes.",
        "50. ¿Qué ratio promedio de estudiantes por profesor presenta Chile según el análisis del estudio piloto?|La ratio más elevada con 14,9 estudiantes por profesor.|Una ratio mínima de 2 alumnos por docente.|Exactamente 50 alumnos por profesor.|Un promedio de 5 estudiantes por aula.|Chile presenta la ratio más alta con 14,9 estudiantes por cada profesor.",
        "51. ¿Qué valor promedio de ratio estudiantes por profesor presenta España en la muestra analizada?|10,1 estudiantes por profesor.|25 estudiantes por profesor.|3 alumnos por docente.|40 estudiantes por profesor.|España ofrece un valor medio de 10,1 estudiantes por profesor.",
        "52. ¿Qué valor promedio de ratio estudiantes por profesor registra Argentina en el estudio piloto?|Un valor medio de 7,6 estudiantes por profesor.|30 estudiantes por profesor.|15 alumnos por docente.|50 estudiantes por profesor.|Argentina ofrece un valor medio de 7,6 estudiantes por profesor.",
        "53. ¿En qué rango de tamaño de centro se registran las mayores ratios de alumnos por profesor en los tres países?|En los centros que tienen entre 1.000 y 2.000 alumnos.|En los centros pequeños de menos de 50 alumnos.|En escuelas rurales unipersonales.|En institutos nocturnos sin matrícula.|Las mayores ratios se alcanzan en los centros de entre 1.000 y 2.000 alumnos.",

        '<h2 class="h5 fw-semibold mb-3">'+q.t+'</h2>'+
        '<div id="o" class="d-grid gap-2"></div><div id="f"></div></div></div>';

    }

        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<div class="alert alert-secondary mt-3 mb-0"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</div>':'')+'<button type="button" class="btn btn-primary mt-3" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
