        "45. ¿Qué ilustra el modelo del “Proyecto de Liderazgo de Educación Nacional (PELP)” (Childress et al.) en relación con el núcleo pedagógico?|Que todas las capas del sistema (central, intermedio y micro) deben alinear sus esfuerzos para impactar directamente en la relación entre estudiantes, docentes y contenidos.|Que la administración financiera es más importante que la enseñanza en el aula.|Que los profesores deben trabajar aislados de la dirección del colegio.|Que las decisiones escolares deben tomarse sin considerar los objetivos de aprendizaje.|El núcleo pedagógico (estudiante, docente, contenido) es el centro absoluto al cual deben tributar de forma coherente los distintos niveles del sistema.",
        "46. ¿Cómo se define la gobernanza del sistema educativo según la OCDE y el documento?|La forma en que se distribuyen las decisiones, responsabilidades y los espacios de comunicación entre la institucionalidad pública y la comunidad.|El control absoluto de los ministerios de hacienda sobre las notas de los alumnos.|Un sistema de castigos para los colegios con bajo rendimiento.|La privatización de la gestión escolar en manos de corporaciones extranjeras.|La gobernanza alude a cómo se distribuye el poder de decisión y cómo interactúan las políticas públicas con las necesidades territoriales.",
        "47. ¿Cuáles son los cinco factores estratégicos clave que orientan la acción de los equipos de nivel intermedio según la evidencia?|Liderazgo con foco en aprendizajes integrales, equilibrio control/autonomía, relación colaborativa/confianza, coordinación institucional y uso eficiente de recursos.|Recorte presupuestario, auditoría externa, licitaciones privadas, despidos masivos y centralización.|Competencia feroz entre escuelas, eliminación de feriados, pruebas diarias y repitencia obligatoria.|Autonomía absoluta sin rendición de cuentas ante nadie.|La literatura sintetiza estos cinco factores como pilares para que el nivel intermedio consolide la mejora escolar sostenible.",
        "48. ¿Cuáles son las tres condiciones de base imprescindibles para que la gestión y el liderazgo intermedio funcionen adecuadamente?|Roles claros y definidos, capacidades profesionales adecuadas y un financiamiento oportuno y suficiente.|Edificios inteligentes, transporte escolar gratuito y comedores gourmet.|Libertad de horario para los funcionarios y cero fiscalización.|Dependencia exclusiva de fondos internacionales de caridad.|Sin claridad de roles, equipos competentes y recursos financieros oportunos, la gestión intermedia colapsa operativamente.",
        "49. ¿Cuáles son los cuatro ámbitos principales en los que se espera que la gestión y el liderazgo intermedio produzcan un impacto medible?|Valor social de la educación pública, resultados de aprendizaje, equidad/distribución y eficacia/eficiencia interna de la gestión.|Aumento de matrícula en colegios particulares pagados y reducción del gasto fiscal.|Cantidad de sumarios administrativos cursados y juicios laborales ganados.|Cantidad de horas extra trabajadas por los asistentes de la educación.|Los logros esperados abarcan tanto el valor social y los aprendizajes cognitivos/socioemocionales como la equidad y la eficiencia interna.",
        "50. ¿Qué implica el principio de “Visión estratégica” como práctica efectiva de nivel intermedio?|Construir y movilizar una visión compartida en el territorio con un sentido ambicioso del educando a formar y alta eficacia colectiva.|Modificar la visión de la escuela cada mes según el humor de la comunidad.|Reducir las expectativas de aprendizaje para evitar la frustración del estudiantado.|Delegar la planificación estratégica en agencias de publicidad externas.|Exige un horizonte convocante y desafiante que articule las expectativas de calidad integral en todo el territorio.",
        "51. ¿Qué define el concepto de “Trayectoria Educativa” a lo largo de la vida?|El recorrido que realizan las personas en todos los contextos posibles para consolidar y transformar sus aprendizajes a lo largo de sus vidas.|El camino diario que recorre un estudiante en microbús desde su casa al colegio.|La cantidad de años que un profesor permanece en un mismo establecimiento.|El registro de notas parciales de la asignatura de educación física.|Abarca todo el proceso de aprendizaje formal e informal que desarrollan las personas a lo largo de la vida.",
        "52. ¿Qué diferencia operativa existe entre “Trayectoria Educativa” y “Trayectoria Escolar”?|La trayectoria escolar se refiere específicamente a los procesos y resultados dentro del sistema escolar formal regular (niveles progresivos), el cual puede verse interrumpido por inasistencias o repitencia.|No existe ninguna diferencia, son exactamente sinónimos absolutos.|La trayectoria escolar solo ocurre fuera del establecimiento educacional.|La trayectoria educativa solo aplica para adultos en alfabetización.|La trayectoria escolar alude al tránsito formal por los niveles del sistema escolar regular (párvulo, básica, media), cautelando que no se interrumpa por exclusión o rezago.",
        "53. ¿Cómo debe concebirse el apoyo técnico-pedagógico desde los SLEP según el Modelo de Desarrollo de Capacidades de la DEP (2022)?|Como un proceso de acompañamiento diseñado para fortalecer las capacidades internas de las comunidades para enfrentar sus necesidades de mejora.|Como la imposición de recetas estandarizadas por parte de expertos externos.|Como una auditoría punitiva de notas y asistencia mensual.|Como una capacitación teórica sin aplicación práctica en el aula.|El apoyo técnico se enfoca en desarrollar autonomía y capacidades colectivas en las escuelas, no en la simple asistencia técnica externa.",
        "54. ¿Cuál es el propósito fundamental de las “Redes de Mejoramiento” impulsadas por el nivel intermedio?|Constituir espacios de acción y reflexión colectiva para transferir experiencias y generar conocimiento pedagógico contextualizado.|Competir entre escuelas para ver cuál expulsa más alumnos con bajo rendimiento.|Organizar eventos sociales y fiestas de fin de año para los funcionarios.|Centralizar la compra de materiales de aseo en una sola bodega comunal.|Las redes son vehículos de aprendizaje colaborativo entre pares para resolver problemas pedagógicos complejos.",
        "55. ¿Por qué es crucial el uso intensivo de datos y sistemas de información basados en evidencia para los líderes intermedios?|Para monitorear la calidad, evaluar el impacto de las prácticas, reorientar estrategias y priorizar recursos eficazmente.|Para archivar carpetas en bodegas oscuras sin lectura posterior.|Para sancionar públicamente a los profesores con menor puntaje SIMCE.|Para justificar la contratación de personal administrativo innecesario.|La toma de decisiones basada en evidencia garantiza que los recursos y apoyos se destinen a lo que efectivamente demuestra impacto.",
        "56. ¿Cuál es el objetivo principal del “Marco para la Gestión y el Liderazgo Educativo Local” (el Marco)?|Orientar la acción de los equipos directivos de nivel intermedio (SLEP) en su gestión, liderazgo, autodesarrollo y formación especializada.|Reemplazar por completo los manuales de convivencia escolar municipales.|Regular el mercado inmobiliario de los recintos educacionales privados.|Evaluar de forma punitiva a los centros de padres y apoderados.|Funciona como una guía estratégica no prescriptiva para fortalecer el desempeño de los líderes de los SLEP y sostenedores.",
        "57. ¿A qué cargos directivos superiores de los SLEP está enfocado primordialmente el Marco?|Director ejecutivo y subdirecciones de Apoyo Técnico Pedagógico, Planificación y Control de Gestión, y Administración y Finanzas.|Exclusivamente a los auxiliares de servicio y manipuladoras de alimentos.|Solo al centro de alumnos de los liceos bicentenario.|A los ministros de hacienda y del interior.|Está diseñado para el primer y segundo nivel jerárquico de los SLEP, aunque es útil para todo el equipo profesional y otros sostenedores.",
        "58. ¿En qué se diferencian principalmente el Marco para la Gestión y el Liderazgo Educativo Local y los Estándares Indicativos de Desempeño (EID)?|El Marco es un documento flexible de orientación de prácticas y recursos personales para el nivel intermedio; los EID abarcan lineamientos más generales y rígidos mediante rúbricas de logro.|El Marco es obligatorio bajo pena de arresto y los EID son voluntarios.|Los EID solo se aplican en universidades y el Marco en jardines infantiles.|No existe ninguna diferencia en su estructura ni propósitos.|El Marco detalla dimensiones de práctica y recursos personales específicos para el nivel intermedio, a diferencia de las rúbricas generales de los EID.",
        "59. ¿Cuáles son los dos grandes ámbitos que estructuran la arquitectura conceptual del Marco?|Dimensiones de prácticas y Recursos personales.|Infraestructura y Finanzas.|Leyes de la República y Decretos Supremos.|Matrícula y Subvención Escolar.|El Marco se compone de 6 dimensiones de prácticas y 3 tipos de recursos personales (principios, habilidades, conocimientos).",
        "60. ¿Cómo se definen las “prácticas” dentro del modelo del Marco?|Un conjunto de actividades ejercidas por personas en una organización que integran gestión y liderazgo con expectativas de resultados educativos compartidos.|Acciones mecánicas repetitivas sin reflexión previa.|Órdenes ministeriales de cumplimiento obligatorio e inmediato.|Reuniones sociales sin pautas de trabajo institucional.|Una práctica potente fusiona la gestión técnica con el liderazgo colaborativo y participativo.",
        "61. ¿Qué creencias y enfoques fundamentales (inspirados en L. Sharratt) sustentan el accionar de los equipos directivos locales?|Que todos los estudiantes pueden aprender, los docentes pueden mejorar con apoyo, y las expectativas altas y tempranas son esenciales.|Que solo un porcentaje pequeño de estudiantes puede aprender matemáticas complejas.|Que la selección escolar por notas garantiza la excelencia institucional.|Que las familias no deben intervenir en los asuntos pedagógicos de la escuela.|El sistema de creencias del Marco parte de la convicción profunda de que todos pueden aprender si cuentan con el tiempo y los apoyos necesarios.",
        "62. ¿Qué se define como “periodo de instalación” de un SLEP en la perspectiva progresiva del Marco?|Los primeros tres años efectivos más el año previo de anticipación (traspaso municipal), donde se organizan los procesos basales y los consejos.|Los primeros cinco minutos tras la firma del decreto de creación.|El último año de funcionamiento antes de la liquidación del servicio local.|El periodo en que las escuelas cierran por reparaciones de verano.|Corresponde al año de anticipación más los tres años efectivos de puesta en marcha de la estructura y gobernanza del servicio.",
        "63. ¿Cómo se denomina la etapa posterior al periodo de instalación en la gestión de un Servicio Local?|Etapa de consolidación.|Etapa de liquidación y cierre.|Etapa de municipalización inversa.|Etapa de concesión externa.|Tras la instalación inicial y el traspaso, el servicio entra en régimen o etapa de consolidación de sus procesos de mejora.",
        "64. ¿Cuál es el título exacto de la Dimensión de Práctica N° 1 del Marco?|Construyendo una visión compartida para el diseño y la implementación de una estrategia educativa territorial.|Gestionando los recursos financieros y la ley de compras públicas.|Desarrollando una cultura de bienestar y convivencia democrática.|Promoviendo el liderazgo pedagógico en el aula multigrado.|La Dimensión 1 se centra en la construcción participativa de la visión estratégica y el sentido territorial de la NEP.",
        "65. ¿Cuál es el desafío principal planteado en la Dimensión 1 (Visión compartida)?|Construir participativamente una visión estratégica del nivel intermedio para asegurar calidad integral, identidad, sello territorial y orgullo por lo público.|Reducir el presupuesto de los liceos técnicos profesionales.|Vender los bienes raíces municipales en desuso.|Aislar a las escuelas de la influencia de la comunidad civil.|Busca posicionar la educación pública como un valor social convocante, respetuoso de la diversidad y con altas expectativas.",
        "66. ¿Qué indica la evidencia de práctica N° 1 de la Dimensión 1 para los equipos de nivel intermedio?|Aseguran la instalación del Servicio en coordinación con municipios y actores territoriales, aprovechando las lecciones de otros SLEP.|Despiden a todos los profesores municipales en su primer día hábil.|Trasladan la oficina central a otra región del país.|Prohíben la postulación de nuevos estudiantes a los jardines infantiles.|La instalación requiere coordinación interinstitucional rigurosa basada en la experiencia acumulada de los primeros SLEP.",
        "67. ¿Qué busca la evidencia de práctica N° 3 de la Dimensión 1 en relación con el PEL?|Convocar a las comunidades a elaborar participativamente una visión compartida plasmada en el PEL, vinculada a la tradición y los PEI de los centros.|Mantener el PEL en secreto sin que nadie en las escuelas lo conozca.|Copiar un PEL genérico de internet sin adaptarlo a la región.|Modificar el PEL exclusivamente mediante decretos inconsultos.|El PEL debe construirse participativamente respetando la historia local y sintonizando con los PEI de cada unidad educativa.",
        "68. ¿Cuál es el título exacto de la Dimensión de Práctica N° 2 del Marco?|Desarrollando una cultura de participación, trabajo colaborativo y articulación con la comunidad educativa y actores sociales del entorno.|Supervisando la asistencia diaria mediante inspectores de zona.|Evaluando el desempeño individual de los asistentes de la educación.|Diseñando la infraestructura de los talleres mecánicos.|La Dimensión 2 releva la cultura de colaboración, redes y articulación con el entorno social y comunitario.",
        "69. ¿Qué establece la evidencia de práctica N° 2 de la Dimensión 2 sobre los órganos colegiados de la ley?|Convocar y apoyar el funcionamiento del Comité Directivo y el Consejo Local, estableciendo modalidades efectivas de colaboración.|Ignorar las recomendaciones del Comité Directivo y el Consejo Local.|Suprimir las reuniones plenarias de dichos consejos por falta de interés.|Reemplazar a los miembros elegidos por funcionarios designados a dedo.|Exige un trabajo coordinado y de respeto mutuo con las instancias colegiadas de participación ciudadana que crea la Ley 21.040.",
        "70. ¿Cuál es el título exacto de la Dimensión de Práctica N° 3 del Marco?|Promoviendo y apoyando el liderazgo pedagógico para el aprendizaje profundo en el territorio.|Administrando las remuneraciones y licencias médicas del personal.|Comprando equipamiento tecnológico para las oficinas administrativas.|Elaborando los balances contables anuales ante la DIPRES.|La Dimensión 3 focaliza la acción del nivel intermedio en el apoyo técnico-pedagógico directo para el aprendizaje profundo.",
        "71. ¿Qué destaca la evidencia de práctica N° 3 de la Dimensión 3 sobre el modelo de apoyo técnico-pedagógico?|Que debe ser un diseño con ciclos iterativos de mejoramiento, contextualizado a los marcos del sistema y enfocado en capacidades colectivas.|Que debe consistir en una única charla anual obligatoria en un auditorio.|Que debe prohibir la innovación metodológica en el aula.|Que debe aplicarse idénticamente en escuelas urbanas y rurales sin distinción.|El modelo de apoyo técnico debe ser iterativo, flexible y diferenciado según las particularidades de cada comunidad.",
        "72. ¿Qué aborda la evidencia de práctica N° 10 de la Dimensión 3 respecto a la educación Técnico-Profesional (TP)?|Fortalecer la modalidad TP resguardando su vinculación con sectores productivos, educación superior, alternancia y competencias docentes.|Su cierre definitivo por considerarla de alto costo financiero.|Transformar los talleres industriales en salas teóricas de lectura.|Eliminar las prácticas profesionales de los estudiantes de liceos técnicos.|La articulación con el entorno productivo y la alternancia son claves para la calidad de la educación Técnico-Profesional.",
        "73. ¿Cuál es el título exacto de la Dimensión de Práctica N° 4 del Marco?|Promoviendo el desarrollo y distribución de capacidades para la mejora continua de la educación en el territorio.|Fiscalizando el cumplimiento estricto del timbre de entrada a clases.|Centralizando la compra de uniformes escolares en la dirección ejecutiva.|Reduciendo las horas de formación continua para ahorrar presupuesto.|La Dimensión 4 pone el foco en la atracción, retención y desarrollo profesional continuo de directivos, docentes y asistentes.",
        "74. ¿Qué señala la evidencia de práctica N° 3 de la Dimensión 4 en relación con las capacidades profesionales?|Orientar estratégicamente la distribución equitativa en el territorio de las capacidades de liderazgo, docentes y asistentes según necesidades y contexto.|Concentrar a los mejores profesores exclusivamente en las oficinas del Servicio Local.|Sortear al azar los destinos laborales del profesorado sin importar su especialidad.|Impedir la movilidad de educadores entre establecimientos rurales y urbanos.|La equidad territorial exige distribuir inteligentemente el talento y las capacidades profesionales donde más se necesitan.",
        "75. ¿Cuál es el título exacto de la Dimensión de Práctica N° 5 del Marco?|Desarrollando una cultura de bienestar, inclusión y ciudadanía en el territorio.|Gestionando el presupuesto anual en la ley de compras públicas.|Diseñando la arquitectura de los edificios escolares antisísmicos.|Realizando auditorías financieras a los centros de padres.|La Dimensión 5 cautela el bienestar integral, la inclusión, la convivencia democrática y la formación ciudadana.",
        "76. ¿Cómo aborda la evidencia de práctica N° 6 de la Dimensión 5 la diversidad cultural?|Promoviendo la conciencia, reconocimiento y respeto a la identidad cultural de los pueblos originarios mediante diálogo crítico e interculturalidad.|Ignorando las tradiciones de los pueblos originarios en los actos oficiales.|Imponiendo un currículo único sin referencias a la historia local.|Prohibiendo el uso de lenguas nativas en los recintos educacionales.|La educación intercultural revaloriza la diversidad como un componente esencial de la calidad y la justicia socioeducativa.",
        "77. ¿Qué orienta la evidencia de práctica N° 8 de la Dimensión 5 respecto al género?|Apoyar a los equipos para desnaturalizar sesgos de género en prácticas pedagógicas, combatiendo el sexismo y los estereotipos.|Reforzar los estereotipos tradicionales de roles masculinos y femeninos.|Establecer colegios separados para varones y damas obligatoriamente.|Omitir cualquier análisis sobre equidad de género en las aulas.|Exige pensamiento crítico frente al sexismo y una práctica pedagógica libre de sesgos de género.",
        "78. ¿Cuál es el título exacto de la Dimensión de Práctica N° 6 del Marco?|Gestionando los recursos y condiciones institucionales para el desarrollo educativo en diferentes contextos territoriales.|Evaluando de forma punitiva a los centros de estudiantes.|Impartiendo clases magistrales de matemáticas en los SLEP.|Reduciendo el horario de atención de las oficinas locales.|La Dimensión 6 regula la administración transparente de recursos, finanzas, infraestructura, jurídica y condiciones logísticas.",
        "79. ¿Qué especifica la evidencia de práctica N° 5 de la Dimensión 6 sobre el apoyo jurídico?|Que el nivel intermedio debe prestar asesoría legal a las unidades educativas en normativas públicas, estatuto docente, asistentes, subvenciones y licitaciones.|Que los directores de escuela deben contratar abogados particulares con su propio sueldo.|Que las normas legales del sector público no aplican en los Servicios Locales.|Que los conflictos laborales se resuelven sin basarse en la legislación vigente.|El soporte jurídico oportuno es vital para dar seguridad operativa y apego a la probidad en la gestión de personas y recursos.",
        "80. ¿Qué establecen los “Recursos Personales” en la arquitectura del Marco?|Un conjunto de principios, habilidades y conocimientos que respaldan y legitiman el quehacer de las y los líderes intermedios.|Que son adornos decorativos sin impacto en la gestión de los directivos.|La cantidad de dinero que posee cada funcionario en su cuenta corriente personal.|Los muebles de oficina asignados a cada subdirección del SLEP.|Los recursos personales (principios, habilidades y conocimientos) sustentan la efectividad de las prácticas de liderazgo.",
        "81. ¿Cuáles son los cuatro principios fundamentales seleccionados en el Marco que guían la conducta de las y los líderes intermedios?|Ética y probidad, Justicia socioeducativa, Confianza, y Vocación de servicio público.|Competencia, lucro, individualismo y velocidad.|Burocracia, centralismo, rigidez y autoritarismo.|Indiferencia, opacidad, despilfarro y jerarquía extrema.|Estos cuatro principios éticos y valóricos universales orientan transversalmente todas las decisiones del nivel intermedio.",
        "82. ¿Cómo se define el principio de “Ética y Probidad” en el documento?|La capacidad de actuar con honestidad, lealtad e integridad, privilegiando el interés general y el valor público por sobre el particular.|La habilidad de omitir información financiera ante la Contraloría General.|El derecho a recibir gratificaciones ocultas por gestión de contratos.|La discrecionalidad absoluta en el manejo de fondos fiscales.|Demanda consistencia entre valores declarados y conductas intachables al servicio de la función pública.",
        "83. ¿Qué implica el principio de “Justicia Socioeducativa”?|Un imperativo ético y político de igualdad de oportunidades y enfoque de derechos donde toda la comunidad se compromete con el éxito educativo.|Castigar judicialmente a los estudiantes con bajas calificaciones.|Seleccionar a los alumnos con mejores recursos económicos para las escuelas de élite.|Limitar el acceso a la educación según el origen geográfico.|Trasciende la justicia tradicional al exigir compromiso activo con la equidad y el derecho humano a aprender.",
        "84. ¿Por qué se considera la “Confianza” un principio y una capacidad básica en el sistema educativo?|Porque es la base de toda relación interpersonal e institucional necesaria para viabilizar procesos de cambio y mejora colaborativa.|Porque permite relajar las normas de seguridad sanitaria en los colegios.|Porque evita tener que rendir cuentas de los gastos realizados ante la DIPRES.|Porque reemplaza la necesidad de planificar las actividades anuales.|La confianza relacional (benevolencia, competencia, honestidad, apertura) es el pegamento que sostiene cualquier reforma sistémica.",
        "85. ¿Qué define la “Vocación de servicio público” en los profesionales de la educación pública?|La motivación por estar al servicio de los demás, reconociendo la responsabilidad social del Estado en la vida de las personas.|El deseo de postular a cargos de elección popular en los municipios.|Trabajar el menor tiempo posible recibiendo el máximo sueldo fiscal.|Atender exclusivamente trámites de carácter mercantil privado.|Es la mística y compromiso ético con el rol habilitador del Estado para el desarrollo humano y la cohesión social.",
        "86. ¿En cuántas categorías se agrupan las “Habilidades” esenciales para los líderes intermedios según el Marco?|En 4 categorías que agrupan 11 habilidades conductuales y técnicas.|En 2 categorías simples.|En 10 categorías independientes sin relación entre sí.|No se clasifican en categorías en absoluto.|Se agrupan en 4 grupos: analizar problemáticas complejas, convocar hacia un objetivo común, relacionarse con la comunidad y enfrentarse a un mundo cambiante.",
        "87. ¿Qué comprende la categoría de habilidades “para analizar problemáticas complejas”?|Pensamiento sistémico y Reflexión.|Oratoria comercial y marketing institucional.|Contabilidad bancaria y auditoría de bodegas.|Redacción de cartas notariales de despido.|Involucra ver el ecosistema interconectado (pensamiento sistémico) y problematizar la realidad para aprender de la experiencia (reflexión).",
        "88. ¿Qué define la habilidad de “Pensamiento sistémico”?|La capacidad de analizar interrelaciones complejas en un sistema multinivel, comprendiendo que los esfuerzos aislados no bastan sin articulación.|La capacidad de aislar un problema escolar ignorando el resto de la organización.|La habilidad de memorizar organigramas ministeriales de memoria.|La tendencia a reducir los problemas educativos a meras cifras contables.|Permite entender las dinámicas interconectadas del sistema escolar reconociendo que el cambio requiere coherencia macro, meso y micro.",
        "89. ¿Qué implica la habilidad de “Reflexión” (o reflexión crítica) en el líder intermedio?|Un proceso mental para problematizar la experiencia, cuestionar supuestos y generar nuevo conocimiento para mejorar la práctica profesional (Schön).|Mirarse al espejo antes de ingresar a una reunión ejecutiva.|Demorar semanas enteras en responder un correo electrónico rutinario.|Repetir manuales de instrucciones sin analizarlos críticamente.|La práctica reflexiva es la base del aprendizaje profesional continuo y la superación de errores.",
        "90. ¿Qué habilidades incluye la categoría “para convocar hacia un objetivo común”?|Liderazgo educativo, Escucha activa y Colaboración.|Imposición jerárquica, Sanción y Coerción.|Competencia desleal y Marketing político.|Aislamiento burocrático y Silencio administrativo.|Movilizar equipos requiere liderazgo distribuido, empatía en la escucha y trabajo colaborativo basado en confianza.",
        "91. ¿Qué exige el desarrollo de la “Escucha activa” en los equipos directivos intermedios?|Ponerse en el lugar del otro, dejar de lado paradigmas propios, controlar emociones y comprender perspectivas ajenas para articular demandas.|Oír sin prestar atención mientras se revisa el teléfono celular.|Interrumpir al interlocutor para imponer la postura oficial de la dirección.|Responder de inmediato con descalificaciones ante cualquier crítica.|Es una habilidad clave y desafiante para canalizar información y articular los distintos estamentos del sistema.",
        "92. ¿Qué define la habilidad de “Colaboración”?|La capacidad de convocar a un trabajo en equipo basado en cooperación, participación y contribución mutua hacia metas compartidas.|La competencia feroz por obtener más recursos fiscales que otros SLEP.|El trabajo solitario de cada departamento sin cruzar información.|La contratación exclusiva de consultores externos extranjeros.|La colaboración es la palanca fundamental para transferir experiencias y construir capacidad sistémica.",
        "93. ¿Qué habilidades comprende la categoría “para relacionarse con la comunidad”?|Articulación y alianzas, y Comunicación efectiva.|Criptografía y seguridad informática avanzada.|Mecánica automotriz y construcción civil.|Archivística y biblioteconomía clásica.|Conectar el servicio con stakeholders y transmitir mensajes oportunos y claros es vital para la legitimidad territorial.",
        "94. ¿Qué implica la habilidad de “Articulación y alianzas”?|Identificar actores clave (stakeholders) y generar alianzas estratégicas interinstitucionales que aporten valor y soluciones colectivas.|Aislar a la institución educativa de cualquier organización social externa.|Firmar convenios comerciales con fines de lucro personal.|Evitar reuniones con municipios y gobiernos regionales.|Permite sumar recursos, voluntades y alianzas territoriales en favor de la calidad educativa.",
        "95. ¿Qué características debe poseer una “Comunicación efectiva” en el nivel intermedio?|Transmisión oportuna, clara y adaptada a las audiencias, fomentando la comprensión y retroalimentación mediante canales formales definidos.|Mensajes ambiguos que dejen espacio a múltiples interpretaciones erróneas.|Uso exclusivo de memorandos impresos distribuidos con meses de retraso.|Prohibición total de canales digitales o virtuales de contacto.|Una comunicación transparente y dirigida reduce la incertidumbre y alinea a las comunidades con los objetivos estratégicos.",
        "96. ¿Qué habilidades incluye la categoría “para enfrentarse a un mundo cambiante”?|Mediación y resolución de conflictos, Manejo de crisis y contingencias, y Agilidad para el aprendizaje.|Rigidez burocrática, Negación de problemas e Inercia operativa.|Cierre temporal indefinido ante el menor imprevisto.|Delegación absoluta de responsabilidades en terceros ajenos.|Navegar en entornos volátiles exige flexibilidad mediadora, resiliencia ante crisis y mentalidad de crecimiento.",
        "97. ¿En qué consiste la habilidad de “Mediación y resolución de conflictos”?|Facilitar consensos oportunos entre partes en pugna mediante estrategia, método y flexibilidad, comprendiendo el origen del problema.|Imponer sanciones drásticas sin escuchar a las partes en disputa.|Fomentar divisiones internas para debilitar a los sindicatos escolares.|Ignorar los conflictos hasta que escalen judicialmente.|El líder intermedio actúa como moderador de tensiones para restablecer acuerdos de convivencia constructivos.",
        "98. ¿Qué demanda la habilidad de “Manejo de crisis y contingencia”?|La capacidad de identificar y administrar situaciones emergentes de presión, reconfigurando recursos para asegurar la continuidad del servicio educativo.|Declarar estado de sitio administrativo y suspender labores por tiempo indefinido.|Ocultar los problemas a la comunidad hasta que aparezcan en la prensa.|Culpar al nivel central de cualquier imprevisto local.|Exige respuesta ágil, oportuna y contextualizada frente a catástrofes, emergencias o dilemas operativos críticos.",
        "99. ¿Qué define la “Agilidad para el aprendizaje” (Learning Agility) vinculada a la mentalidad de crecimiento (Carol Dweck)?|La voluntad para innovar, aprender de la experiencia pasada y aplicar esos aprendizajes para desempeñarse con éxito ante nuevos desafíos.|La creencia fija de que la inteligencia y las capacidades no pueden desarrollarse jamás.|La memorización rápida de normativas legales sin cuestionar su vigencia.|La negativa rotunda a aceptar capacitaciones tecnológicas.|Es la apertura mental y resiliencia para adquirir nuevas destrezas frente a escenarios inéditos o complejos.",
        "100. ¿En cuántos grandes bloques de saberes se estructuran los “Conocimientos profesionales” requeridos en el Marco?|En tres bloques: Política educativa y relaciones con la comunidad, Enseñanza efectiva y desarrollo docente, y Planificación, liderazgo y gestión.|En un solo bloque general indivisible.|En cinco bloques enfocados solo en contabilidad municipal.|En dos bloques de carácter estrictamente jurídico.|Abarcan el dominio macro de políticas, el dominio técnico pedagógico y el dominio gerencial/estratégico.",
        "101. ¿Qué saberes comprende el bloque de “Política educativa y relaciones con la comunidad”?|Tendencias en educación, Políticas e institucionalidad educativa, y Gobernanza educativa y coherencia sistémica.|Mecánica de suelos y cálculo estructural de fundaciones.|Nutrición infantil y dietética de comedores escolares.|Logística de transporte de pasajeros interurbanos.|Exige dominar el marco normativo, la gobernanza multinivel y las tendencias conceptuales contemporáneas.",
        "102. ¿Por qué es fundamental que el equipo intermedio conozca las “Tendencias en educación”?|Para mediar e impulsar prácticas sostenibles basadas en enfoques vigentes como derechos, género, bienestar, inclusión, ciudadanía y aprendizaje profundo.|Para repetirlas en discursos formales sin comprender su aplicación.|Para comercializar material didáctico importado en los colegios.|Para justificar la eliminación del currículo nacional obligatorio.|Actualizar los paradigmas pedagógicos permite al líder intermedio alinear los desafíos del siglo XXI con la gestión territorial.",
        "103. ¿Qué implica el dominio de “Políticas e institucionalidad educativa”?|Familiarizarse con el ordenamiento jurídico chileno, funciones del SAC, roles institucionales y articulación de instrumentos de la política pública.|Desconocer los dictámenes de la Contraloría y las leyes orgánicas constitucionales.|Redactar leyes de la república desde la oficina del SLEP.|Modificar la Constitución a través de circulares internas.|El conocimiento normativo asegura la gobernabilidad, el apego legal y la coherencia del sistema escolar público.",
        "104. ¿A qué se refiere el conocimiento de “Gobernanza educativa y coherencia sistémica”?|A la distribución de decisiones y responsabilidades entre niveles (macro, meso, micro) para alinear la planificación y la enseñanza efectiva.|Al control jerárquico autoritario de los ministerios sobre los profesores de aula.|A la autonomía financiera ilimitada de cada docente en su sala de clases.|A la supresión de los directores de establecimientos educacionales.|Comprender la arquitectura de gobernanza previene la fragmentación y asegura que todas las capas remen hacia el núcleo pedagógico.",
        "105. ¿Qué saberes comprende el bloque de “Enseñanza efectiva y desarrollo docente”?|Gestión del currículo, Procesos de aprendizaje, Evaluación de aprendizajes, Trayectoria escolar y Desarrollo profesional.|Presupuesto de ingresos fiscales y contabilidad gubernamental de la DIPRES.|Mantenimiento de calderas y reparación de techumbres escolares.|Licitaciones de compras públicas y ley de compras.|Son los saberes medulares vinculados directamente a la mejora del núcleo pedagógico y la calidad del aprendizaje.",
        "106. ¿Qué implica el conocimiento sobre la “Gestión del currículo” para los equipos intermedios?|Conocer la arquitectura del currículo nacional (OA, objetivos transversales, ejes, habilidades) para apoyar su apropiación y planificación didáctica.|Imprimir textos escolares y almacenarlos en bodegas sin distribuir.|Modificar los programas de estudio ministeriales de forma arbitraria en cada comuna.|Eliminar las asignaturas humanistas en favor de talleres deportivos.|El dominio curricular capacita al líder intermedio para orientar pedagógicamente a los directivos y docentes.",
        "107. ¿Qué abarca el conocimiento sobre “Procesos de aprendizaje”?|Comprender cómo aprende el ser humano en distintos niveles (parvularia, básica, media, TP, ruralidad) considerando la cognición y la metacognición.|Cronometrar la velocidad con que los alumnos copian materia del pizarrón.|Clasificar a los estudiantes según su coeficiente intelectual hereditario.|Descartar el uso de metodologías innovadoras en zonas rurales.|Conocer las teorías y dinámicas del aprendizaje permite promover prácticas de enseñanza más eficaces y pertinentes.",
        "108. ¿Qué distingue el conocimiento sobre “Evaluación de aprendizajes” en el nivel intermedio?|Conocer metodologías de evaluación (para el aprendizaje, del aprendizaje, como aprendizaje), instrumentos, análisis de datos y pruebas estandarizadas (SAC).|La aplicación punitiva de pruebas de selección múltiple cada semana.|Falsear los registros de notas para mejorar las estadísticas comunales.|Suprimir cualquier tipo de calificación formal en la enseñanza media.|Permite interpretar con rigor técnico las evidencias evaluativas internas y externas para retroalimentar la mejora.",
        "109. ¿Qué responsabilidad implica el conocimiento de la “Trayectoria educativa”?|Monitorear el tránsito escolar año a año, detectando tempranamente riesgos de exclusión, rezago o deserción para articular apoyos oportunos.|Permitir que los alumnos abandonen el colegio a los 12 años sin restricciones.|Obligar a repetir de curso a todo estudiante que presente inasistencias esporádicas.|Registrar únicamente la asistencia mensual para el cálculo de subvenciones.|Cautelar las trayectorias positivas desde la educación inicial es una garantía de equidad y retención escolar.",
        "110. ¿Qué comprende el dominio del “Desarrollo profesional”?|Manejar conceptos de selección, inducción, retención, evaluación y formación continua de equipos directivos y docentes según la política educativa.|Contratar personal sin concursos públicos transparentes.|Reducir los presupuestos destinados a perfeccionamiento docente.|Reemplazar la carrera docente por contratos a honorarios indefinidos.|Fortalece las capacidades del talento humano mediante planes de formación contextualizados y basados en estándares profesionales.",
        "111. ¿Qué saberes comprende el bloque de “Planificación, liderazgo y gestión”?|Liderazgo y cultura organizacional, Teoría del cambio, Planificación estratégica, Redes, RRHH, Finanzas, Efectividad, Evidencia y Ley orgánica del servicio público.|Exclusivamente la redacción de actas de reuniones de profesores.|La contabilidad de costos de empresas privadas con fines de lucro.|La administración de parques y jardines municipales.|Agrupa los saberes gerenciales, estratégicos y organizacionales indispensables para administrar un Servicio Local.",
        "112. ¿Qué aporta el conocimiento de “Liderazgo y cultura organizacional”?|Comprender estilos de liderazgo, valores y estrategias para motivar equipos, reconocer talentos y gestionar la diversidad cultural de las comunidades.|Imponer directrices verticales mediante memorandos amenazantes.|Uniformar el pensamiento de todos los funcionarios suprimiendo el debate.|Aislar a la dirección de los problemas cotidianos de las escuelas.|Facilita la distribución de capacidades y la construcción de culturas escolares orientadas al aprendizaje.",
        "113. ¿Qué es una “Teoría del cambio o acción” en la gestión intermedia?|Un conjunto de suposiciones explícitas sobre cómo y por qué ciertas acciones e intervenciones generarán los resultados de mejora esperados.|Un cambio repentino de autoridades políticas tras cada elección municipal.|La modificación arbitraria de los sueldos del personal administrativo.|Un documento secreto que no puede ser compartido con las escuelas.|Declarar una teoría del cambio alinea la estrategia con los planes operativos y permite evaluar brechas entre teoría y práctica.",
        "114. ¿Qué distingue la “Planificación estratégica y gestión de proyectos”?|Dominar técnicas para formular visión, misión, objetivos estratégicos, indicadores, hitos y gestión presupuestaria de proyectos educativos.|La improvisación diaria de actividades sin objetivos claros.|Copiar proyectos ejecutados en otros países sin adaptarlos al territorio.|Delegar la elaboración del presupuesto en agencias externas sin control.|Asegura que la ejecución operativa responda rigurosamente a las metas de mediano y largo plazo.",
        "115. ¿Qué implica la “Gestión y trabajo en redes”?|Construir relaciones de colaboración y alianzas con personas y organizaciones clave para respaldar las metas institucionales y territoriales.|Competir aisladamente con otras instituciones educativas vecinas.|Utilizar redes sociales personales para difundir asuntos administrativos reservados.|Prohibir el intercambio de experiencias entre directores de escuela.|El capital social en red moviliza recursos y saberes amplios que superan las fronteras de una sola escuela.",
        "116. ¿Qué abarca la “Administración de recursos humanos y gestión del talento”?|Aplicar la carrera docente, normativa de contratación (ADP), remuneraciones, inducción, desarrollo y procesos de desvinculación con probidad.|Contratar familiares sin importar sus competencias profesionales.|Omitir los procesos de concurso público en la selección de directivos.|Reducir las jornadas de trabajo por debajo de los mínimos legales.|Armoniza el cumplimiento normativo estatutario con el desarrollo y bienestar del talento humano en la organización.",
        "117. ¿Qué exige la “Administración de recursos financieros y rendición de cuentas”?|Manejar la contabilidad pública, control presupuestario y transparencia bajo estándares estrictos para asegurar el uso pedagógico de los fondos.|Ocultar los comprobantes de gastos ante los órganos fiscalizadores.|Utilizar los recursos fiscales en gastos ajenos a la función educativa.|Delegar las finanzas en personas sin competencias acreditadas.|La probidad financiera y la rendición de cuentas son pilares ineludibles de la gestión en el sector público.",
        "118. ¿Qué aporta el conocimiento sobre la “Efectividad de las unidades educativas y del nivel intermedio”?|Identificar los factores organizacionales y prácticas que caracterizan a escuelas y niveles intermedios exitosos para replicarlas.|Asumir que todas las escuelas funcionan igual y no requieren apoyos diferenciados.|Culpar exclusivamente a los estudiantes de los resultados deficientes.|Ignorar la investigación educativa empírica internacional.|Conocer qué hace efectiva a una escuela orienta el diseño de las estrategias de apoyo territorial.",
        "119. ¿Por qué es crucial la “Información, análisis de datos y decisiones basadas en evidencia”?|Porque permite monitorear la calidad, evaluar avances y asignar recursos a las intervenciones comprobadamente más efectivas.|Para llenar planillas Excel que nadie lee ni analiza.|Para enmascarar los problemas reales mediante estadísticas ficticias.|Para reemplazar el juicio profesional de los docentes por algoritmos automáticos.|Las decisiones informadas por datos confiables y oportunos evitan la intuición infundada en la gestión.",
        "120. ¿Qué particularidades tiene el “Funcionamiento y lógica del servicio público chileno (administración del Estado)” para los SLEP?|Rige bajo la Ley de Presupuestos y normas de contabilidad gubernamental/compras públicas, exigiendo romper inercias de la gestión municipal previa.|Opera exactamente igual que una empresa comercial privada con fines de lucro.|No está sujeto a fiscalización de la Contraloría General de la República.|Permite la discrecionalidad absoluta en la adjudicación de fondos.|La transición del municipio al servicio público estatal exige un cambio cultural de adaptación a las reglas de la administración del Estado.",
        "121. ¿Qué comprende la “Gestión y vinculación territorial”?|Coordinarse con actores locales, municipios y organizaciones para facilitar el traspaso, apoyar los PEI/PME y articular la coherencia de instrumentos.|Mantener el SLEP aislado en una oficina central sin contacto con las comunas.|Intervenir políticamente en las decisiones internas de las municipalidades vecinas.|Desentenderse de las necesidades específicas de las comunidades rurales.|La pertinencia territorial asegura que la política pública dialogue armónicamente con las realidades locales.",
        "122. ¿Quiénes fueron algunos de los autores de la primera versión del Marco para la Gestión y el Liderazgo Educativo Local en 2017?|Uribe, M., Berkowitz, D., Torche, P., Galdames, S. y Zoro, B.|Próceres de la independencia nacional de Chile.|Expertos internacionales en economía neoliberal pura.|Autores anónimos sin registro académico.|La primera versión de 2017 fue elaborada por el equipo de Líderes Educativos liderado por M. Uribe y colaboradores.",
        "123. ¿Qué autores lideraron la autoría de la segunda versión actualizada del Marco en 2025?|Uribe, M., Aziz dos Santos, C., Berkowitz, D., Galdames, S., Torche, P. y Zoro, B.|Solo directores de colegios particulares subvencionados.|Ministros de hacienda en ejercicio.|Comisiones parlamentarias de legislación escolar.|Esta segunda versión incorpora aprendizajes recientes de los SLEP bajo la coordinación de C Líder.",
        "124. ¿Qué institución patrocinó formalmente la actualización 2025 de este Marco mediante la REX N°2803?|La Dirección de Educación Pública (DEP)|El Banco Central de Chile|El Colegio de Periodistas|Las Fuerzas Armadas de la Nación|La DEP avala y patrocina institucionalmente el uso de este marco orientador.",
        "125. ¿Qué se destaca en la presentación del documento respecto al rol de la escuela en la historia (citando a José Abelardo Núñez en 1889)?|Que la escuela moderna debe sustituir la memoria mecánica por el juicio, la investigación, la comparación y el espíritu que juzga.|Que la escuela debe basarse en la repetición memorística y la letra muerta de los textos.|Que la enseñanza debe prohibir el uso de la inteligencia crítica.|Que la educación primaria no requiere modificaciones pedagógicas.|El Congreso Pedagógico de 1889 ya clamaba por una escuela activa que desarrolle la inteligencia investigativa por sobre la memorización pasiva.",
        "126. ¿Qué frase célebre de City, Elmore, Fiarman y Teitel (2009) se incluye al inicio del documento sobre el aprendizaje profesional?|Aprendemos a hacer el trabajo haciendo el trabajo...|El trabajo escolar se aprende leyendo manuales teóricos sin práctica...|Contratar expertos externos reemplaza la práctica del docente...|La teoría pedagógica no requiere experimentación en el aula...|Destaca que el desarrollo de capacidades ocurre ejecutando y reflexionando sobre la práctica real, no por mera instrucción teórica.",
        "127. ¿Qué aspectos críticos identificaron los estudios de instalación (como el Consejo de Evaluación 2021) en los primeros años de los SLEP?|Obstáculos como la falta de validación inicial, problemas de conectividad territorial, complejidad en contrataciones y coherencia de roles.|La validación perfecta e inmediata por parte de todas las comunidades sin ningún conflicto.|Exceso de recursos financieros sin saber en qué gastarlos.|Cero problemas administrativos en el traspaso municipal.|La evaluación intermedia evidenció tensiones de instalación, distancias geográficas y la necesidad de afinar la gobernanza territorial.",
        "128. ¿Cómo se vincula el Plan Anual Local (PAL) con el Plan Estratégico Local (PEL)?|El PAL operacionaliza anualmente los objetivos de mediano plazo definidos en el PEL y los reporta al Comité Directivo y Consejo Local.|El PAL anula por completo lo establecido en el PEL.|El PAL es un documento financiero que no tiene relación con la pedagogía.|El PEL se elabora cada año y el PAL cada seis años.|El PAL traduce a metas de corto plazo (anuales) la estrategia de mediano plazo contenida en el PEL.",
        "129. ¿Qué rol juegan los Convenios de Gestión Educacional suscritos por los directores ejecutivos de los SLEP?|Establecer metas de desempeño a 6 años evaluadas por la DEP para medir la continuidad del cargo.|Garantizar vacaciones indefinidas para los directivos superiores.|Fijar los precios de arriendo de la infraestructura escolar privada.|Eximir al director de cualquier rendición de cuentas pública.|El convenio vincula el desempeño directivo con el cumplimiento de los objetivos de la NEP y la ENEP.",
        "130. ¿Por qué el nivel intermedio no debe ser visto solo como un “adaptador” o “bisagra” de políticas, según el texto?|Porque debe ser un potenciador, diseñador e implementador activo de estrategias pedagógicas con pertinencia territorial.|Porque los ministerios no deben emitir orientaciones de ningún tipo.|Porque los administradores locales tienen prohibido hablar con el nivel central.|Porque las leyes nacionales no aplican en las regiones.|La institucionalidad intermedia posee un rol estratégico creador de capacidades y sentido local, no una mera polea de transmisión pasiva.",
        "131. ¿Qué relación existe entre la descentralización de los SLEP y las economías de escala?|Los SLEP se diseñaron a una escala territorial mayor que la comunal para lograr economías de escala y viabilidad técnica/administrativa.|Los SLEP operan a una escala microscópica dentro de cada manzana urbana.|La escala territorial no tiene ninguna incidencia en los costos operativos.|Cada escuela debe financiarse de forma independiente sin apoyo supracomunal.|Agrupar comunas en Servicios Locales busca superar la debilidad financiera y de escala de los pequeños municipios.",
        "132. ¿Qué desafío imponen los territorios extensos o aislados geográficamente a algunos SLEP?|Dificultades de conectividad que hacen aconsejable instalar oficinas locales en zonas aisladas para asegurar participación y cercanía.|Ninguno, la conectividad es homogénea en todo el país.|La obligación de cerrar todas las escuelas rurales de la zona.|La prohibición de trasladar docentes entre comunas contiguas.|El Consejo de Evaluación recomendó abrir oficinas zonales en territorios extensos para mitigar las distancias y facilitar el vínculo.",
        "133. ¿Qué se busca evitar al clarificar los roles de apoyo entre la SEREMI, el DEPROV y los SLEP?|La duplicidad de roles y funciones, asegurando que SEREMI y DEPROV actúen como agentes de apoyo permanente al nuevo liderazgo intermedio del SLEP.|Que los colegios reciban demasiado apoyo técnico simultáneo.|Que el Ministerio de Educación supervise a los establecimientos públicos.|Que los profesores tengan demasiadas horas no lectivas.|Una articulación limpia evita la superposición de funciones y consolida un sistema público coordinado.",
        "134. ¿Cómo impacta la Visita Integral de Evaluación de la Agencia de Calidad en la gestión del SLEP?|Genera informes orientadores basados en el PEL que permiten a la Unidad de Apoyo Técnico Pedagógico perfeccionar sus estrategias y herramientas de gestión.|Aplica multas en dinero efectivo a los directores ejecutivos con bajo rendimiento.|Ordena el cierre inmediato de los establecimientos evaluados negativamente.|Modifica unilateralmente el presupuesto anual aprobado por la DIPRES.|Las visitas de la Agencia buscan retroalimentar y orientar el despliegue estratégico del Servicio Local.",
        "135. ¿Por qué es crítica la información de convenios previos (con MINEDUC, Salud, Desarrollo Social) al momento del traspaso municipal?|Para asegurar la continuidad de los programas de apoyo intersectorial que benefician directamente a los estudiantes sin interrumpir el servicio.|Para cancelar todos los convenios vigentes sin excepción.|Para traspasar las deudas de los municipios a las cuentas personales de los apoderados.|Carece de importancia ya que los convenios municipales caducan automáticamente.|La pérdida de trazabilidad de convenios intersectoriales en el traspaso puede afectar programas sociales críticos en las escuelas.",
        "136. ¿Qué función cumple el Servicio Civil en el diseño institucional de los SLEP?|Intermediar y regular los procesos de selección mediante el Sistema de Alta Dirección Pública (ADP) para cargos jerárquicos.|Nombrar a los profesores de aula de cada asignatura mediante sorteo.|Administrar las remuneraciones mensuales de los asistentes de la educación.|Fijar las calificaciones de los alumnos de enseñanza media.|El ingreso por Alta Dirección Pública (Ley 19.882) cautela la idoneidad y probidad en los altos cargos de los SLEP.",
        "137. ¿Qué rol juega la equidad de género en la visión del liderazgo intermedio según el Marco?|Un requisito normativo y ético para eliminar barreras, prevenir violencia de género y asegurar trayectorias sin sesgos sexistas.|Un asunto menor que se resuelve de manera espontánea sin intervención directiva.|Una directriz aplicable exclusivamente en la educación parvularia.|Una temática ajena a las responsabilidades de los Servicios Locales.|El liderazgo intermedio debe velar activamente por la equidad de género en todo el sistema escolar.",
        "138. ¿Cómo se relaciona el aprendizaje socioemocional con el rendimiento cognitivo según el documento?|El bienestar emocional y el desarrollo socioemocional son bases habilitadoras indispensables para lograr aprendizajes profundos y un clima propicio.|Son dimensiones separadas que compiten por el tiempo lectivo en el aula.|El desarrollo socioemocional entorpece el avance de los planes de estudio formales.|Solo es relevante en situaciones de emergencia sanitaria o catástrofe.|No hay aprendizaje cognitivo de calidad si no existen climas de bienestar, contención y regulación emocional.",
        "139. ¿Qué implica la corresponsabilidad en el enfoque de redes socioeducativas?|Que escuelas, familias, Estado, sector privado y sociedad civil comparten la responsabilidad de educar y bienestar del estudiantado.|Que la educación es tarea exclusiva del Estado sin participación de familias ni comunidad.|Que los padres de familia asumen la responsabilidad financiera total de los colegios públicos.|Que los municipios responden legalmente de por vida por los colegios traspasados.|La corresponsabilidad articula a múltiples actores del territorio en torno al éxito educativo.",
        "140. ¿Qué se espera de los directivos noveles en términos de inducción según el Marco (Dimensión 4)?|Recibir procesos de inducción, acompañamiento y modelamiento en terreno para fortalecer su liderazgo directivo y colaboración entre pares.|Que aprendan a “prueba y error” sin ningún tipo de acompañamiento en terreno.|Asumir el cargo sin conocer las normativas de la Nueva Educación Pública.|Ser evaluados punitivamente en su primera semana de gestión.|El apoyo a directivos noveles es crucial para evitar el aislamiento y consolidar prácticas efectivas desde el inicio."
    ]};
    const app=document.getElementById("app");

        const qs=shuf(DOC.q).map(s=>{const p=s.split("|");return{t:p[0],c:p[1],o:shuf(p.slice(1,5)),f:p[5]||""}});
        st={qs,n:0,ok:0};show();

        const q=st.qs[st.n];

        '<div class="box"><small>Pregunta '+(st.n+1)+' de '+st.qs.length+'</small><h3>'+q.t+'</h3><div id="o"></div><div id="f"></div></div>';

    }
    function answer(b,t,q){
        [...document.querySelectorAll(".opt")].forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.classList.add("ok")});
        if(t===q.c)st.ok++;else b.classList.add("ko");
        const last=st.n===st.qs.length-1;
        document.getElementById("f").innerHTML=(q.f?'<p class="fb"><b>'+(t===q.c?"✔ Correcto. ":"✘ Incorrecto. ")+'</b>'+q.f+'</p>':'')+'<button class="btn" onclick="next()">'+(last?"Ver resultado":"Siguiente")+'</button>';
    }
    function next(){st.n++;st.n<st.qs.length?show():result()}
    function result(){
        const p=Math.round(st.ok/st.qs.length*100);
        app.innerHTML='<div class="box"><h2>Resultado: '+st.ok+' / '+st.qs.length+' ('+p+'%)</h2><p>'+(p>=80?"¡Excelente dominio!":p>=60?"Buen avance, repasa los errores.":"Sigue practicando, ¡tú puedes!")+'</p><button class="btn" onclick="start()">Reintentar</button><a class="btn g" href="../index.html">Volver al Panel</a></div>';
    }
    start();
    </script>
</body>
</html>
